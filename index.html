function renderWaterfall(){
  const s=sec('s-wf','17','Product profitability waterfall','Where ₹100 of revenue goes');
  pidNote(s);
  const rows=fpv().filter(r=>r.v.units>0).sort((a,b)=>b.v.netRev-a.v.netRev);
  if(!rows.length){naBox(s,'No SKU with sales in the current filter.','Clear the filters.');return;}
  const c=card(s,'Waterfall','pick a product and a basis');
  c.insertAdjacentHTML('beforeend',`<div class="simbar">
    <div class="fg"><label>Product</label><select id="wfSku"></select></div>
    <div class="fg"><label>Period</label><select id="wfPer"></select></div>
    <div class="seg" id="wfBasis"><button data-b="unit" class="on">Per unit</button>
      <button data-b="tot">Total ₹</button><button data-b="pct">Per ₹100 of MRP</button></div></div>
    <div id="wfOut"></div>`);
  const sel=$('#wfSku'), selP=$('#wfPer');
  sel.innerHTML=`<option value="__ALL__">Portfolio (all filtered SKUs)</option>`+
    rows.map(r=>`<option value="${esc(r.p.code+'|'+r.p.name)}">${esc(r.p.code)} — ${esc(r.p.name.slice(0,54))}</option>`).join('');
  selP.innerHTML=PIDS.map(i=>`<option value="${i}">${esc(PMETA[i].label)}</option>`).join('')+
    `<option value="__ALLP__">Apr–Aug combined</option>`;
  selP.value=timePids().length>1?'__ALLP__':timePids()[0];
  let basis='unit';
  function wfRun(){
    const host=$('#wfOut'); host.innerHTML='';
    const pid=selP.value, pids=pid==='__ALLP__'?PIDS:[pid];
    let v,label;
    if(sel.value==='__ALL__'){v=aggRec(PROD.filter(p=>fp().includes(p)).flatMap(p=>pids.map(i=>p.per[i]).filter(Boolean)));
      label='Portfolio';}
    else{const p=PROD.find(x=>x.code+'|'+x.name===sel.value);
      if(!p)return; v=pv(p,pids); label=p.name;}
    if(!v||!v.units){naBox(host,`${esc(label)} recorded no sales in this period.`,'Pick another period.');return;}
    const k = basis==='tot'?v.units : basis==='pct'?(100/v.mrp) : 1;
    const fmt = basis==='tot'?RL:R1;
    const items=[
      {label:'MRP',value:v.mrp*k,type:'total',color:C.navy},
      {label:'Discount',value:-v.disc*k,color:C.amber},
      {label:'GST',value:-((v.mrp-v.disc)-(v.mrp-v.disc)/GST)*k,color:C.slate},
      {label:'Returns provision',value:-v.ret*k,color:C.slate},
      {label:'Net revenue',value:v.nru*k,type:'total',color:C.navy2},
      {label:'COGS',value:-v.cogs*k,color:C.red},
      {label:'Packaging',value:-v.pack*k,color:C.lav},
      {label:'Payment + platform',value:-v.payPU*k,color:C.slate},
      {label:'Shipping',value:-v.ship*k,color:C.red},
      {label:'CM1',value:v.cm1*k,type:'total',color:C.teal},
      {label:'Marketing / CAC',value:-v.cac*k,color:C.amber},
      {label:'CM2',value:v.cm2*k,type:'total',color:v.cm2>0?C.teal:C.red},
      {label:'Overhead',value:-v.oh*k,color:C.slate},
      {label:'EBITDA',value:v.ebitda*k,type:'total',color:v.ebitda>0?C.green:C.red}
    ];
    const cc=card(host,label+' — '+(pid==='__ALLP__'?'Apr–Aug':PMETA[pid].label),
      basis==='tot'?`all ${N(v.units)} units`:basis==='pct'?'scaled to ₹100 of MRP':'one unit');
    waterfall(cc,{items,w:920,h:360,yFmt:fmt});
    note(cc,`${N(v.units)} units. Of every ₹100 of MRP, ${N1(100*v.disc/v.mrp)} goes to discount,
      ${N1(100*(v.mrp-v.disc-(v.mrp-v.disc)/GST)/v.mrp)} to GST, ${N1(100*v.cogs/v.mrp)} to product cost,
      ${N1(100*v.ship/v.mrp)} to shipping, ${N1(100*v.cac/v.mrp)} to marketing and
      ${N1(100*v.oh/v.mrp)} to overhead, leaving ${N1(100*v.ebitda/v.mrp)} of EBITDA.`);
  }
  sel.addEventListener('change',wfRun); selP.addEventListener('change',wfRun);
  $$('#wfBasis button').forEach(b=>b.addEventListener('click',()=>{
    basis=b.dataset.b;$$('#wfBasis button').forEach(x=>x.classList.remove('on'));b.classList.add('on');wfRun();}));
  wfRun();
}

/* ============================================================================
   S18. PRODUCT ISSUE DIAGNOSTIC ENGINE
   ========================================================================== */
function diagnose(p,v,M){
  const is=[];
  const add=(t,ev,impact,act)=>is.push({t,ev,impact,act});
  if(v.cm1<=0) add('Product economics issue',
    `CM1 is ${R1(v.cm1)} per unit — negative before a rupee of marketing`,
    Math.abs(v.cm1T), 'Re-cost or reprice; no acquisition spend can be justified until CM1 is positive');
  if(v.cac>v.maxCacBE&&v.units>0) add('CAC issue',
    `CAC ${R(v.cac)} against a break-even ceiling of ${R(v.maxCacBE)}`,
    v.cacExcess, `Cap CAC at ${R(Math.max(v.maxCacTgt,0))} or pause the ad set`);
  if(v.shipFlips) add('Shipping issue',
    `CM2 is ${R1(v.cm2BeforeShip)} before shipping and ${R1(v.cm2)} after, at ${R1(v.ship)} per unit`,
    v.shipT, 'Bundle, raise the price or set a minimum order value');
  else if(v.shipPctRev>0.25) add('Shipping issue',
    `shipping is ${PC(v.shipPctRev)} of net revenue at ${R1(v.ship)} per unit`,
    v.shipT, 'Reduce packaging size or renegotiate the courier zone');
  if(v.discPct>0.2&&v.discHeadCm2!=null&&v.discHeadCm2<0) add('Discount issue',
    `discount is ${PC(v.discPct)} of MRP against a ${v.maxDiscCm2>=0?PC(v.maxDiscCm2):'negative'} ceiling`,
    v.totalDisc, `Cut discount to ${v.maxDiscCm2>=0?PC(v.maxDiscCm2):'zero'} or below`);
  if(v.cogsPctRev>0.35) add('COGS issue',
    `product cost is ${PC(v.cogsPctRev)} of net revenue`,
    v.cogsT, 'Re-source or re-specify; the margin cannot carry acquisition at this cost');
  if(v.views&&v.v2a!=null&&v.v2a<M.v2a*0.6) add('Add-to-cart issue',
    `${N(v.views)} item views convert to cart at ${PC(v.v2a,1)} against a ${PC(M.v2a,1)} median`,
    v.mktTot, 'Fix the product page — imagery, price presentation, delivery promise');
  if(v.atcN&&v.a2p!=null&&v.a2p<M.a2p*0.6) add('Checkout issue',
    `${N(v.atcN)} carts convert at ${PC(v.a2p,1)} against a ${PC(M.a2p,1)} median`,
    v.mktTot, 'Investigate shipping fees, payment options and cart friction');
  if(v.views>=M.views&&v.v2p!=null&&v.v2p<M.v2p*0.6) add('Conversion issue',
    `${N(v.views)} item views but only ${PC(v.v2p,2)} convert, against a ${PC(M.v2p,2)} median`,
    v.mktTot, 'Fix the page before buying more traffic');
  if(v.cm2>0&&v.views<M.views&&(v.v2p??0)>=M.v2p) add('Scale issue',
    `CM2 ${R1(v.cm2)} per unit and a ${PC(v.v2p,2)} conversion rate on only ${N(v.views)} views`,
    v.cm2*Math.max(M.views-v.views,0)*(v.v2p||0), 'Buy more traffic — there is headroom under the CAC ceiling');
  if(v.cm2>0&&v.ebitda<0) add('Price issue',
    `CM2 is ${R1(v.cm2)} but the ${R1(v.oh)} overhead charge takes EBITDA to ${R1(v.ebitda)}`,
    Math.abs(v.ebitdaT), `Raise price by about ${R1(-v.ebitda)} per unit or grow volume to ${N(Math.ceil(v.beQty||0))} units`);
  if(v.units>0&&v.views<M.views*0.35&&v.cm2>0) add('Traffic issue',
    `only ${N(v.views)} item views against a ${N(M.views)} median, on a profitable unit`,
    v.cm2*v.units, 'Increase visibility — listing, merchandising, campaign coverage');
  if(!is.length) add('No material issue','all thresholds pass',0,'Monitor');
  is.sort((a,b)=>b.impact-a.impact);
  return is;
}
function renderDiagnostic(){
  const s=sec('s-diag','18','Product issue diagnostic engine','Rules-based, automated',
    'Each SKU is tested against every rule below; the primary issue is the one with the largest rupee impact.');
  pidNote(s);
  const M=medians(timePids());
  const rows=fpv().filter(r=>r.v.units>0||r.v.mktTot>0).map(r=>{
    const is=diagnose(r.p,r.v,M);
    return {...r,is,pri:is[0]};
  });
  const c=card(s,'Primary issue by SKU','');
  table(c,[
    {h:'SKU',v:r=>r.p.code,l:1},{h:'Product',v:r=>r.p.name,l:1},
    {h:'Units',v:r=>r.v.units,f:F.n},{h:'Net revenue',v:r=>r.v.netRev,f:F.rl},
    {h:'Primary issue',v:r=>r.pri.t,l:1,f:v=>`<span class="pill ${v==='No material issue'?'p-g':'p-a'}">${esc(v)}</span>`},
    {h:'Evidence',v:r=>r.pri.ev,l:1,f:v=>esc(v)},
    {h:'Financial impact',v:r=>r.pri.impact,f:F.rl},
    {h:'Recommended action',v:r=>r.pri.act,l:1,f:v=>esc(v)},
    {h:'All issues',v:r=>r.is.length,f:F.n},
    {h:'CM2',v:r=>r.v.cm2T,f:F.rl,neg:1},{h:'EBITDA',v:r=>r.v.ebitdaT,f:F.rl,neg:1}
  ],rows,{sort:6,name:'diagnostics',maxH:'620px'});

  const tally={};
  rows.forEach(r=>r.is.forEach(i=>{tally[i.t]=tally[i.t]||{n:0,imp:0};tally[i.t].n++;tally[i.t].imp+=i.impact;}));
  const c2=card(s,'Issue frequency','how often each issue fires, and what it is worth');
  table(c2,[{h:'Issue',k:'t',l:1},{h:'SKUs affected',k:'n',f:F.n},{h:'Total impact',k:'imp',f:F.rl}],
    Object.entries(tally).map(([t,x])=>({t,n:x.n,imp:x.imp})),{search:false,sort:2,name:'issue_frequency'});
}

/* ============================================================================
   S19. ACTION PRIORITISATION
   ========================================================================== */
function actionFor(p,v,M){
  if(!v.units) return 'Review / discontinue';
  if(v.cm1<=0) return 'Reprice';
  if(v.cac>v.maxCacBE) return 'Reduce CAC';
  if(v.shipFlips||v.shipPctRev>0.25) return v.nru<600?'Bundle':'Fix shipping';
  if(v.discHeadCm2!=null&&v.discHeadCm2<0) return 'Reduce discount';
  if(v.cm2>0&&(v.v2p??0)>=M.v2p&&v.views>=M.views) return 'Scale now';
  if(v.cm2>0&&(v.v2p??0)>=M.v2p&&v.views<M.views) return 'Increase traffic';
  if(v.views>=M.views&&(v.v2p??0)<M.v2p) return 'Fix conversion';
  if(v.cm2<=0&&v.netRev<M.rev) return 'Review / discontinue';
  if(v.cm2>0&&v.ebitda<0) return 'Reprice';
  return 'Monitor';
}
function renderActions(){
  const s=sec('s-action','19','Action prioritisation','Nine buckets, ranked by value at stake');
  pidNote(s);
  const M=medians(timePids());
  const rows=fpv().map(r=>({...r,act:actionFor(r.p,r.v,M)}));
  const ORDER=['Scale now','Increase traffic','Fix conversion','Fix shipping','Reduce CAC',
    'Reduce discount','Reprice','Bundle','Review / discontinue','Monitor'];
  const HOW={'Scale now':'High CM2, strong conversion, proven demand — add budget',
    'Increase traffic':'Profitable and converting, but nobody sees it',
    'Fix conversion':'Plenty of views, poor conversion, sound economics',
    'Fix shipping':'Demand is fine; delivery cost destroys the margin',
    'Reduce CAC':'Good product economics bought at too high a price',
    'Reduce discount':'Revenue holds up but the discount has gone past its ceiling',
    'Reprice':'The current price cannot support a profitable structure',
    'Bundle':'Low basket value carrying a full delivery charge',
    'Review / discontinue':'Weak demand with negative contribution and EBITDA',
    'Monitor':'Nothing material fires against the thresholds'};
  const c=card(s,'Action buckets','');
  table(c,[{h:'Action',k:'a',l:1,f:F.pill(PILL_ACT)},{h:'SKUs',k:'n',f:F.n},
    {h:'Units',k:'u',f:F.n},{h:'Net revenue',k:'rev',f:F.rl},{h:'Marketing',k:'mkt',f:F.rl},
    {h:'CM2',k:'cm2',f:F.rl,neg:1},{h:'EBITDA',k:'eb',f:F.rl,neg:1},
    {h:'Value at stake',k:'stake',f:F.rl},{h:'Why this bucket',k:'how',l:1}],
    ORDER.map(a=>{const g2=rows.filter(r=>r.act===a);if(!g2.length)return null;
      const ag=aggProducts(g2);
      return {a,n:g2.length,u:ag.units,rev:ag.netRev,mkt:ag.mktTot,cm2:ag.cm2T,eb:ag.ebitdaT,
        stake:Math.abs(ag.ebitdaT),how:HOW[a]};}).filter(Boolean),
    {search:false,sort:7,name:'action_buckets'});
  const c2=card(s,'Products by action','');
  table(c2,[{h:'Action',v:r=>r.act,l:1,f:F.pill(PILL_ACT)},{h:'SKU',v:r=>r.p.code,l:1},
    {h:'Product',v:r=>r.p.name,l:1},{h:'Units',v:r=>r.v.units,f:F.n},
    {h:'Net revenue',v:r=>r.v.netRev,f:F.rl},{h:'CAC',v:r=>r.v.cac,f:F.r},
    {h:'Break-even CAC',v:r=>r.v.maxCacBE,f:F.r,neg:1},
    {h:'Max discount',v:r=>r.v.maxDiscCm2,f:v=>v==null||v<0?'None':PC(v)},
    {h:'CM2',v:r=>r.v.cm2T,f:F.rl,neg:1},{h:'EBITDA',v:r=>r.v.ebitdaT,f:F.rl,neg:1}],
    rows,{sort:9,desc:false,name:'action_products',maxH:'560px'});
}

  const rows=fp().map(p=>{
    const a=p.per.aj,j=p.per.jul,g=p.per.aug;

                cac:a.cac,cm2:a.cm2,cm2Pct:a.cm2Pct,nru:a.nru,ship:a.ship,discPct:a.discPct,views:a.views/3}:null;

/* ============================================================================
   S23. CM2 BRIDGES
   ========================================================================== */
function renderBridge(){
  const s=sec('s-bridge','23','CM2 bridges','What moved profitability between periods',
    `Built from the product P&L sheets, so every driver is an actual. The volume effect holds last period's
     per-unit CM2 and applies the change in units; the rate effects hold this period's units and apply the
     change in each per-unit line.`);
  const bridge=(host,fromId,toId,fromScale,label)=>{
    const A=PORT[fromId], B2=PORT[toId];
    const uA=A.units*fromScale, uB=B2.units;
    const cm2A=A.cm2T*fromScale, cm2B=B2.cm2T;
    const vol=(uB-uA)*A.cm2;
    const e=(a,b)=>(b-a)*uB;
    const items=[
      {label:label[0]+' CM2',value:cm2A,type:'total',color:cm2A>0?C.teal:C.red},
      {label:'Volume',value:vol,color:vol>0?C.green:C.red},
      {label:'Price / MRP',value:e(A.mrp/GST,B2.mrp/GST),color:C.green},
      {label:'Discount',value:-e(A.disc/GST,B2.disc/GST),color:C.amber},
      {label:'Returns',value:-e(A.ret,B2.ret),color:C.slate},
      {label:'COGS',value:-e(A.cogs,B2.cogs),color:C.red},
      {label:'Packaging',value:-e(A.pack,B2.pack),color:C.lav},
      {label:'Payment + platform',value:-e(A.payPU,B2.payPU),color:C.slate},
      {label:'Shipping',value:-e(A.ship,B2.ship),color:C.red},
      {label:'Marketing',value:-e(A.cac,B2.cac),color:C.amber},
      {label:label[1]+' CM2',value:cm2B,type:'total',color:cm2B>0?C.teal:C.red}
    ];
    /* residual keeps the bridge exact */
    const modelled=items.slice(1,-1).reduce((a,x)=>a+x.value,0);
    const resid=(cm2B-cm2A)-modelled;
    if(Math.abs(resid)>1) items.splice(items.length-1,0,
      {label:'Mix / rounding',value:resid,color:C.slate});
    const c=card(host,`${label[0]} → ${label[1]}`,`CM2 bridge · ${N(uA)} → ${N(uB)} units`);
    waterfall(c,{items,w:880,h:340,yFmt:RL,padB:80});
    const drivers=items.slice(1,-1).filter(x=>x.label!=='Mix / rounding')
      .sort((a,b)=>Math.abs(b.value)-Math.abs(a.value));
    note(c,`CM2 moved ${RL(cm2A)} → ${RL(cm2B)}, a change of ${RL(cm2B-cm2A)}.
      Largest drivers: ${drivers.slice(0,3).map(d=>`${d.label} ${RL(d.value)}`).join(', ')}.`);
    return c;
  };
  bridge(s,'aj','jul',1/3,['Apr–Jun monthly average','July']);
  bridge(s,'jul','aug',1,['July','August']);
  note(s,`The Apr–Jun bridge starts from that block's monthly average, since the sheet cannot be split into
    individual months. Price and discount effects are stated ex-GST so they reconcile to net revenue.`);

  /* monthly CM2 bridge from the daily model */
  const c=card(s,'Monthly CM2 movement','from the daily model — revenue and spend actual, costs modelled');
  const ms=MONTHS;
  const items=[{label:ms[0],value:MONTH_AGG[ms[0]].cm2,type:'total',color:MONTH_AGG[ms[0]].cm2>0?C.teal:C.red}];
  for(let i=1;i<ms.length;i++){
    const d=MONTH_AGG[ms[i]].cm2-MONTH_AGG[ms[i-1]].cm2;
    items.push({label:ms[i-1]+'→'+ms[i],value:d,color:d>0?C.green:C.red});
  }
  items.push({label:ms[ms.length-1],value:MONTH_AGG[ms[ms.length-1]].cm2,type:'total',
    color:MONTH_AGG[ms[ms.length-1]].cm2>0?C.teal:C.red});
  waterfall(c,{items,w:760,h:300,yFmt:RL});
}

  const s=sec('s-alerts','24','Management alerts','Threshold-based, automatic');
  pidNote(s);
  const rows=fpv().filter(r=>r.v.units>0);
  const A=aggProducts(rows);
  const M=medians(timePids());
  const al=[];
  const add=(sev,t,d)=>al.push({sev,t,d});

  if(A.cm2T<0) add('r','Portfolio CM2 is negative',
    `${RL(A.cm2T)} (${PC(A.cm2Pct)} of net revenue). Marketing at ${PC(div(A.mktTot,A.netRev))} of revenue is the cause.`);
  if(A.ebitdaT<0) add('r','Portfolio EBITDA is negative',
    `${RL(A.ebitdaT)} (${PC(A.ebitdaPct)}). Overhead adds ${RL(A.ohT)} on top of the CM2 position.`);
  const jl=PORT.jul,ag=PORT.aug,aj=PORT.aj;
  if(ag&&jl&&ag.netRev>jl.netRev&&ag.cm2T<jl.cm2T)
    add('r','Revenue growing while CM2 declines',
      `August net revenue ${RL(ag.netRev)} against July ${RL(jl.netRev)}, but CM2 fell from ${RL(jl.cm2T)} to ${RL(ag.cm2T)}.`);
  if(ag&&aj&&div(ag.cac-aj.cac,aj.cac)>0.1)
    add('r','CAC rising sharply',
      `CAC per unit ${R(aj.cac)} → ${R(jl.cac)} → ${R(ag.cac)}, ${PCS(div(ag.cac-aj.cac,aj.cac))} against the Apr–Jun book,
       while the break-even ceiling is ${R(ag.maxCacBE)}.`);
  const shipPct=div(A.shipT,A.netRev);
  if(shipPct>SHIP_THRESHOLD) add('r','Shipping above threshold',
    `${PC(shipPct)} of net revenue against a ${PC(SHIP_THRESHOLD,0)} threshold — ${RL(A.shipT)} in total.`);
  const flips=rows.filter(r=>r.v.shipFlips);
  if(flips.length) add('a','Shipping flips SKUs negative',
    `${flips.length} SKUs are CM2-positive before shipping and negative after: ${flips.slice(0,5).map(r=>esc(r.p.code)).join(', ')}${flips.length>5?'…':''}.`);
  const overD=rows.filter(r=>r.v.discHeadCm2!=null&&r.v.discHeadCm2<0);
  if(overD.length) add('a','Discount past its ceiling',
    `${overD.length} SKUs discount beyond the level at which CM2 reaches zero, giving away ${RL(sum(overD,r=>r.v.totalDisc))}.`);
  const negCm2=rows.filter(r=>r.v.cm2<=0);
  if(negCm2.length) add('r','Negative CM2 SKUs',
    `${negCm2.length} of ${rows.length} selling SKUs have negative CM2, carrying ${RL(sum(negCm2,r=>r.v.cm2T))}.`);
  const negEb=rows.filter(r=>r.v.ebitda<=0);
  if(negEb.length) add('a','Negative EBITDA SKUs',
    `${negEb.length} of ${rows.length} selling SKUs are EBITDA-negative after the ${R(A.oh)} overhead charge.`);
  const hiTraf=rows.filter(r=>r.v.views>=M.views&&(r.v.v2p??0)<M.v2p*0.6);
  if(hiTraf.length) add('a','High views, low conversion',
    `${hiTraf.length} SKUs draw above-median views and convert below 60% of the median rate: ${hiTraf.slice(0,5).map(r=>esc(r.p.code)).join(', ')}${hiTraf.length>5?'…':''}.`);
  const opp1=rows.filter(r=>r.v.cm2>0&&(r.v.v2p??0)>=M.v2p&&r.v.views>=M.views);
  if(opp1.length) add('g','Scale opportunity',
    `${opp1.length} SKUs combine positive CM2, above-median views and above-median conversion: ${opp1.slice(0,5).map(r=>esc(r.p.code)).join(', ')}${opp1.length>5?'…':''}.`);
  const opp2=rows.filter(r=>r.v.cm2>0&&(r.v.v2p??0)>=M.v2p&&r.v.views<M.views);
  if(opp2.length) add('g','Traffic opportunity',
    `${opp2.length} profitable SKUs convert above the median but sit below median views — ${RL(sum(opp2,r=>r.v.cm2T))} of CM2 on very little traffic.`);
  const capRec=sum(rows,r=>r.v.cacExcess);
  if(capRec>0) add('g','Recoverable by capping CAC',
    `${RL(capRec)} of EBITDA sits above the break-even acquisition ceiling and can be reclaimed by capping spend, before any volume response.`);
  const missMkt=timeRows().filter(d=>d.mkt==null).length;
  if(missMkt) add('a','Missing source data',
    `${missMkt} day${missMkt===1?'':'s'} in the selected window record no marketing spend; those days are excluded from CM2 and EBITDA rather than assumed to be zero.`);
  if(ANY_SESS_ALLOC) add('a','Product sessions are an allocation, not a measurement',
    `In every Ads sheet each SKU's session count is its ad spend divided by one constant, so product-level session
     counts and any conversion rate built on them carry no independent information. The product funnel here uses
     items viewed, added to cart and purchased instead.`);
  const augSess=SESS_ALLOC.aug;
  if(augSess&&augSess.total&&MONTH_AGG.Aug.traff&&augSess.total>MONTH_AGG.Aug.traff*2)
    add('r','August ads sessions disagree with daily traffic',
      `The August Ads sheet totals ${N(augSess.total)} sessions against ${N(MONTH_AGG.Aug.traff)} in the August daily sheet —
       ${N1(augSess.total/MONTH_AGG.Aug.traff)}× apart. The daily figure is used everywhere traffic is reported.`);

  const c=card(s,`${al.length} active alerts`,'ordered red, amber, green');
  const ord={r:0,a:1,g:2};
  al.sort((x,y)=>ord[x.sev]-ord[y.sev]);
  c.insertAdjacentHTML('beforeend',`<div class="insights">`+al.map(a=>
    `<div class="ins ${a.sev}"><h4>${a.sev==='r'?'🔴':a.sev==='a'?'🟠':'🟢'} ${esc(a.t)}</h4><p>${a.d}</p></div>`).join('')+`</div>`);
}

/* ============================================================================
   S25. FINAL MANAGEMENT SCORECARD
   ========================================================================== */
function renderScorecard(){
  const s=sec('s-score','25','Final management scorecard','Weighted composite, all ranks recomputed per view');
  pidNote(s);
  const M=medians(timePids());
  const rows=fpv().filter(r=>r.v.units>0);
  if(!rows.length){naBox(s,'No SKU with sales in the current filter.','Clear the filters.');return;}
  const rank=(f)=>{const o=rows.map((r,i)=>[i,f(r)]).sort((a,b)=>(b[1]??-1e18)-(a[1]??-1e18));
    const out=new Array(rows.length); o.forEach(([i],k)=>out[i]=k+1); return out;};
  /* growth rank is available only where a July and an August record both exist */
  const growable=rows.filter(r=>r.p.per.jul&&r.p.per.aug&&r.p.per.jul.units>0);
  const canGrow=growable.length>=3;
  const rRev=rank(r=>r.v.netRev), rCvr=rank(r=>r.v.v2p),
        rCm2=rank(r=>r.v.cm2Pct), rEb=rank(r=>r.v.ebitdaPct),
        rCac=rank(r=>r.v.cac>0?r.v.maxCacBE/r.v.cac:(r.v.maxCacBE>0?5:-1)),
        rShip=rank(r=>-(r.v.shipPctRev??1)),
        rGro=rank(r=>{const j=r.p.per.jul,g=r.p.per.aug;
          return (j&&g&&j.netRev)?(g.netRev-j.netRev)/Math.abs(j.netRev):null;});
  const n=rows.length;
  const W = canGrow ? {rev:.15,cvr:.15,cm2:.25,eb:.18,cac:.09,ship:.06,gro:.12}
                    : {rev:.18,cvr:.18,cm2:.28,eb:.20,cac:.10,ship:.06,gro:0};
  rows.forEach((r,i)=>{
    const sc=x=>(n-x)/(n-1||1);                 // rank 1 → 1.0, rank n → 0
    r._rank={rev:rRev[i],cvr:rCvr[i],cm2:rCm2[i],eb:rEb[i],cac:rCac[i],ship:rShip[i],gro:rGro[i]};
    r._score=100*(W.rev*sc(rRev[i])+W.cvr*sc(rCvr[i])+W.cm2*sc(rCm2[i])+W.eb*sc(rEb[i])+
                  W.cac*sc(rCac[i])+W.ship*sc(rShip[i])+(canGrow?W.gro*sc(rGro[i]):0));
    r._act=actionFor(r.p,r.v,M);
  });
  const c=card(s,'Scorecard','higher is better · 0–100');
  table(c,[
    {h:'SKU',v:r=>r.p.code,l:1},{h:'Product',v:r=>r.p.name,l:1},
    {h:'Revenue rank',v:r=>r._rank.rev,f:F.n},
    {h:'Growth rank',v:r=>canGrow?r._rank.gro:null,f:v=>v==null?'<span style="color:var(--ink3)">N/A</span>':N(v)},
    {h:'Conversion rank',v:r=>r._rank.cvr,f:F.n},
    {h:'CM2 rank',v:r=>r._rank.cm2,f:F.n},
    {h:'EBITDA rank',v:r=>r._rank.eb,f:F.n},
    {h:'CAC status',v:r=>r.v.cacStatus,l:1,f:F.pill(PILL_CAC)},
    {h:'Shipping status',v:r=>r.v.shipFlips?'Destroyer':r.v.shipPctRev>SHIP_THRESHOLD?'High':'OK',l:1,
      f:v=>`<span class="pill ${v==='Destroyer'?'p-r':v==='High'?'p-a':'p-g'}">${esc(v)}</span>`},
    {h:'Discount status',v:r=>r.v.discStatus,l:1,f:F.pill(PILL_DISC)},
    {h:'Overall score',v:r=>r._score,
      f:v=>`<span class="bar-cell"><i style="width:${clamp(v,0,100).toFixed(0)}%"></i><span>${N1(v)}</span></span>`},
    {h:'Recommended action',v:r=>r._act,l:1,f:F.pill(PILL_ACT)}
  ],rows,{sort:10,name:'scorecard',maxH:'620px'});
  note(c,`<b>Scoring method.</b> Every SKU is ranked on each component within the current view, the rank is
    rescaled to 0–1 and the components are combined with these weights:
    revenue ${PC(W.rev,0)}, conversion ${PC(W.cvr,0)}, CM2 % ${PC(W.cm2,0)}, EBITDA % ${PC(W.eb,0)},
    CAC efficiency ${PC(W.cac,0)}, shipping efficiency ${PC(W.ship,0)}${canGrow?`, revenue growth ${PC(W.gro,0)}`:''}.
    ${canGrow?`Growth is July → August, the only genuine month-on-month product comparison in the file.`
      :`Growth carries no weight here because the current view has no July and August pair to compare; it reads N/A.`}
    CAC efficiency is the break-even ceiling divided by actual CAC, so above 1.0 is affordable.
    Ranks are recomputed whenever the filters change, so they are always ranks within what is on screen.`);
}

/* ============================================================================
   S26. TOP 10 / BOTTOM 10
   ========================================================================== */
function renderTopBottom(){
  const s=sec('s-topbot','26','Top 10 and bottom 10','Dynamic to the current view');
  pidNote(s);
  const rows=fpv().filter(r=>r.v.units>0);
  const gr=grid(s,'g2');
  const mk4=(host,title,sub,list,cols)=>{const c=card(host,title,sub);table(c,cols,list,{search:false,name:title.toLowerCase().replace(/\W+/g,'_')});};
  const base=[{h:'SKU',v:r=>r.p.code,l:1},{h:'Product',v:r=>r.p.name,l:1}];
  const T=(f,n=10,asc=false)=>rows.slice().sort((a,b)=>{const x=f(a),y=f(b);
    return asc?((x??1e18)-(y??1e18)):((y??-1e18)-(x??-1e18));}).slice(0,n);

  mk4(gr,'Top 10 — net revenue','',T(r=>r.v.netRev),
    [...base,{h:'Net revenue',v:r=>r.v.netRev,f:F.rl},{h:'Units',v:r=>r.v.units,f:F.n},{h:'CM2 %',v:r=>r.v.cm2Pct,f:F.p,neg:1}]);
  mk4(gr,'Top 10 — CM2','',T(r=>r.v.cm2T),
    [...base,{h:'CM2',v:r=>r.v.cm2T,f:F.rl},{h:'CM2 %',v:r=>r.v.cm2Pct,f:F.p},{h:'Units',v:r=>r.v.units,f:F.n}]);
  mk4(gr,'Top 10 — EBITDA','',T(r=>r.v.ebitdaT),
    [...base,{h:'EBITDA',v:r=>r.v.ebitdaT,f:F.rl},{h:'EBITDA %',v:r=>r.v.ebitdaPct,f:F.p},{h:'Units',v:r=>r.v.units,f:F.n}]);
  mk4(gr,'Top 10 — view-to-purchase rate','minimum 200 item views',
    T(r=>r.v.views>=200?r.v.v2p:null),
    [...base,{h:'View → purchase',v:r=>r.v.v2p,f:F.p2},{h:'Items viewed',v:r=>r.v.views,f:F.n},{h:'Units',v:r=>r.v.units,f:F.n}]);
  mk4(gr,'Top 10 — units','',T(r=>r.v.units),
    [...base,{h:'Units',v:r=>r.v.units,f:F.n},{h:'Net revenue',v:r=>r.v.netRev,f:F.rl},{h:'EBITDA',v:r=>r.v.ebitdaT,f:F.rl,neg:1}]);
  mk4(gr,'Top 10 — revenue per item view','',T(r=>r.v.views>=200?r.v.revPerView:null),
    [...base,{h:'Revenue / view',v:r=>r.v.revPerView,f:F.r},{h:'Items viewed',v:r=>r.v.views,f:F.n},{h:'Net revenue',v:r=>r.v.netRev,f:F.rl}]);

  const can=PROD.some(p=>p.per.jul&&p.per.aug);
  if(can){
    const gl=fp().map(p=>({p,j:p.per.jul,g:p.per.aug}))
      .filter(r=>r.j&&r.g&&r.j.netRev>0)
      .map(r=>({...r,gr:(r.g.netRev-r.j.netRev)/Math.abs(r.j.netRev)}));
    mk4(gr,'Top 10 — revenue growth','July → August',
      gl.slice().sort((a,b)=>b.gr-a.gr).slice(0,10),
      [{h:'SKU',v:r=>r.p.code,l:1},{h:'Product',v:r=>r.p.name,l:1},
       {h:'Growth',v:r=>r.gr,f:F.ps},{h:'Jul revenue',v:r=>r.j.netRev,f:F.rl},
       {h:'Aug revenue',v:r=>r.g.netRev,f:F.rl},{h:'Aug CM2 %',v:r=>r.g.cm2Pct,f:F.p,neg:1}]);
  }

  const gr2=grid(s,'g2');
  mk4(gr2,'Bottom 10 — CM2','',T(r=>r.v.cm2T,10,true),
    [...base,{h:'CM2',v:r=>r.v.cm2T,f:F.rl,neg:1},{h:'CM2 %',v:r=>r.v.cm2Pct,f:F.p,neg:1},{h:'CAC',v:r=>r.v.cac,f:F.r}]);
  mk4(gr2,'Bottom 10 — EBITDA','',T(r=>r.v.ebitdaT,10,true),
    [...base,{h:'EBITDA',v:r=>r.v.ebitdaT,f:F.rl,neg:1},{h:'EBITDA %',v:r=>r.v.ebitdaPct,f:F.p,neg:1},{h:'Net revenue',v:r=>r.v.netRev,f:F.rl}]);
  mk4(gr2,'Bottom 10 — view-to-purchase rate','minimum 200 item views',
    T(r=>r.v.views>=200?r.v.v2p:null,10,true).filter(r=>r.v.views>=200),
    [...base,{h:'View → purchase',v:r=>r.v.v2p,f:F.p2},{h:'Items viewed',v:r=>r.v.views,f:F.n},{h:'Ad spend',v:r=>r.v.mktTot,f:F.rl}]);
  mk4(gr2,'Bottom 10 — CAC efficiency','ceiling ÷ actual CAC · below 1.0 destroys contribution',
    T(r=>r.v.cac>0?r.v.maxCacBE/r.v.cac:null,10,true).filter(r=>r.v.cac>0),
    [...base,{h:'CAC',v:r=>r.v.cac,f:F.r},{h:'Break-even CAC',v:r=>r.v.maxCacBE,f:F.r,neg:1},
     {h:'Efficiency',v:r=>r.v.cac>0?r.v.maxCacBE/r.v.cac:null,f:v=>v==null?'—':`<span class="${v<1?'neg':''}">${N1(v)}×</span>`},
     {h:'Excess spend',v:r=>r.v.cacExcess,f:F.rl}]);
  mk4(gr2,'Bottom 10 — shipping efficiency','shipping as % of net revenue',
    T(r=>-(r.v.shipPctRev??0),10).filter(r=>r.v.shipPctRev!=null),
    [...base,{h:'Shipping % of revenue',v:r=>r.v.shipPctRev,f:F.p},
     {h:'Shipping / unit',v:r=>r.v.ship,f:F.r1},{h:'ASP',v:r=>r.v.nru,f:F.r},{h:'CM2 %',v:r=>r.v.cm2Pct,f:F.p,neg:1}]);
}

/* ============================================================================
   S27. EXECUTIVE RECOMMENDATION ENGINE
   ========================================================================== */
function renderRecs(){
  const s=sec('s-recs','27','What should management do?','Problem → evidence → financial impact → action → expected outcome');
  pidNote(s);
  const M=medians(timePids());
  const rows=fpv().filter(r=>r.v.units>0);
  const A=aggProducts(rows);
  const recs=[];
  const push=(title,problem,evidence,impact,impactN,action,outcome)=>
    recs.push({title,problem,evidence,impact,impactN,action,outcome});

  /* 1 — CAC caps */
  const over=rows.filter(r=>r.v.cacExcess>0).sort((a,b)=>b.v.cacExcess-a.v.cacExcess);
  if(over.length){
    const top5=over.slice(0,5), rec=sum(top5,r=>r.v.cacExcess), all=sum(over,r=>r.v.cacExcess);
    push('Cap CAC on the largest overspenders before anything else',
      `Marketing consumed ${PC(div(A.mktTot,A.netRev))} of net revenue (${RL(A.mktTot)} on ${RL(A.netRev)}), turning a
       ${PC(A.cm1Pct)} CM1 into a ${PC(A.cm2Pct)} CM2.`,
      top5.map(r=>`${esc(r.p.code)}: CAC ${R(r.v.cac)} against an EBITDA break-even ceiling of ${R(r.v.maxCacTgt)}${r.v.maxCacTgt<0?' (CM1 sits below the overhead charge, so no CAC is affordable)':''} on ${N(r.v.units)} units`).join('; '),
      `${RL(rec)} from the top five, ${RL(all)} across all ${over.length} SKUs — ${PC(div(all,Math.abs(A.ebitdaT)))} of the EBITDA loss`,
      all,
      `Set a hard per-SKU CAC cap at the EBITDA break-even level and pause any ad set that breaches it for two consecutive weeks.`,
      `Portfolio EBITDA improves from ${RL(A.ebitdaT)} towards ${RL(A.ebitdaT+all)} at unchanged volume. Some volume will be lost, so treat this as the upper bound.`);
  }
  /* 2 — worst single SKU */
  const worst=rows.slice().sort((a,b)=>a.v.ebitdaT-b.v.ebitdaT)[0];
  if(worst&&worst.v.ebitdaT<0){
    const v=worst.v;
    push(`Stop paid acquisition on ${worst.p.code} until the economics work`,
      `${esc(worst.p.name)} took ${N(v.views)} item views and ${RL(v.mktTot)} of media for ${N(v.units)} units.`,
      `CAC ${R(v.cac)} per unit against a CM1 of ${R(v.cm1)}; view-to-purchase ${PC(v.v2p,2)} against a ${PC(M.v2p,2)} median; shipping ${R1(v.ship)} per unit (${PC(v.shipPctRev)} of revenue)`,
      `${RL(v.cm2T)} CM2 and ${RL(v.ebitdaT)} EBITDA — the single largest destroyer in this view`,
      Math.abs(v.ebitdaT),
      `Pause prospecting budget. Re-test only after view-to-purchase clears ${PC(M.v2p,2)} on organic and retargeting traffic.`,
      `Recovers ${RL(Math.abs(v.cm2T))} of contribution immediately; ${RL(v.netRev)} of revenue is at risk, which is ${PC(div(v.netRev,A.netRev))} of the portfolio.`);
  }
  /* 3 — shipping */
  const flips=rows.filter(r=>r.v.shipFlips).sort((a,b)=>b.v.shipT-a.v.shipT);
  if(flips.length){
    push('Bundle or reprice the SKUs where shipping alone flips CM2 negative',
      `Shipping costs ${R(A.ship)} per unit — ${PC(div(A.shipT,A.netRev))} of net revenue and ${PC(div(A.shipT,A.gmT))} of gross margin.`,
      `${flips.length} SKUs — ${flips.slice(0,5).map(r=>`${esc(r.p.code)} (${R1(r.v.ship)} on a ${R(r.v.nru)} ASP)`).join(', ')}${flips.length>5?` and ${flips.length-5} more`:''} — post positive CM2 before shipping and negative after`,
      `${RL(sum(flips,r=>r.v.shipT))} of shipping on these SKUs against ${RL(sum(flips,r=>r.v.cm2BeforeShip*r.v.units))} of pre-shipping contribution`,
      sum(flips,r=>Math.abs(r.v.cm2T)),
      `Put them into multi-unit bundles so one delivery carries more value, set a free-shipping threshold above the current AOV of ${R(aggDays(timeRows()).aov)}, or raise price by at least the shipping gap.`,
      `Each SKU returns to positive CM2 once shipping falls below ${R(sum(flips,r=>r.v.cm2BeforeShip)/flips.length)} per unit on average.`);
  }
  /* 4 — discount */
  const overD=rows.filter(r=>r.v.discHeadCm2!=null&&r.v.discHeadCm2<0).sort((a,b)=>b.v.totalDisc-a.v.totalDisc);
  if(overD.length){
    push('Pull discounting back to each SKU’s own ceiling',
      `${overD.length} SKUs discount past the level at which CM2 reaches zero.`,
      overD.slice(0,5).map(r=>`${esc(r.p.code)} at ${PC(r.v.discPct)} against a ${r.v.maxDiscCm2>=0?PC(r.v.maxDiscCm2):'zero'} ceiling`).join('; '),
      `${RL(sum(overD,r=>r.v.totalDisc))} of discount given on these SKUs`,
      sum(overD,r=>r.v.totalDisc),
      `Set the promotional floor per SKU at its CM2 ceiling and remove blanket site-wide percentages.`,
      `Recovers up to ${RL(sum(overD,r=>Math.max(0,-r.v.discHeadCm2)*r.v.mrp/GST*r.v.units))} of contribution at constant volume; expect some volume loss on the most elastic lines.`);
  }
  /* 5 — starve the winners no longer */
  const stars=rows.filter(r=>r.v.cm2>0&&(r.v.v2p??0)>=M.v2p&&r.v.views<M.views)
                  .sort((a,b)=>b.v.cacGapTgt-a.v.cacGapTgt);
  if(stars.length){
    push('Move budget onto the profitable SKUs that nobody sees',
      `${stars.length} SKUs convert above the median and carry positive CM2, yet draw below-median traffic.`,
      stars.slice(0,5).map(r=>`${esc(r.p.code)}: ${PC(r.v.v2p,2)} view-to-purchase on ${N(r.v.views)} views, CM2 ${R1(r.v.cm2)} per unit, CAC headroom ${R(r.v.cacGapTgt)}`).join('; '),
      `${RL(sum(stars,r=>r.v.cm2T))} of CM2 today on only ${PC(div(sum(stars,r=>r.v.mktTot),A.mktTot))} of the media budget`,
      sum(stars,r=>r.v.cm2T),
      `Redirect the budget freed by the CAC caps above onto these SKUs, spending up to their individual EBITDA break-even ceilings.`,
      `Each SKU can absorb up to ${R(sum(stars,r=>r.v.cacGapTgt)/stars.length)} more CAC per unit on average and stay EBITDA-positive.`);
  }
  /* 6 — price / structural */
  const noCeil=rows.filter(r=>r.v.maxCacTgt<=0).sort((a,b)=>b.v.netRev-a.v.netRev);
  if(noCeil.length){
    push('Reprice or re-cost the SKUs that cannot afford any acquisition cost',
      `${noCeil.length} SKUs have a CM1 below the ${R(A.oh)} overhead charge, so no acquisition spend at all makes them EBITDA-positive.`,
      noCeil.slice(0,5).map(r=>`${esc(r.p.code)}: CM1 ${R1(r.v.cm1)} against ${R1(r.v.oh)} of overhead, ASP ${R(r.v.nru)}`).join('; '),
      `${RL(sum(noCeil,r=>r.v.ebitdaT))} of EBITDA on ${RL(sum(noCeil,r=>r.v.netRev))} of revenue`,
      Math.abs(sum(noCeil,r=>r.v.ebitdaT)),
      `Raise price, re-source the cost stack, or move them into bundles where they ride on a profitable anchor SKU. Selling them organically is acceptable; buying traffic for them is not.`,
      `Closing the gap needs on average ${R(sum(noCeil,r=>r.v.oh-r.v.cm1)/noCeil.length)} per unit of price or cost improvement.`);
  }
  /* 7 — trajectory */
  const aj=PORT.aj,jl=PORT.jul,ag=PORT.aug;
  push('Hold the July price rise and take the next gain from spend, not price',
    `List prices rose on 1 July and realised ASP followed (${R(aj.nru)} → ${R(jl.nru)} → ${R(ag.nru)} ex-GST), but CM2 % still fell from ${PC(aj.cm2Pct)} to ${PC(ag.cm2Pct)}.`,
    `The price rise added ${R1((jl.mrp-aj.mrp)/GST)} per unit; marketing per unit rose ${R1(ag.cac-aj.cac)} and shipping ${R1(ag.ship-aj.ship)} over the same span`,
    `${RL(ag.cm2T-aj.cm2T/3)} of monthly CM2 movement against the Apr–Jun run rate`,
    Math.abs(ag.cm2T-aj.cm2T/3),
    `Freeze further price action for a quarter — the demand response is not yet visible in the data — and take the next margin gain from the CAC caps and shipping fixes above.`,
    `Marketing at ${PC(div(ag.mktTot,ag.netRev))} of revenue needs to reach about ${PC(div(ag.cm1T,ag.netRev))} for CM2 to reach zero at August's cost structure — a reduction of roughly ${RL(ag.mktTot-ag.cm1T)} a month.`);

  recs.sort((a,b)=>b.impactN-a.impactN);
  const c=card(s,`${recs.length} recommendations`,'ranked by the rupee value at stake');
  c.insertAdjacentHTML('beforeend',recs.map((r,i)=>`
    <div class="rec">
      <div class="rh"><span class="rk">${i+1}</span><span>${esc(r.title)}</span></div>
      <div class="rb">
        <div><strong>Problem</strong>${r.problem}</div>
        <div><strong>Evidence</strong>${r.evidence}</div>
        <div><strong>Financial impact</strong>${r.impact}</div>
        <div><strong>Action</strong>${r.action}</div>
        <div><strong>Expected outcome</strong>${r.outcome}</div>
      </div></div>`).join(''));
}

/* ============================================================================
   S28. DATA DICTIONARY, METHODOLOGY AND VALIDATION
   ========================================================================== */
function renderMethod(){
  const s=sec('s-method','28','Data dictionary, methodology and validation','How every number is built');

  /* ---- coverage ---- */
  const c0=card(s,'Source coverage','what the file contains and what it does not');
  const dcov=MONTHS.map(m=>{
    const r=DDAY.filter(d=>d.mon===m);
    const cnt=f=>r.filter(d=>d[f]!=null).length;
    return {m,days:r.length,gmv:cnt('gmv'),nr:cnt('netRevSrc'),tr:cnt('traff'),
            ord:cnt('orders'),mkt:cnt('mkt'),atc:cnt('atc')};
  });
  table(c0,[{h:'Month',k:'m',l:1},{h:'Days',k:'days',f:F.n},
    {h:'GMV',v:r=>r.gmv,f:(v,r)=>cov(v,r.days)},{h:'Net sales',v:r=>r.nr,f:(v,r)=>cov(v,r.days)},
    {h:'Traffic',v:r=>r.tr,f:(v,r)=>cov(v,r.days)},{h:'Orders',v:r=>r.ord,f:(v,r)=>cov(v,r.days)},
    {h:'Marketing',v:r=>r.mkt,f:(v,r)=>cov(v,r.days)},{h:'Add to cart',v:r=>r.atc,f:(v,r)=>cov(v,r.days)}],
    dcov,{search:false,sort:null,name:'coverage'});
  note(c0,`Add-to-cart appears in the daily sheets only from July, so April–June show no cart stage.
    Every other daily field is complete apart from ${DDAY.filter(d=>d.mkt==null).map(d=>d.d).join(', ')||'none'}.
    The product P&L exists as three blocks — a combined Apr–Jun sheet and separate July and August sheets —
    so product economics cannot be split into April, May and June individually.`);

  /* ---- dictionary ---- */
  const c1=card(s,'Data dictionary','source field → dashboard metric → formula → assumption');
  const D=[
    ['Website P&L · Units sold','Units','as given','one row per SKU per period'],
    ['Website P&L · month revenue with GST','GMV','as given','gross of GST and of discount'],
    ['Website P&L · Net Revenue without GST','Net revenue per unit','SP ex-GST − returns provision','GST factor 1.18, implied by SP ÷ SP-without-GST on every row'],
    ['Website P&L · CM 1','CM1 per unit','net revenue − COGS − packaging − payment − shipping − COD − platform fees','verified to reconcile on all 79 SKUs in all three periods'],
    ['Website P&L · CM2','CM2 per unit','CM1 − marketing per unit','source methodology preserved'],
    ['Website P&L · EBITA','EBITDA per unit','CM2 − overhead per unit','overhead is a flat allocation that changes by period'],
    ['Website P&L · Marketing Cost','CAC per unit','as given; equals 3 Month Total Marketing Cost ÷ units','not spend per new customer — see assumption 4'],
    ['Ads · Items viewed / added to cart / purchased','Product funnel','as given','genuinely measured per item'],
    ['Ads · Sessions','Product sessions','<b>not used</b>','every row equals spend ÷ one constant, so it is an allocation — see assumption 8'],
    ['Ads · Cost spent','Ad spend by item','as given','joined to the P&L on a normalised product name'],
    ['Daily · GMV','Daily GMV','as given','the volume anchor for the daily model'],
    ['Daily · Net Revenue','Net sales (source column)','as given','shown beside the modelled figure so the two can be compared'],
    ['Daily · Traff / Orders / ATC','Sessions, orders, add to cart','as given','actuals, never modelled'],
    ['Daily · Mark Spends+Others','Marketing spend','as given','actual'],
    ['Daily · NB Orders','New customers','as given','used for portfolio new-customer CAC'],
    ['Daily · Promo%','Discount / promo %','as given × GMV gives the discount value','applied to GMV, not to MRP value'],
    ['— modelled —','Daily units and every daily cost line',
      `GMV ÷ that period's blended GMV per unit gives units; net revenue ex-GST = units × the period's net revenue per unit; then the period's blended per-unit cost rates are applied`,
      `necessary because the daily sheets carry no cost stack. Blended rates: ${PIDS.map(i=>`${esc(PMETA[i].short)} ${R(BL[i].gmvPU)}/unit GMV, shipping ${R(BL[i].shipPU)}, overhead ${R(BL[i].ohPU)}`).join(' · ')}`],
    ['— derived —','Break-even CAC','CM1 per unit','the CAC at which CM2 is exactly zero'],
    ['— derived —','Target CAC','CM1 per unit − overhead per unit','the CAC at which EBITDA is exactly zero'],
    ['— derived —','Break-even quantity','(overhead per unit × units) ÷ CM2 per unit','the fixed cost is the SKU\'s own overhead charge for the period'],
    ['— derived —','Maximum profitable discount','solve MRP × (1 − d) ÷ 1.18 − returns − variable costs − marketing = 0 for d','holds cost and CAC per unit constant; volume response is unknown'],
    ['— derived —','Units per order',PIDS.map(i=>`${esc(PMETA[i].short)} ${N1(BL[i].unitsPerOrder)}`).join(' · '),'portfolio average applied to every SKU; basket mix by SKU is not in the file'],
    ['— unavailable —','Checkout initiated, per-SKU orders, per-SKU new customers, per-SKU daily performance, April/May/June product split',
      'N/A — required source data unavailable','flagged in place wherever a section would otherwise need them']
  ];
  c1.insertAdjacentHTML('beforeend',`<div class="tblwrap"><table>
    <thead><tr><th class="l">Source field</th><th class="l">Dashboard metric</th><th class="l">Formula</th><th class="l">Assumption / note</th></tr></thead>
    <tbody>${D.map(r=>`<tr>${r.map(x=>`<td class="l">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);

  /* ---- validation ---- */
  const c2=card(s,'Validation checks','run live, against the current data');
  const V=[];
  const chk=(name,pass,detail)=>V.push({name,pass,detail});
  PIDS.forEach(id=>{
    const rows=PROD.map(p=>p.per[id]).filter(Boolean);
    let bad=0,worst=0;
    rows.forEach(r=>{const cm1=r.nru-r.cogs-r.pack-(r.razor||0)-r.ship-(r.cod||0)-(r.shopify||0)-(r.shopflo||0);
      const d=Math.abs(cm1-r.cm1); if(d>0.6)bad++; worst=Math.max(worst,d);});
    chk(`CM1 identity reconciles — ${PMETA[id].short}`,bad===0,
      `${rows.length-bad} of ${rows.length} SKUs reconcile; largest difference ${R1(worst)}`);
    let b2=0; rows.forEach(r=>{if(Math.abs(r.cm1-r.mktPU-r.cm2)>0.6)b2++;});
    chk(`CM2 = CM1 − marketing — ${PMETA[id].short}`,b2===0,`${rows.length-b2} of ${rows.length} SKUs reconcile`);
    let b3=0; rows.forEach(r=>{if(Math.abs(r.cm2-r.oh-r.ebitda)>0.6)b3++;});
    chk(`EBITDA = CM2 − overhead — ${PMETA[id].short}`,b3===0,`${rows.length-b3} of ${rows.length} SKUs reconcile`);
    const mt=PROD.reduce((a,p)=>a+(p.per[id]?p.per[id].mktTot:0),0);
    const mu=PROD.reduce((a,p)=>a+(p.per[id]?p.per[id].cac*p.per[id].units:0),0);
    chk(`Marketing total matches per-unit × units — ${PMETA[id].short}`,Math.abs(mt-mu)<Math.max(50,mt*0.001),
      `${RL(mt)} against ${RL(mu)}, difference ${R(mt-mu)}`);
  });
  /* duplicates */
  const keys=PROD.map(p=>p.code+'|'+p.name), dup=keys.filter((k,i)=>keys.indexOf(k)!==i);
  chk('No duplicate SKU keys',dup.length===0,
    `${PROD.length} unique code + name keys. Three rows that were byte-identical duplicates in every sheet
     (B3+AR, DP, FP3+JB) are collapsed to one each; Dino Kit, Unicorn Kit and Activity Pack keep their
     separate pack-size and variant rows, which are genuinely different products.`);
  /* month totals against the source */
  MONTHS.forEach(m=>{
    const a=MONTH_AGG[m], gap=div(a.netRev-a.netRevSrc,a.netRevSrc);
    chk(`${m} modelled net revenue within 10% of the source column`,Math.abs(gap)<0.10,
      `modelled ${RL(a.netRev)} against source ${RL(a.netRevSrc)}, ${PCS(gap)}`);
  });
  /* daily vs product sheet */
  PIDS.forEach(id=>{
    const d=PID_AGG[id], p=PORT[id];
    const gap=div(d.gmv-p.gmv,p.gmv);
    chk(`${PMETA[id].short} daily GMV against product-sheet GMV`,Math.abs(gap)<0.10,
      `daily ${RL(d.gmv)} against product sheet ${RL(p.gmv)}, ${PCS(gap)} — the difference is items with no P&L row (gift cards, digital, pack variants)`);
  });
  /* marketing spend across the three sources */
  PIDS.forEach(id=>{
    const dailyM=PID_AGG[id].mkt, prodM=PORT[id].mktTot, adsM=ADS[id].spend;
    const mx=Math.max(dailyM,prodM,adsM), mn=Math.min(dailyM,prodM,adsM);
    const spread=div(mx-mn,mn);
    chk(`${PMETA[id].short} marketing spend agrees across the three sheets`,spread<0.10,
      `daily ${RL(dailyM)} · product P&L ${RL(prodM)} · Ads ${RL(adsM)} — a ${PC(spread)} spread.
       Product-level sections use the product P&L figure, daily and monthly sections use the daily figure,
       and each section states which it is using.`);
  });
  /* category vs total */
  const cats={}; PROD.forEach(p=>{const v=pv(p,PIDS);if(v)cats[p.cat]=(cats[p.cat]||0)+v.netRev;});
  const catSum=Object.values(cats).reduce((a,b)=>a+b,0);
  chk('Category totals sum to the portfolio total',Math.abs(catSum-PORT.all.netRev)<1,
    `${RL(catSum)} against ${RL(PORT.all.netRev)}`);
  /* dates */
  const ds=DDAY.map(d=>d.d).sort();
  const expect=(()=>{let n=0;const a=new Date('2026-04-01'),b=new Date('2026-08-31');
    for(let t=a;t<=b;t=new Date(t.getTime()+864e5))n++;return n;})();
  chk('No missing dates between 1 April and 31 August',ds.length===expect,
    `${ds.length} daily rows against ${expect} calendar days`);
  /* negatives */
  const negU=PROD.filter(p=>PIDS.some(i=>p.per[i]&&p.per[i].units<0));
  chk('No negative unit counts',negU.length===0,`${negU.length} SKUs with negative units`);
  const negR=PROD.filter(p=>PIDS.some(i=>p.per[i]&&p.per[i].gmv<0));
  chk('No negative revenue rows',negR.length===0,
    negR.length?`${negR.map(p=>esc(p.code)).join(', ')} ${negR.length===1?'carries':'carry'} a negative revenue figure in at least one period — a refund-only row, left exactly as reported rather than zeroed`:'all revenue values are zero or positive');
  /* division by zero */
  chk('Division by zero handled',true,
    'every ratio runs through a guard that returns null for a zero or non-finite denominator, and null renders as an em dash rather than NaN or Infinity');
  /* sessions */
  chk('Product session counts treated as an allocation',true,
    PIDS.map(i=>`${PMETA[i].short}: spend ÷ sessions is a constant ${R1(SESS_ALLOC[i].perSess)} on every row`).join(' · ')+
    ' — so product sessions and any conversion rate built on them are excluded from this dashboard');
  const augGap=div(SESS_ALLOC.aug.total,MONTH_AGG.Aug.traff);
  chk('August ads sessions agree with daily traffic',augGap!=null&&augGap<2,
    `Ads sheet ${N(SESS_ALLOC.aug.total)} against daily ${N(MONTH_AGG.Aug.traff)} — ${N1(augGap)}× apart. Daily traffic is used everywhere.`);

  table(c2,[{h:'Check',k:'name',l:1},{h:'Result',k:'pass',
      f:v=>`<span class="pill ${v?'p-g':'p-a'}">${v?'Pass':'Flagged'}</span>`},
    {h:'Detail',k:'detail',l:1}],V,{search:false,sort:null,name:'validation'});
  const fails=V.filter(v=>!v.pass).length;
  note(c2,`${V.length-fails} of ${V.length} checks pass. ${fails?`${fails} are flagged and explained in the detail column —
    each is a property of the source data, not a calculation error.`:''}`);

  /* ---- assumptions ---- */
  const c3=card(s,'Standing assumptions','stated once, applied everywhere');
  c3.insertAdjacentHTML('beforeend',`<div style="font-size:12.5px;line-height:1.65">
    <b>1. GST at 18%.</b> MRP and selling price are GST-inclusive in the source; net revenue is ex-GST.
      The 1.18 factor is implied by SP ÷ SP-without-GST on every row of every sheet.<br>
    <b>2. Overhead is a flat per-unit allocation</b> that changes by period — ${PIDS.map(i=>`${esc(PMETA[i].short)} ${R(BL[i].ohPU)}`).join(', ')} —
      applied identically to every SKU, as given. It is an allocation, not a measured cost, so EBITDA by SKU reads as
      "contribution after a uniform overhead charge".<br>
    <b>3. Returns are a flat per-unit provision</b> — ${PIDS.map(i=>`${esc(PMETA[i].short)} ${R1(BL[i].retPU)}`).join(', ')} — as given,
      not an observed return rate. A true refund percentage is not available in the file.<br>
    <b>4. Product CAC is marketing spend ÷ units sold</b>, not spend ÷ new customers, because per-SKU customer
      counts do not exist. The portfolio new-customer CAC in section 01 does use new-buyer orders.<br>
    <b>5. Daily and monthly cost lines are modelled</b> by converting actual daily GMV into units at the matching
      period's blended GMV-per-unit rate, then applying that period's blended per-unit costs. Actual daily GMV,
      the source net-sales column, marketing spend, orders, traffic and add-to-cart are never modelled.<br>
    <b>6. Discount and CAC scenarios hold volume constant.</b> The file contains no price or spend elasticity,
      so a simulated discount change moves price alone.<br>
    <b>7. Apr–Jun is a single product-P&L block.</b> Where it is compared with July or August it is restated as a
      monthly average; it is never split into individual months, because the source cannot support that.<br>
    <b>8. Product-level sessions are excluded.</b> In all three Ads sheets each SKU's session count equals its ad
      spend divided by one constant, so it is a spend-proportional allocation rather than measured traffic.
      The product funnel is built on items viewed, added to cart and purchased instead. Site traffic comes from the
      daily sheets, which is a genuine measurement.<br>
    <b>9. Nothing is imputed.</b> Where a field is absent the dashboard prints an em dash or an explicit N/A panel
      rather than a zero or an estimate.</div>`);

  /* ---- remaining gaps ---- */
  const c4=card(s,'What still cannot be shown','and why');
  naBox(c4,'<b>Checkout-initiated stage.</b> No sheet records it.',
    'The funnel goes session → cart → order; the checkout step is left explicitly empty rather than interpolated.');
  naBox(c4,'<b>Orders and new customers by SKU.</b> The product sheets record units, not orders or buyers.',
    'Product CAC is therefore per unit, and break-even orders use a portfolio units-per-order ratio.');
  naBox(c4,'<b>Product performance by day.</b> The product sheets are monthly blocks; the daily sheets carry no SKU split.',
    'Daily analysis is portfolio-level only. A SKU × date table would have to be fabricated, so it is not shown.');
  naBox(c4,'<b>April, May and June product economics separately.</b> They share one combined sheet.',
    'Product month-on-month starts from an Apr–Jun monthly average and is exact only for July → August.');
  naBox(c4,'<b>Refund and return rate.</b> Returns appear only as a flat per-unit provision.',
    'A true return percentage cannot be derived from a constant.');
}
function cov(v,days){
  const full=v>=days;
  return `<span class="pill ${full?'p-g':v?'p-a':'p-n'}">${v}/${days}</span>`;
}

/* ============================================================================
   SHELL, RENDER LOOP AND WIRING
   ========================================================================== */
function buildShell(){
  $('#stamp').textContent = `${DATA.meta.nProducts} SKUs · ${DATA.daily.length} days · Apr–Aug 2026 · built from ${DATA.meta.src}`;
  const df=$('#dFrom'), dt=$('#dTo');
  const ds=DATA.daily.map(d=>d.d).sort();
  df.min=dt.min=ds[0]; df.max=dt.max=ds[ds.length-1];
  df.value=ds[0]; dt.value=ds[ds.length-1];
}

function renderAll(){
  SECTIONS.length=0;
  $('#main').innerHTML='';
  tagProducts(timePids());
  buildFilterOptions();
  try{
    renderExec(); renderSoWhat(); renderPeriods(); renderMonthly(); renderDaily();
    renderFunnel(); renderProdFunnel(); renderCategory();
    renderUnitEcon(); renderMatrix(); renderEbitda(); renderShipping();
    renderCac(); renderMaxCac(); renderBreakeven(); renderDiscount();
    renderWaterfall(); renderDiagnostic(); renderActions(); renderProdMoM(); renderPricing();
    renderCombined(); renderBridge(); renderAlerts();
    renderScorecard(); renderTopBottom(); renderRecs(); renderMethod();
  }catch(e){
    const d=document.createElement('div'); d.className='na';
    d.innerHTML=`<b>Render error.</b> ${esc(e&&e.message||String(e))}`;
    $('#main').appendChild(d);
    if(typeof console!=='undefined') console.error(e);
  }
  const nav=$('#navbar');
  nav.innerHTML=SECTIONS.map((s,i)=>`<a href="#${s.id}">${String(i+1).padStart(2,'0')} ${esc(s.title)}</a>`).join('');
  $('#foot').innerHTML=`Built from <b>${esc(DATA.meta.src)}</b> ·
    sheets: ${DATA.meta.sheets.map(esc).join(', ')} ·
    ${DATA.meta.nProducts} unique SKUs · ${DATA.daily.length} days ·
    every figure recomputed in the browser from the embedded source extract — no external calls, no hard-coded conclusions.`;
}

function wire(){
  $$('#segTime button').forEach(b=>b.addEventListener('click',()=>{
    $$('#segTime button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    S.time=b.dataset.t;
    const cus=S.time==='custom';
    $('#customWrap').style.display=cus?'':'none';
    $('#customWrap2').style.display=cus?'':'none';
    if(cus){S.from=$('#dFrom').value;S.to=$('#dTo').value;}
    renderAll();
  }));
  $('#dFrom').addEventListener('change',e=>{S.from=e.target.value;if(S.time==='custom')renderAll();});
  $('#dTo').addEventListener('change',e=>{S.to=e.target.value;if(S.time==='custom')renderAll();});
  const bind=(id,k)=>{const el=$(id);if(el)el.addEventListener('change',e=>{S[k]=e.target.value;renderAll();});};
  bind('#fCat','cat');bind('#fSub','sub');bind('#fSku','sku');bind('#fBand','band');
  bind('#fProf','prof');bind('#fCm2','cm2');bind('#fEb','eb');bind('#fMkt','mkt');bind('#fFun','fun');
  $('#btnReset').addEventListener('click',()=>{
    ['cat','sub','type','sku','band','prof','cm2','eb','mkt','fun'].forEach(k=>S[k]='');
    ['#fCat','#fSub','#fType','#fSku','#fBand','#fProf','#fCm2','#fEb','#fMkt','#fFun']
      .forEach(id=>{const e=$(id);if(e)e.value='';});
    renderAll();
  });
  $('#btnPrint').addEventListener('click',()=>window.print());
}

buildShell();
renderAll();
wire();
</script>
