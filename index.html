<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Unit Economics &amp; Full-Funnel P&amp;L — Apr–Jun 2026</title>
<style>
:root{
  --ink:#12181f; --ink2:#3c4854; --ink3:#6b7885; --line:#dfe4e9; --line2:#eef1f4;
  --bg:#ffffff; --bg2:#f7f9fa; --navy:#123a5c; --navy2:#1f5c8b; --teal:#2b7f7f;
  --red:#b32d1f; --redbg:#fbecea; --amber:#b47500; --amberbg:#fdf3e2; --green:#1c7a4a; --greenbg:#eaf5ee;
  --slate:#8a97a3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:132px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Söhne","Inter","Helvetica Neue",Arial,"Segoe UI",sans-serif;
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.01em}
a{color:var(--navy2)}
.wrap{max-width:1560px;margin:0 auto;padding:0 26px}

/* ---------- masthead + controls ---------- */
#top{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.mast{display:flex;align-items:baseline;gap:16px;padding:12px 0 10px;border-bottom:1px solid var(--line2)}
.mast h1{font-size:17px}
.mast .sub{color:var(--ink3);font-size:12px}
.mast .spacer{flex:1}
.mast .stamp{font-size:11px;color:var(--ink3);text-align:right;line-height:1.35}
.ctrls{display:flex;flex-wrap:wrap;gap:14px;padding:9px 0 10px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:10.5px;color:var(--ink3);letter-spacing:.02em}
select,input[type=text],input[type=date]{font:inherit;font-size:12px;padding:5px 7px;border:1px solid var(--line);
  border-radius:2px;background:#fff;color:var(--ink);min-width:118px;max-width:190px}
select:focus,input:focus,button:focus{outline:2px solid var(--navy2);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{font:inherit;font-size:11.5px;padding:5px 10px;border:0;border-right:1px solid var(--line);
  background:#fff;color:var(--ink2);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.btn{font:inherit;font-size:11.5px;padding:6px 11px;border:1px solid var(--line);background:#fff;
  border-radius:2px;cursor:pointer;color:var(--ink2)}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
#navbar{display:flex;gap:0;overflow-x:auto;border-top:1px solid var(--line2);scrollbar-width:thin}
#navbar a{font-size:11px;color:var(--ink3);text-decoration:none;padding:7px 10px;white-space:nowrap;border-bottom:2px solid transparent}
#navbar a:hover{color:var(--navy);background:var(--bg2)}
#navbar a.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}

/* ---------- sections ---------- */
section{padding:30px 0 6px;border-top:1px solid var(--line2)}
section:first-of-type{border-top:0}
.shead{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.shead .n{font-size:11px;color:var(--slate);font-variant-numeric:tabular-nums;min-width:22px}
.shead h2{font-size:16px}
.shead .tag{font-size:10.5px;color:var(--ink3);border:1px solid var(--line);border-radius:2px;padding:1px 6px}
.lede{color:var(--ink2);font-size:12.5px;max-width:104ch;margin:2px 0 16px}

/* ---------- kpi ---------- */
.kpigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:1px;background:var(--line2);
  border:1px solid var(--line2)}
.kpi{background:#fff;padding:11px 12px 10px}
.kpi .k{font-size:10.5px;color:var(--ink3);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px}
.kpi .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;line-height:1.15}
.kpi .m{font-size:11px;color:var(--ink3);margin-top:3px;font-variant-numeric:tabular-nums;display:flex;gap:8px;flex-wrap:wrap}
.kpigroup{font-size:11px;font-weight:600;color:var(--ink2);margin:18px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--ink3)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.d-g{background:var(--green)}.d-a{background:var(--amber)}.d-r{background:var(--red)}.d-n{background:var(--slate)}

/* ---------- insight cards ---------- */
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.ins{border:1px solid var(--line);border-left:3px solid var(--navy);padding:11px 13px;background:#fff}
.ins.r{border-left-color:var(--red)} .ins.a{border-left-color:var(--amber)} .ins.g{border-left-color:var(--green)}
.ins h4{font-size:11.5px;color:var(--ink3);font-weight:600;margin-bottom:5px}
.ins p{margin:0;font-size:12.5px;color:var(--ink);line-height:1.55}
.ins b{font-variant-numeric:tabular-nums}

/* ---------- tables ---------- */
.tblwrap{border:1px solid var(--line);overflow:auto;max-height:620px;position:relative}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:#f2f5f7;text-align:right;padding:7px 9px;font-weight:600;font-size:10.5px;
  color:var(--ink2);border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:2}
thead th.l,tbody td.l{text-align:left}
thead th:hover{background:#e8edf1}
thead th .ar{color:var(--slate);font-size:9px;margin-left:2px}
tbody td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody tr:hover{background:#f8fbfc}
tbody tr.tot{background:#f2f5f7;font-weight:600}
tbody tr.tot td{border-top:1px solid var(--line)}
td.l{max-width:290px;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:1px 6px;border-radius:2px;font-size:10.5px;font-weight:600;white-space:nowrap}
.p-r{background:var(--redbg);color:var(--red)}.p-a{background:var(--amberbg);color:var(--amber)}
.p-g{background:var(--greenbg);color:var(--green)}.p-n{background:#eef1f4;color:var(--ink3)}
.neg{color:var(--red)}
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tbar .cnt{font-size:11px;color:var(--ink3);margin-left:auto}
.bar-cell{position:relative}
.bar-cell i{position:absolute;left:0;top:2px;bottom:2px;background:#dbe6ee;z-index:0;display:block}
.bar-cell span{position:relative;z-index:1}

/* ---------- charts ---------- */
.chartgrid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{border:1px solid var(--line);padding:12px 13px 9px;background:#fff}
.card h3{font-size:12px;margin-bottom:2px}
.card .cs{font-size:10.5px;color:var(--ink3);margin-bottom:7px}
svg.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:11px;font-size:10.5px;color:var(--ink2);margin-top:6px}
.legend i{width:9px;height:9px;display:inline-block;margin-right:4px;vertical-align:baseline;border-radius:1px}
.note{font-size:11px;color:var(--ink3);margin-top:8px;line-height:1.5}
.na{border:1px dashed var(--line);background:var(--bg2);padding:14px 16px;color:var(--ink2);font-size:12.5px}
.na b{color:var(--red)}
.tip{position:fixed;pointer-events:none;background:#12181f;color:#fff;font-size:11px;padding:6px 8px;
  border-radius:2px;z-index:200;opacity:0;transition:opacity .1s;max-width:280px;line-height:1.45}
.tip.on{opacity:1}
.simgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2)}
.simgrid .kpi{padding:9px 11px}
input[type=range]{width:100%;accent-color:var(--navy)}
.flex{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:9px}
.alert{display:flex;gap:10px;border:1px solid var(--line);padding:9px 11px;font-size:12.5px;align-items:flex-start}
.alert.r{background:var(--redbg);border-color:#f0cdc7}
.alert.a{background:var(--amberbg);border-color:#f2ddb6}
.alert.g{background:var(--greenbg);border-color:#c9e4d4}
.alert .ic{font-weight:700;font-size:12px}
.rec{border:1px solid var(--line);margin-bottom:11px}
.rec .rh{background:#f2f5f7;padding:8px 12px;font-weight:600;font-size:12.5px;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line)}
.rec .rh .rk{font-size:10.5px;color:#fff;background:var(--navy);padding:1px 6px;border-radius:2px}
.rec .rb{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0}
.rec .rb div{padding:9px 12px;border-right:1px solid var(--line2);font-size:12px}
.rec .rb div:last-child{border-right:0}
.rec .rb strong{display:block;font-size:10.5px;color:var(--ink3);font-weight:600;margin-bottom:3px}
details.meth{border:1px solid var(--line);margin-top:10px}
details.meth summary{padding:8px 12px;cursor:pointer;font-size:12px;font-weight:600;background:var(--bg2)}
details.meth .db{padding:0}
footer{margin:40px 0 30px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3)}
@media print{
  #top{position:static} #navbar{display:none} .tblwrap{max-height:none;overflow:visible}
  section{break-inside:auto;page-break-inside:auto} .card{break-inside:avoid}
  body{font-size:10px} .btn,.seg,select,input{display:none}
  .ctrls{display:none}
}
@media (max-width:760px){ .wrap{padding:0 12px} .mast .stamp{display:none} }
</style>
</head>

/* ============================================================================
   2. DERIVED PRODUCT MODEL
   ========================================================================== */
const OH_PU = 229.33;                       // overhead per unit, constant in source
const GST   = 1.18;                         // MRP/SP are GST-inclusive; SP without GST = SP/1.18
const RET_PU_DEFAULT = 6.75;                // returns provision per unit, constant in source
const UNITS_PER_ORDER = 3066/1764;          // total units / total orders (Apr+Jun daily sheets)

const PROD = P0.map(p=>{
  const varCost = p.cogs+p.pack+p.razor+p.ship+p.cod+p.shopify+p.shopflo;
  const o = Object.assign({},p);
  o.varCost      = varCost;
  o.varAll       = varCost + p.mkt;
  o.cm2Tot       = p.cm2*p.units;
  o.cm1Tot       = p.cm1*p.units;
  o.ebitdaTot    = p.ebitda*p.units;
  o.cogsTot      = p.cogs*p.units;
  o.shipTot      = p.ship*p.units;
  o.ohTot        = OH_PU*p.units;
  o.gmTot        = p.gm*p.units;
  o.shipPctRev   = div(p.ship,p.nru);
  o.shipPctAsp   = div(p.ship,p.sp);
  o.cogsPctRev   = div(p.cogs,p.nru);
  o.mktPctRev    = div(p.mkt,p.nru);
  o.cm2BeforeShip= p.cm2 + p.ship;
  o.shipKills    = (o.cm2BeforeShip>0 && p.cm2<=0);
  // funnel
  o.hasFunnel    = p.matched && p.sessions>0;
  o.cvr          = o.hasFunnel? div(p.purch,p.sessions):null;   // session -> unit purchased
  o.viewRate     = o.hasFunnel? div(p.views,p.sessions):null;
  o.atcRate      = (p.views)? div(p.atc,p.views):null;
  o.atcPurch     = (p.atc)? div(p.purch,p.atc):null;
  o.revPerSession= o.hasFunnel? div(p.netRev,p.sessions):null;
  o.revPerView   = (p.views)? div(p.netRev,p.views):null;
  // CAC economics (marketing cost per unit sold — see methodology)
  o.cac          = p.mkt;
  o.maxCacCM2    = p.cm1;                       // CM2 = 0
  o.maxCacEbitda = p.cm1 - OH_PU;               // EBITDA = 0
  o.maxCac10     = p.cm1 - OH_PU - 0.10*p.nru;  // EBITDA = 10% of net revenue
  o.cacHeadroom  = o.maxCacEbitda - p.mkt;
  o.roas         = div(p.netRev, p.totMkt);
  o.cacStatus    = p.mkt<=0 ? 'No spend' : (p.mkt<=o.maxCacEbitda?'Efficient':(p.mkt<=o.maxCacCM2?'Watch':'Destroying profit'));
  // break-even
  o.contribPU    = p.cm2;
  o.beQty        = (p.cm2>0)? o.ohTot/p.cm2 : null;
  o.beRev        = (o.beQty!==null)? o.beQty*p.nru : null;
  o.beOrders     = (o.beQty!==null)? o.beQty/UNITS_PER_ORDER : null;
  o.beGap        = (o.beQty!==null)? p.units-o.beQty : null;
  o.beClass      = p.cm1<=0 ? 'Structurally unprofitable'
                  : (p.cm2<=0 ? 'Marketing above break-even'
                  : (p.ebitda>0 ? 'Already profitable'
                  : (o.beQty!==null && o.beQty<p.units*3 ? 'Requires volume' : 'Requires volume')));
  // maximum profitable discount  (solve SP such that CM2 / EBITDA = 0)
  const ret = p.ret||RET_PU_DEFAULT;
  o.spMinCM1     = GST*(ret + varCost);
  o.spMinCM2     = GST*(ret + varCost + p.mkt);
  o.spMinEbitda  = GST*(ret + varCost + p.mkt + OH_PU);
  o.maxDiscCM2   = p.mrp? (p.mrp-o.spMinCM2)/p.mrp : null;
  o.maxDiscEb    = p.mrp? (p.mrp-o.spMinEbitda)/p.mrp : null;
  o.discHeadroom = (o.maxDiscCM2!==null)? o.maxDiscCM2-p.discPct : null;
  o.band         = p.mrp<500?'Under ₹500':p.mrp<1000?'₹500–999':p.mrp<1500?'₹1,000–1,499':p.mrp<2000?'₹1,500–1,999':'₹2,000+';
  o.profStatus   = p.ebitda>0?'EBITDA positive':(p.cm2>0?'CM2 positive, EBITDA negative':(p.cm1>0?'CM1 positive, CM2 negative':'CM1 negative'));
  o.cm2Status    = p.cm2>0?'Positive CM2':'Negative CM2';
  o.ebStatus     = p.ebitda>0?'Positive EBITDA':'Negative EBITDA';
  o.type         = p.cat==='Combo'?'Bundle / combo':(p.cat==='Digital Print'?'Digital':'Single SKU');
  return o;
});
const MED_CVR   = med(PROD.filter(p=>p.hasFunnel).map(p=>p.cvr));
const MED_SESS  = med(PROD.filter(p=>p.hasFunnel).map(p=>p.sessions));
const MED_ATC   = med(PROD.filter(p=>p.atcRate!==null).map(p=>p.atcRate));
const MED_A2P   = med(PROD.filter(p=>p.atcPurch!==null).map(p=>p.atcPurch));
const MED_VIEW  = med(PROD.filter(p=>p.viewRate!==null).map(p=>p.viewRate));
PROD.forEach(p=>{
  p.funStatus = !p.hasFunnel?'No traffic data'
    : (p.cvr>=MED_CVR ? (p.sessions>=MED_SESS?'High traffic · high CVR':'Low traffic · high CVR')
                      : (p.sessions>=MED_SESS?'High traffic · low CVR':'Low traffic · low CVR'));
  p.quad = !p.hasFunnel?'No traffic data'
    : (p.cvr>=MED_CVR ? (p.sessions>=MED_SESS?'Scale':'Increase traffic')
                      : (p.sessions>=MED_SESS?'Fix conversion':'Review / deprioritise'));
});
/* --- CM2 portfolio matrix classification --- */
const REV_MED = med(PROD.map(p=>p.netRev));
PROD.forEach(p=>{
  const hiRev=p.netRev>=REV_MED, hiCm2=p.cm2Pct>0;
  p.matrix = hiRev? (hiCm2?'Star':'Revenue trap') : (hiCm2?'Profit niche':'Dog');
});
const MATRIX_COLOR={'Star':C.green,'Profit niche':C.teal,'Revenue trap':C.amber,'Dog':C.red};

/* ============================================================================
   3. DIAGNOSTIC ENGINE  (ordered rules, ₹ impact quantified)
   ========================================================================== */
const SHIP_THRESHOLD=0.15, COGS_THRESHOLD=0.30, DISC_THRESHOLD=0.15;
PROD.forEach(p=>{
  const ev=[],iss=[];
  const add=(k,impact,evidence,action)=>iss.push({k,impact:impact||0,evidence,action});
  if(p.cm1<=0)
    add('Product economics','Negative contribution before marketing',
      `CM1 ${R1(p.cm1)}/unit on net revenue ${R1(p.nru)} — variable cost ${R1(p.varCost)} exceeds revenue`,
      'Reprice or discontinue — the SKU loses money before a rupee of marketing');
  if(p.mkt>p.maxCacCM2 && p.cm1>0)
    add('CAC',(p.mkt-p.maxCacEbitda)*p.units,
      `Marketing ${R1(p.mkt)}/unit vs break-even CAC ${R1(p.maxCacCM2)} (CM1) — overspend ${R1(p.mkt-p.maxCacCM2)}/unit`,
      `Cap CAC at ${R1(Math.max(0,p.maxCacEbitda))}/unit for EBITDA break-even`);
  if(p.shipPctRev>SHIP_THRESHOLD)
    add('Shipping',(p.ship-BL.shipPU)*p.units,
      `Shipping ${R1(p.ship)}/unit = ${PC(p.shipPctRev)} of net revenue vs ${PC(div(BL.shipPU,BL.netRevPU))} portfolio average`,
      'Bundle, raise minimum order value or renegotiate courier zone');
  if(p.cogsPctRev>COGS_THRESHOLD)
    add('COGS',(p.cogsPctRev-COGS_THRESHOLD)*p.netRev,
      `Cost of material ${R1(p.cogs)}/unit = ${PC(p.cogsPctRev)} of net revenue`,
      'Re-source materials or reprice — gross margin is structurally thin');
  if(p.discPct>DISC_THRESHOLD)
    add('Discount',(p.discPct-DISC_THRESHOLD)*p.mrp*p.units,
      `Discount ${PC(p.discPct)} of MRP (${R1(p.disc)}/unit) vs ${PC(DISC_THRESHOLD,0)} guardrail`,
      `Cut discount toward ${PC(Math.max(0,Math.min(DISC_THRESHOLD,p.maxDiscCM2||0)))} to restore CM2`);
  if(p.hasFunnel && p.sessions>=MED_SESS && p.cvr<MED_CVR*0.7)
    add('Conversion',(MED_CVR-p.cvr)*p.sessions*p.nru,
      `${N(p.sessions)} sessions at ${PC(p.cvr,2)} CVR vs ${PC(MED_CVR,2)} median — ${N((MED_CVR-p.cvr)*p.sessions)} units foregone`,
      'Fix PDP: imagery, price framing, reviews, delivery promise');
  if(p.views>200 && p.atcRate!==null && p.atcRate<MED_ATC*0.7)
    add('Add-to-cart',(MED_ATC-p.atcRate)*p.views*p.atcPurch*p.nru,
      `ATC rate ${PC(p.atcRate)} of product views vs ${PC(MED_ATC)} median on ${N(p.views)} views`,
      'Rework PDP offer block, variant selection and price anchoring');
  if(p.atc>60 && p.atcPurch!==null && p.atcPurch<MED_A2P*0.7)
    add('Checkout',(MED_A2P-p.atcPurch)*p.atc*p.nru,
      `Only ${PC(p.atcPurch)} of ${N(p.atc)} carts convert vs ${PC(MED_A2P)} median`,
      'Reduce checkout friction: shipping fee reveal, payment options, guest checkout');
  if(p.cm2>0 && p.hasFunnel && p.cvr>=MED_CVR && p.sessions<MED_SESS)
    add('Scale',p.cm2*(MED_SESS-p.sessions)*p.cvr,
      `CM2 ${R1(p.cm2)}/unit at ${PC(p.cvr,2)} CVR but only ${N(p.sessions)} sessions (median ${N(MED_SESS)})`,
      'Shift budget in — this SKU converts profitably and is traffic-starved');
  if(p.sp<p.spMinEbitda && p.cm1>0 && p.mkt<=p.maxCacCM2)
    add('Price',(p.spMinEbitda-p.sp)*p.units,
      `Selling price ${R1(p.sp)} below ${R1(p.spMinEbitda)} needed for EBITDA break-even at current cost stack`,
      `Raise price by ${R1(p.spMinEbitda-p.sp)} or move volume into a higher-AOV bundle`);
  iss.sort((a,b)=>Math.abs(b.impact)-Math.abs(a.impact));
  p.issues=iss;
  p.issue = iss.length? iss[0] : {k:'Healthy',impact:0,evidence:`CM2 ${R1(p.cm2)}/unit (${PC(p.cm2Pct)}), EBITDA ${R1(p.ebitda)}/unit`,action:'Protect and scale'};
});
/* --- action prioritisation buckets --- */
const ACTION_ORDER=['Scale now','Increase traffic','Fix conversion','Fix shipping','Reduce CAC','Reduce discount','Reprice','Bundle','Review / discontinue','Monitor'];
PROD.forEach(p=>{
  const k=p.issue.k;
  let a='Monitor';
  if(p.cm1<=0) a='Review / discontinue';
  else if(p.cm2<=0 && p.netRev<REV_MED && p.units<=5) a='Review / discontinue';
  else if(k==='Shipping') a= (p.sp<900?'Bundle':'Fix shipping');
  else if(k==='CAC') a='Reduce CAC';
  else if(k==='Discount') a='Reduce discount';
  else if(k==='COGS'||k==='Price') a='Reprice';
  else if(k==='Conversion'||k==='Add-to-cart'||k==='Checkout') a='Fix conversion';
  else if(k==='Scale') a='Increase traffic';
  else if(k==='Healthy') a=(p.ebitda>0 && p.hasFunnel && p.cvr>=MED_CVR)?'Scale now':'Monitor';
  if(p.ebitda>0 && p.hasFunnel && p.cvr>=MED_CVR && p.sessions>=MED_SESS) a='Scale now';
  p.action=a;
});
/* --- scorecard --- */
function rankAsc(arr,f){const v=arr.map(f);const idx=arr.map((_,i)=>i).sort((a,b)=>(v[a]??-1e18)-(v[b]??-1e18));
  const r=new Array(arr.length);idx.forEach((k,i)=>r[k]=i);return r;}
(function score(){
  const A=PROD;
  const rRev=rankAsc(A,p=>p.netRev), rCvr=rankAsc(A,p=>p.cvr??-1),
        rCm2=rankAsc(A,p=>p.cm2Pct), rEb=rankAsc(A,p=>p.ebitdaPct),
        rCac=rankAsc(A,p=>p.cm1>0? (p.mkt>0? p.cm1/p.mkt : 5) : -1),
        rShip=rankAsc(A,p=>-(p.shipPctRev??1));
  const n=A.length-1||1;
  A.forEach((p,i)=>{
    p.rankRev=A.length-rRev[i]; p.rankCvr=A.length-rCvr[i];
    p.rankCm2=A.length-rCm2[i]; p.rankEb=A.length-rEb[i];
    p.rankCac=A.length-rCac[i]; p.rankShip=A.length-rShip[i];
    p.score = 100*(0.18*(rRev[i]/n)+0.18*(rCvr[i]/n)+0.28*(rCm2[i]/n)+0.20*(rEb[i]/n)+0.10*(rCac[i]/n)+0.06*(rShip[i]/n));
  });
})();

/* ============================================================================
   4. TIME-SERIES MODEL  (daily sheets = actual revenue / spend / traffic;
      cost stack modelled from blended 3-month per-unit rates)
   ========================================================================== */
const MONTHS={apr:{k:'Apr',label:'April 2026'},may:{k:'May',label:'May 2026'},jun:{k:'Jun',label:'June 2026'}};
function modelDay(d){
  // GMV is the one revenue field defined identically in the product sheet and the daily sheets,
  // so it is used as the volume anchor. Ex-GST net revenue and the cost stack are then modelled
  // from the quarter's blended per-unit economics. Marketing, orders and traffic are actuals.
  const units = div(d.gmv, BL.gmvPU) || 0;
  const netRev = units*BL.netRevPU;
  const cogs=units*BL.cogsPU, ship=units*BL.shipPU, pack=units*BL.packPU,
        razor=units*BL.razorPU, cod=units*BL.codPU, shopify=units*BL.shopifyPU,
        shopflo=units*BL.shopfloPU, oh=units*BL.ohPU;
  const other=pack+razor+cod+shopify+shopflo;
  const cm1=netRev-cogs-ship-other, cm2=cm1-d.mkt, eb=cm2-oh;
  return {...d,units,netRevSrc:d.netRev,netRev,cogs,ship,pack,razor,cod,shopify,shopflo,other,oh,
    gm:netRev-cogs,cm1,cm2,ebitda:eb,
    cm2Pct:div(cm2,netRev),ebitdaPct:div(eb,netRev),cm1Pct:div(cm1,netRev),
    discount:d.gmv*d.promo, cac:div(d.mkt,d.nbOrders||null), aovC:div(d.gmv,d.orders||null),
    asp:div(netRev,units), cvr:d.hasTraffic?div(d.orders,d.traffic):null};
}
function aggDays(rows){
  const s=(f)=>rows.reduce((a,r)=>a+(r[f]||0),0);
  const tr=rows.filter(r=>r.hasTraffic), or=rows.filter(r=>r.hasOrders);
  const both=rows.filter(r=>r.hasTraffic&&r.hasOrders);
  const netRev=s('netRev'), gmv=s('gmv'), mkt=s('mkt'), units=s('units');
  const orders=or.reduce((a,r)=>a+r.orders,0), traffic=tr.reduce((a,r)=>a+r.traffic,0);
  const gmvOrderDays=or.reduce((a,r)=>a+r.gmv,0);
  const nb=or.reduce((a,r)=>a+(r.nbOrders||0),0), rb=or.reduce((a,r)=>a+(r.rbOrders||0),0);
  const cogs=s('cogs'),ship=s('ship'),other=s('other'),oh=s('oh');
  const cm1=netRev-cogs-ship-other, cm2=cm1-mkt, eb=cm2-oh;
  return {days:rows.length,trafficDays:tr.length,orderDays:or.length,
    gmv,netRev,netRevSrc:s('netRevSrc'),mkt,units,orders,traffic,nb,rb,cogs,ship,other,oh,cm1,cm2,ebitda:eb,
    gm:netRev-cogs, gmPct:div(netRev-cogs,netRev),
    discount:s('discount'),
    aov:div(gmvOrderDays,orders), asp:div(netRev,units),
    cvr:div(both.reduce((a,r)=>a+r.orders,0), both.reduce((a,r)=>a+r.traffic,0)),
    cac:div(or.reduce((a,r)=>a+r.mkt,0),nb),
    mktPct:div(mkt,netRev), cm1Pct:div(cm1,netRev), cm2Pct:div(cm2,netRev), ebitdaPct:div(eb,netRev),
    discPct:div(s('discount'),gmv), shipPerOrder:div(ship,orders), shipPerUnit:div(ship,units),
    contribPerOrder:div(cm2,orders), contribPerUnit:div(cm2,units)};
}

    if(q){const Q=q.toLowerCase();d=d.filter(r=>cols.some(c=>String(c.raw?c.raw(r):val(r,c)??'').toLowerCase().includes(Q)));}
    if(sortI!==null){const c=cols[sortI];
      d.sort((a,b)=>{let x=val(a,c),y=val(b,c);
        if(typeof x==='string'||typeof y==='string')return String(x??'').localeCompare(String(y??''))*sortD;
        x=(x===null||x===undefined||!isFinite(x))?-Infinity:x;y=(y===null||y===undefined||!isFinite(y))?-Infinity:y;
        return (x-y)*sortD;});}
    const body=d.map(r=>`<tr>${cols.map(c=>{
      const raw=val(r,c);const disp=c.f?c.f(raw,r):(typeof raw==='number'?N(raw):esc(raw??'—'));
      return `<td class="${c.l?'l':''} ${c.neg&&typeof raw==='number'&&raw<0?'neg':''}"${c.l?' title="'+esc(String(raw??''))+'"':''}>${disp}</td>`;
    }).join('')}</tr>`).join('');
    tb.querySelector('tbody').innerHTML=body+(opt.total?opt.total(d):'');
    $('#'+id+'n').textContent=d.length+' of '+rows.length+' rows';
    $$('th',tb).forEach((th,i)=>th.querySelector('.ar').textContent=(i===sortI?(sortD<0?'▼':'▲'):''));
    wrap._data=d;
  }
  $$('th',tb).forEach(th=>th.addEventListener('click',()=>{
    const i=+th.dataset.i; if(sortI===i)sortD=-sortD; else{sortI=i;sortD=-1;} render();}));
  if(opt.search!==false)$('#'+id+'s').addEventListener('input',e=>{q=e.target.value;render();});
  $('#'+id+'c').addEventListener('click',()=>{
    const d=wrap._data||rows;
    const csv=[cols.map(c=>'"'+c.h.replace(/"/g,'""')+'"').join(',')]
      .concat(d.map(r=>cols.map(c=>{const v=c.raw?c.raw(r):val(r,c);
        return typeof v==='number'?(isFinite(v)?v:''):'"'+String(v??'').replace(/"/g,'""')+'"';}).join(',')));
    const b=new Blob([csv.join('\n')],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=(opt.name||'export')+'.csv';a.click();URL.revokeObjectURL(a.href);
  });
  render();
  return wrap;
}

function renderSoWhat(){
  const s=$('#s-sowhat');s.querySelectorAll('.insights,.note').forEach(e=>e.remove());
  const box=document.createElement('div');box.className='insights';s.appendChild(box);
  const A=aggProducts(PROD), apr=MONTH_AGG.apr, may=MONTH_AGG.may, jun=MONTH_AGG.jun;
  const add=(t,h,c)=>{const d=document.createElement('div');d.className='ins '+(c||'');
    d.innerHTML=`<h4>${esc(t)}</h4><p>${h}</p>`;box.appendChild(d);};

  // Revenue driver
  const byRev=PROD.slice().sort((a,b)=>b.netRev-a.netRev);
  const top2=byRev.slice(0,2), top2Share=div(top2.reduce((a,p)=>a+p.netRev,0),A.netRev);
  const revMoM1=div(may.netRev,apr.netRev)-1, revMoM2=div(jun.netRev,may.netRev)-1;
  add('Revenue',`Net revenue moved <b class="${sgn(revMoM1)}">${PCS(revMoM1)}</b> April→May and <b class="${sgn(revMoM2)}">${PCS(revMoM2)}</b> May→June
    (${RL(apr.netRev)} → ${RL(may.netRev)} → ${RL(jun.netRev)}). Across the quarter <b>${esc(top2[0].code)}</b> and <b>${esc(top2[1].code)}</b>
    alone carry <b>${PC(top2Share)}</b> of net revenue, so portfolio revenue is effectively two SKUs deep.`,
    revMoM2<0?'a':'');

  // Profitability
  add('Profitability',`Marketing absorbed <b>${PC(A.mktPct)}</b> of net revenue over the quarter (${RL(A.mkt)} against ${RL(A.netRev)}),
    which turns a healthy <b>${PC(A.cm1Pct)}</b> CM1 into <b class="${A.cm2<0?'down':'up'}">${PC(A.cm2Pct)}</b> CM2 and
    <b class="${A.ebitda<0?'down':'up'}">${PC(A.ebitdaPct)}</b> EBITDA (${RL(A.ebitda)}). The loss is not a product-cost problem:
    gross margin is <b>${PC(A.gmPct)}</b> and CM1 is positive on <b>${N(PROD.filter(p=>p.cm1>0).length)}</b> of ${PROD.length} SKUs.`,'r');

  // Marketing efficiency trend
  const cacTrend=[apr,may,jun].map(m=>m.mktPct);
  add('Marketing efficiency',`Marketing as a share of net revenue ran <b>${PC(apr.mktPct)}</b> in April, <b>${PC(may.mktPct)}</b> in May and
    <b>${PC(jun.mktPct)}</b> in June. Spend rose <b>${PCS(div(jun.mkt,apr.mkt)-1)}</b> from April to June while net revenue moved
    <b>${PCS(div(jun.netRev,apr.netRev)-1)}</b> — every incremental rupee of media is buying less revenue than the rupee before it.`,
    cacTrend[2]>cacTrend[0]?'r':'g');

  // Funnel
  const AD=DATA.adsTotals;
  const stepLoss=[{n:'session → product view',v:1-div(AD.views,AD.sessions),lost:AD.sessions-AD.views},
    {n:'product view → add to cart',v:1-div(AD.atc,AD.views),lost:AD.views-AD.atc},
    {n:'add to cart → purchase',v:1-div(AD.purch,AD.atc),lost:AD.atc-AD.purch}];
  const worst=stepLoss.filter(x=>x.lost>0).sort((a,b)=>b.lost-a.lost)[0]||stepLoss[1];
  add('Funnel',`${N(AD.sessions)} sessions produced ${N(AD.purch)} purchased units — a <b>${PC(div(AD.purch,AD.sessions),2)}</b> session-to-purchase rate.
    The largest absolute leak is <b>${worst.n}</b>, losing <b>${N(worst.lost)}</b> visits (<b>${PC(worst.v)}</b> of that step).
    Add-to-cart converts at <b>${PC(div(AD.atc,AD.views))}</b> of product views and only <b>${PC(div(AD.purch,AD.atc))}</b> of carts become units.`,'a');

  // Worst product
  const worstP=PROD.slice().sort((a,b)=>a.cm2Tot-b.cm2Tot)[0];
  add('Product',`<b>${esc(worstP.code)}</b> (${esc(worstP.name)}) generated ${RL(worstP.netRev)} of net revenue but
    <b class="down">${RL(worstP.cm2Tot)}</b> of CM2, because marketing alone was <b>${R(worstP.mkt)}/unit</b> against a CM1 of only
    <b>${R(worstP.cm1)}/unit</b> — a CAC overshoot of <b>${R(worstP.mkt-worstP.maxCacCM2)}/unit</b> at a session-to-unit CVR of
    <b>${PC(worstP.cvr,2)}</b>.`,'r');

  // Best product
  const bestP=PROD.slice().sort((a,b)=>b.cm2Tot-a.cm2Tot)[0];
  add('Where the money is',`<b>${esc(bestP.code)}</b> delivered <b class="up">${RL(bestP.cm2Tot)}</b> CM2 on ${RL(bestP.netRev)} revenue
    (${PC(bestP.cm2Pct)} CM2), converting at <b>${PC(bestP.cvr,2)}</b> with CAC ${R(bestP.cac)} against a ceiling of ${R(bestP.maxCacCM2)}.
    It has <b>${R(bestP.cacHeadroom)}/unit</b> of headroom before EBITDA break-even — this is where the next rupee of media belongs.`,'g');

  // Shipping
  const shipKill=PROD.filter(p=>p.shipKills);
  add('Shipping',`Shipping to customer costs <b>${R(A.shipPU)}/unit</b> — <b>${PC(A.shipPct)}</b> of net revenue and
    <b>${PC(div(A.ship,A.netRev-A.cogs))}</b> of gross margin. <b>${N(shipKill.length)}</b> SKUs would post positive CM2 if shipping were free,
    representing ${RL(sum(shipKill,p=>p.netRev))} of revenue; the shipping line alone destroys ${RL(sum(shipKill,p=>p.shipTot))} of contribution on them.`,
    A.shipPct>0.15?'r':'a');

  // Discount
  const overDisc=PROD.filter(p=>p.discPct>0.15);
  add('Discounting',`Blended discount is <b>${PC(div(A.disc,A.gmv+A.disc))}</b> of MRP value (${RL(A.disc)}), which is not the primary margin leak.
    <b>${N(overDisc.length)}</b> SKUs discount above 15% of MRP, worth ${RL(sum(overDisc,p=>p.totDisc))}; the more binding constraint is that
    <b>${N(PROD.filter(p=>(p.maxDiscCM2??-1)<0).length)}</b> SKUs cannot support <em>any</em> discount at their current CAC.`,'a');

  // Action
  const capTargets=PROD.filter(p=>p.cm1>0&&p.mkt>p.maxCacEbitda).sort((a,b)=>(b.mkt-b.maxCacEbitda)*b.units-(a.mkt-a.maxCacEbitda)*a.units).slice(0,5);
  const recover=sum(capTargets,p=>(p.mkt-p.maxCacEbitda)*p.units);
  add('Action',`Capping CAC at the EBITDA break-even level on just the five largest overspenders
    (${capTargets.map(p=>esc(p.code)).join(', ')}) would recover <b>${RL(recover)}</b> — <b>${PC(div(recover,Math.abs(A.ebitda)))}</b>
    of the quarter's EBITDA loss — before any change to price, shipping or conversion.`,'g');
}

function renderMonthly(){
  const s=$('#s-month');s.querySelectorAll('.tbar,.tblwrap,.chartgrid,.note,div.card').forEach(e=>e.remove());
  const A=MONTH_AGG.apr,M=MONTH_AGG.may,J=MONTH_AGG.jun;
  const pct=(a,b)=>(a===null||b===null||!isFinite(a)||!isFinite(b)||!b)?null:(a-b)/Math.abs(b);
  // dir: +1 higher is better, -1 lower is better, 0 neutral.  pp: express change in percentage points.
  const met=[
    ['GMV / gross sales',m=>m.gmv,RL,1,0],['Net sales (source column)',m=>m.netRevSrc,RL,1,0],
    ['Net revenue ex-GST (modelled)',m=>m.netRev,RL,1,0],
    ['Orders',m=>m.orders,N,1,0],['Units (modelled)',m=>m.units,N,1,0],
    ['Sessions / traffic',m=>m.traffic,N,1,0],['Conversion rate',m=>m.cvr,v=>PC(v,2),1,1],
    ['AOV',m=>m.aov,R,1,0],['ASP (modelled)',m=>m.asp,R,1,0],['Discount / promo %',m=>m.discPct,v=>PC(v),-1,1],
    ['COGS (modelled)',m=>m.cogs,RL,-1,0],['Gross margin %',m=>m.gmPct,v=>PC(v),1,1],
    ['Shipping (modelled)',m=>m.ship,RL,-1,0],['Marketing spend',m=>m.mkt,RL,-1,0],
    ['Marketing % of net revenue',m=>m.mktPct,v=>PC(v),-1,1],['New-customer CAC',m=>m.cac,R,-1,0],
    ['CM1 (modelled)',m=>m.cm1,RL,1,0],['CM2 (modelled)',m=>m.cm2,RL,1,0],['CM2 %',m=>m.cm2Pct,v=>PC(v),1,1],
    ['EBITDA (modelled)',m=>m.ebitda,RL,1,0],['EBITDA %',m=>m.ebitdaPct,v=>PC(v),1,1]];
  function ch(a,b,dir,pp){
    if(a===null||b===null||a===undefined||b===undefined||!isFinite(a)||!isFinite(b))return {v:null,txt:'—',good:0};
    const delta=a-b;
    const v=pp?delta:pct(a,b);
    if(v===null)return {v:null,txt:'—',good:0};
    const txt=pp?((delta>=0?'+':'')+(delta*100).toFixed(1)+' pp'):PCS(v);
    const flat=pp?Math.abs(delta)<0.0005:Math.abs(v)<0.0005;
    return {v,txt,good:flat?0:(delta>0?dir:-dir),up:flat?0:(delta>0?1:-1)};
  }
  const rows=met.map(([k,f,fmt,dir,pp])=>({k,fmt,a:f(A),m:f(M),j:f(J),
    g1:ch(f(M),f(A),dir,pp),g2:ch(f(J),f(M),dir,pp),g3:ch(f(J),f(A),dir,pp)}));
  const gcell=v=>v.v===null?'—':
    `<span class="${v.good>0?'up':v.good<0?'down':'flat'}">${v.up>0?'▲':v.up<0?'▼':'▬'} ${v.up===0?'0.0%':v.txt}</span>`;
  table(s,[
    {h:'Metric',k:'k',l:true,f:v=>esc(v)},
    {h:'April',k:'a',f:(v,r)=>r.fmt(v)},{h:'May',k:'m',f:(v,r)=>r.fmt(v)},{h:'June',k:'j',f:(v,r)=>r.fmt(v)},
    {h:'Apr→May',k:'g1',f:gcell,raw:r=>r.g1.txt},{h:'May→Jun',k:'g2',f:gcell,raw:r=>r.g2.txt},
    {h:'Apr→Jun',k:'g3',f:gcell,raw:r=>r.g3.txt}],
    rows,{search:false,name:'monthly_comparison',sort:null,maxH:'none'});
  note(s,`June's traffic and order counts are materially incomplete in the source file:
   traffic is recorded on only <b>${MONTH_AGG.jun.trafficDays} of 30 days</b> and orders on <b>${MONTH_AGG.jun.orderDays} of 30 days</b>,
   against ${MONTH_AGG.apr.trafficDays}/30 in April and ${MONTH_AGG.may.trafficDays}/31 in May.
   June conversion, AOV, CAC and order growth are therefore <b>not comparable</b> and are shown for the recorded days only.
   GMV, net revenue and marketing spend are complete for all 91 days.`);

  const L=['April','May','June'],MS=[A,M,J];
  const gr=grid(s,'g2');
  const cc=(t,sub,fn)=>{const c=card(gr,t,sub);fn(c);};
  cc('Revenue trend','GMV and net revenue, actual',c=>gbarChart(c,{labels:L,
    series:[{name:'GMV',values:MS.map(m=>m.gmv),color:C.navy},{name:'Net revenue',values:MS.map(m=>m.netRev),color:C.navy2}],h:230}));
  cc('Orders and traffic','recorded days only — June incomplete',c=>{gbarChart(c,{labels:L,
    series:[{name:'Orders',values:MS.map(m=>m.orders),color:C.teal}],h:200,yFmt:N});
    note(c,`Traffic: ${MS.map((m,i)=>L[i]+' '+N(m.traffic)+' ('+m.trafficDays+'d)').join(' · ')}`);});
  cc('Conversion rate','orders ÷ sessions, recorded days',c=>lineChart(c,{labels:L,
    series:[{name:'CVR',values:MS.map(m=>m.cvr),color:C.teal,fill:true}],h:200,yFmt:v=>PC(v,2)}));
  cc('Marketing spend and intensity','spend bars, % of net revenue line',c=>{gbarChart(c,{labels:L,
    series:[{name:'Marketing spend',values:MS.map(m=>m.mkt),color:C.red}],h:200});
    lineChart(c,{labels:L,series:[{name:'Marketing % of net revenue',values:MS.map(m=>m.mktPct),color:C.amber,fill:true}],h:150,yFmt:v=>PC(v,0)});});
  cc('New-customer CAC','marketing ÷ new-buyer orders, recorded days',c=>lineChart(c,{labels:L,
    series:[{name:'CAC',values:MS.map(m=>m.cac),color:C.red,fill:true}],h:200,yFmt:R}));
  cc('CM2 and EBITDA','modelled — blended cost rates on actual revenue',c=>gbarChart(c,{labels:L,
    series:[{name:'CM2',values:MS.map(m=>m.cm2),color:C.navy2},{name:'EBITDA',values:MS.map(m=>m.ebitda),color:C.red}],h:230}));
}

function renderDaily(){
  const s=$('#s-daily');s.querySelectorAll('.tbar,.tblwrap,.chartgrid,.note,.insights').forEach(e=>e.remove());
  const rows=timeRows();
  const cols=[
    {h:'Date',k:'date',l:true,f:v=>esc(v)},{h:'Day',k:'day',l:true,f:v=>esc(v)},
    {h:'GMV',k:'gmv',f:F.r},{h:'Net sales (source)',k:'netRevSrc',f:F.r},
    {h:'Net revenue ex-GST (modelled)',k:'netRev',f:F.r},
    {h:'Orders',k:'orders',f:v=>v?N(v):'—'},{h:'Units (modelled)',k:'units',f:F.n},
    {h:'AOV',k:'aov',f:v=>v?R(v):'—'},{h:'Discount',k:'discount',f:F.r},
    {h:'COGS',k:'cogs',f:F.r},{h:'Shipping',k:'ship',f:F.r},{h:'Marketing',k:'mkt',f:F.r},
    {h:'CM1',k:'cm1',f:F.r,neg:1},{h:'CM2',k:'cm2',f:F.r,neg:1},{h:'EBITDA',k:'ebitda',f:F.r,neg:1},
    {h:'CM2 %',k:'cm2Pct',f:F.p},{h:'EBITDA %',k:'ebitdaPct',f:F.p}];
  table(s,cols,rows,{name:'daily_pnl',sort:0,desc:false,maxH:'480px',
    total:d=>{const t=aggDays(d);return `<tr class="tot"><td class="l">Total (${d.length} days)</td><td class="l"></td>
      <td>${R(t.gmv)}</td><td>${R(t.netRevSrc)}</td><td>${R(t.netRev)}</td><td>${N(t.orders)}</td><td>${N(t.units)}</td><td>${R(t.aov)}</td>
      <td>${R(t.discount)}</td><td>${R(t.cogs)}</td><td>${R(t.ship)}</td><td>${R(t.mkt)}</td>
      <td class="${cls(t.cm1)}">${R(t.cm1)}</td><td class="${cls(t.cm2)}">${R(t.cm2)}</td>
      <td class="${cls(t.ebitda)}">${R(t.ebitda)}</td><td class="${cls(t.cm2Pct)}">${PC(t.cm2Pct)}</td>
      <td class="${cls(t.ebitdaPct)}">${PC(t.ebitdaPct)}</td></tr>`;}});

  const lab=rows.map(r=>r.date.slice(5)), full=rows.map(r=>r.date+' ('+r.day+')');
  const ma=(arr,w=7)=>arr.map((_,i)=>{const sl=arr.slice(Math.max(0,i-w+1),i+1).filter(v=>v!==null&&isFinite(v));
    return sl.length?sl.reduce((a,b)=>a+b,0)/sl.length:null;});
  const gr=grid(s,'g2');
  const mk2=(t,sub,fn)=>{const c=card(gr,t,sub);fn(c);};
  const V=f=>rows.map(f);
  mk2('Daily GMV','actual gross sales with 7-day moving average',c=>lineChart(c,{labels:lab,tipLabels:full,
    series:[{name:'GMV',values:V(r=>r.gmv),color:C.navy2,type:'bar'},
            {name:'7-day average',values:ma(V(r=>r.gmv)),color:C.navy,width:2}],h:250,yFmt:RL,dots:false}));
  mk2('Daily orders','blank where the source records no order count',c=>lineChart(c,{labels:lab,tipLabels:full,
    series:[{name:'Orders',values:V(r=>r.hasOrders?r.orders:null),color:C.teal},
            {name:'7-day average',values:ma(V(r=>r.hasOrders?r.orders:null)),color:C.navy,width:2,dash:'4 3'}],h:220,yFmt:N,dots:false}));
  mk2('Daily sessions','blank where the source records no traffic',c=>lineChart(c,{labels:lab,tipLabels:full,
    series:[{name:'Sessions',values:V(r=>r.hasTraffic?r.traffic:null),color:C.lav,fill:true}],h:220,yFmt:N,dots:false}));
  mk2('Daily conversion rate','orders ÷ sessions',c=>lineChart(c,{labels:lab,tipLabels:full,
    series:[{name:'CVR',values:V(r=>r.cvr),color:C.teal},
            {name:'7-day average',values:ma(V(r=>r.cvr)),color:C.navy,width:2,dash:'4 3'}],h:220,yFmt:v=>PC(v,2),dots:false}));
  mk2('Daily marketing spend','with 7-day moving average',c=>lineChart(c,{labels:lab,tipLabels:full,
    series:[{name:'Spend',values:V(r=>r.mkt),color:C.red,type:'bar'},
            {name:'7-day average',values:ma(V(r=>r.mkt)),color:C.navy,width:2}],h:220,yFmt:RL,dots:false}));
  mk2('Daily CM2 and EBITDA','modelled cost stack on actual revenue and spend',c=>lineChart(c,{labels:lab,tipLabels:full,
    series:[{name:'CM2',values:V(r=>r.cm2),color:C.navy2},{name:'EBITDA',values:V(r=>r.ebitda),color:C.red}],
    h:250,yFmt:RL,dots:false,zero:true}));
  mk2('Daily new-customer CAC','marketing ÷ new-buyer orders',c=>lineChart(c,{labels:lab,tipLabels:full,
    series:[{name:'CAC',values:V(r=>r.hasOrders?r.cac:null),color:C.amber},
            {name:'7-day average',values:ma(V(r=>r.hasOrders?r.cac:null)),color:C.navy,width:2,dash:'4 3'}],h:220,yFmt:R,dots:false}));
  mk2('Marketing intensity','spend as % of that day\'s net revenue — above 100% means media outspent revenue',
    c=>lineChart(c,{labels:lab,tipLabels:full,series:[{name:'Marketing % of net revenue',values:V(r=>div(r.mkt,r.netRev)),color:C.amber,fill:true}],
    h:220,yFmt:v=>PC(v,0),dots:false}));

  // best / worst days + outliers
  const sorted=rows.slice().sort((a,b)=>b.ebitda-a.ebitda);
  const best=sorted.slice(0,5), worst=sorted.slice(-5).reverse();
  const mu=rows.reduce((a,r)=>a+r.ebitda,0)/rows.length;
  const sd=Math.sqrt(rows.reduce((a,r)=>a+Math.pow(r.ebitda-mu,2),0)/rows.length);
  const outl=rows.filter(r=>Math.abs(r.ebitda-mu)>2*sd);
  const box=document.createElement('div');box.className='insights';box.style.marginTop='14px';s.appendChild(box);
  const dayCard=(title,list,c)=>{const d=document.createElement('div');d.className='ins '+c;
    d.innerHTML=`<h4>${title}</h4><p>`+list.map(r=>{
      const why=[];
      if(div(r.mkt,r.netRev)>0.9)why.push(`marketing ${PC(div(r.mkt,r.netRev),0)} of revenue`);
      else if(div(r.mkt,r.netRev)<0.4)why.push(`marketing only ${PC(div(r.mkt,r.netRev),0)} of revenue`);
      if(r.hasTraffic&&r.cvr!==null)why.push(`CVR ${PC(r.cvr,2)}`);
      if(r.hasOrders)why.push(`AOV ${R(r.aov)}`);
      return `<b>${r.date} (${r.day})</b> — EBITDA ${RL(r.ebitda)} on ${RL(r.netRev)} net revenue; ${why.join(', ')||'no funnel data recorded'}.`;
    }).join('<br>')+'</p>';box.appendChild(d);};
  dayCard('Best P&amp;L days',best,'g');
  dayCard('Worst P&amp;L days',worst,'r');
  const od=document.createElement('div');od.className='ins a';
  od.innerHTML=`<h4>Outlier detection</h4><p>Mean daily EBITDA ${RL(mu)}, standard deviation ${RL(sd)}.
    <b>${outl.length}</b> day${outl.length===1?'':'s'} fall beyond ±2σ: ${outl.length?outl.map(r=>`${r.date} (${RL(r.ebitda)})`).join(', '):'none'}.
    ${MONTH_AGG.jun.trafficDays<25?'June traffic gaps mean conversion-driven outliers cannot be detected after 6 June.':''}</p>`;
  box.appendChild(od);
}

   12. RENDER — FUNNEL (overall + product)
   ========================================================================== */
function renderFunnel(){
  const s=$('#s-funnel');s.querySelectorAll('.chartgrid,.note,.tbar,.tblwrap,.insights').forEach(e=>e.remove());
  const L=fp(), a=aggProducts(L);
  const sessions=a.sess||0, views=a.views||0, atc=a.atc||0, purch=a.purch||0;
  const orders=purch/UNITS_PER_ORDER;
  const gr=grid(s,'g2');
  const c1=card(gr,'Funnel volume and step conversion',
    (L.length===PROD.length?'All products':N(L.length)+' filtered products')+' · Shopify item analytics, Apr–Jun');
  funnelChart(c1,[
    {name:'Sessions',v:sessions,note:'website sessions attributed to product pages'},
    {name:'Product page views',v:views},
    {name:'Add to cart',v:atc},
    {name:'Checkout initiated',v:null,na:true},
    {name:'Orders (derived)',v:orders,note:`units ÷ ${N1(UNITS_PER_ORDER)} units per order`},
    {name:'Units purchased',v:purch},
  ],700);
  note(c1,`Product page views exceed sessions (${PC(div(views,sessions))}) because a single session can view several product pages —
    the item-analytics sheet counts views per item, not per visit. That first step is therefore a browsing-depth ratio, not a leak.
    Checkout-initiated events are not present in the source file, so the ATC→checkout and checkout→purchase steps
    cannot be split; the dashboard reports add-to-cart → purchase as a single step. Order counts exist only at daily level,
    so product-level orders are derived from units at the portfolio units-per-order ratio.`);

  const c2=card(gr,'Where the funnel leaks','absolute visitors lost at each step');
  const steps=[
    {n:'Sessions → product view',lost:sessions-views,rate:div(views,sessions)},
    {n:'Product view → add to cart',lost:views-atc,rate:div(atc,views)},
    {n:'Add to cart → purchase',lost:atc-purch,rate:div(purch,atc)}];
  const biggest=steps.filter(x=>x.lost>0).sort((x,y)=>y.lost-x.lost)[0]||steps[0];
  hbarChart(c2,{rows:steps.map(x=>({l:x.n,v:x.lost,c:x===biggest?C.red:(x.lost<0?C.teal:C.slate),
    tip:`Step ratio ${PC(x.rate)}${x.lost<0?' — expansion, not a leak':''}`})),fmt:N,rh:30,padL:170,w:640});
  const kg=kpiGrid(c2);
  kpi(kg,'Session → purchase',PC(div(purch,sessions),2),'<span class="flat">unit basis</span>');
  kpi(kg,'Revenue / session',R(div(a.netRev,sessions)));
  kpi(kg,'Revenue / product view',R(div(a.netRev,views)));
  kpi(kg,'Largest leak',biggest.n,`<span class="down">${N(biggest.lost)} lost</span>`);
  note(c2,`The binding constraint is <b>${biggest.n.toLowerCase()}</b>, losing ${N(biggest.lost)} visits.
    Lifting only that step to the portfolio's best-quartile rate would add roughly
    ${N((()=>{const q=L.filter(p=>p.hasFunnel).map(p=>biggest.n.startsWith('Sessions')?p.viewRate:biggest.n.startsWith('Product')?p.atcRate:p.atcPurch)
      .filter(v=>v!==null).sort((x,y)=>y-x); const top=q[Math.floor(q.length*0.25)]||0;
      return Math.max(0,(top-biggest.rate))* (biggest.n.startsWith('Sessions')?sessions:biggest.n.startsWith('Product')?views:atc);})())} incremental events at that stage.`);

  // unmapped traffic
  const U=DATA.unmapped;
  if(L.length===PROD.length&&U.sessions>0){
    const c3=card(s,'Traffic that no product P&L row explains',
      `${N(U.rows)} item-analytics rows carry ${N(U.sessions)} sessions and ${RL(U.spend)} of attributed media spend but do not map to any SKU in the Website P&L sheet`);
    table(c3,[{h:'Item name',k:'name',l:true,f:v=>esc(v)},{h:'Sessions',k:'sessions',f:F.n},
      {h:'Item revenue',k:'rev',f:F.r},{h:'Media spend',k:'spend',f:F.r}],
      U.items,{search:false,name:'unmapped_traffic',sort:1,maxH:'260px'});
    note(c3,`These are duplicate name variants, HTML-escaped titles, out-of-catalogue items and a Gift Card / Iron-On Patch.
      They are excluded from all product economics but included in the item-analytics funnel totals — this is the main reason
      item-analytics sessions (${N(DATA.adsTotals.sessions)}) exceed matched product sessions (${N(sum(PROD,p=>p.sessions))}).`);
  }
}

    qx:MED_SESS,qy:MED_CVR,xLabel:'Sessions (Apr–Jun)',yLabel:'Session → unit conversion rate',

      {t:'REVIEW / DEPRIORITISE',ax:'l',ay:'b'},{t:'FIX CONVERSION',ax:'r',ay:'b'}]});
  const q=['Scale','Increase traffic','Fix conversion','Review / deprioritise'];
  const c2=card(gr,'Quadrant economics','net revenue and CM2 by conversion quadrant');
  const qa=q.map(k=>({k,list:L.filter(p=>p.quad===k)}));
  table(c2,[{h:'Quadrant',k:'k',l:true,f:F.pill(PILL_QUAD)},{h:'SKUs',v:r=>r.list.length,f:F.n},

    {h:'Net revenue',v:r=>sum(r.list,p=>p.netRev),f:F.rl},

    {h:'CM2',v:r=>sum(r.list,p=>p.cm2Tot),f:F.rl,neg:1},

    {h:'EBITDA',v:r=>sum(r.list,p=>p.ebitdaTot),f:F.rl,neg:1}],qa,{search:false,sort:null,name:'quadrants',maxH:'none'});
  note(s,`Ranks are computed on the filtered set. "Checkout" is unavailable in the source file.

      <td class="${cls(t.ebitda)}">${R(t.ebitda)}</td><td class="${cls(t.ebitdaPct)}">${PC(t.ebitdaPct)}</td></tr>`;}});

  hbarChart(card(gr,'Category CM2 ranking','contribution after marketing'),
    {rows:cats.slice().sort((a,b)=>b.cm2-a.cm2).map(c=>({l:c.k,v:c.cm2})),w:560,padL:120});
  hbarChart(card(gr,'Category EBITDA ranking','after ₹229.33/unit overhead'),

/* ============================================================================
   16. RENDER — EBITDA ANALYSIS + PARETO
   ========================================================================== */
function renderEbitda(){
  const s=$('#s-ebitda');s.querySelectorAll('.chartgrid,.note,.tbar,.tblwrap').forEach(e=>e.remove());
  const L=fp();
  const pos=L.filter(p=>p.ebitdaTot>0).sort((a,b)=>b.ebitdaTot-a.ebitdaTot);
  const neg=L.filter(p=>p.ebitdaTot<0).sort((a,b)=>a.ebitdaTot-b.ebitdaTot);
  const totPos=sum(pos,p=>p.ebitdaTot), totNeg=sum(neg,p=>p.ebitdaTot);
  const gr=grid(s,'g2');
  const c1=card(gr,'Top EBITDA contributors',`${pos.length} SKUs generate ${RL(totPos)} of positive EBITDA`);
  table(c1,[{h:'Product',k:'code',l:true,f:v=>esc(v)},{h:'Net revenue',k:'netRev',f:F.r},
    {h:'EBITDA',k:'ebitdaTot',f:F.r},{h:'EBITDA %',k:'ebitdaPct',f:F.p},
    {h:'Share of positive EBITDA',v:r=>div(r.ebitdaTot,totPos),f:F.p}],pos,{search:false,sort:2,name:'ebitda_top',maxH:'320px'});
  const c2=card(gr,'EBITDA loss makers',`${neg.length} SKUs destroy ${RL(totNeg)} of EBITDA`);
  table(c2,[{h:'Product',k:'code',l:true,f:v=>esc(v)},{h:'Net revenue',k:'netRev',f:F.r},
    {h:'EBITDA loss',k:'ebitdaTot',f:F.r,neg:1},{h:'EBITDA %',k:'ebitdaPct',f:F.p},
    {h:'Share of loss',v:r=>div(r.ebitdaTot,totNeg),f:F.p},
    {h:'Main reason',v:r=>r.issue.k,l:true,f:v=>esc(v)}],neg,{search:false,sort:2,desc:false,name:'ebitda_loss',maxH:'320px'});

  // Pareto of positive EBITDA
  const cp=card(s,'Pareto — cumulative share of positive EBITDA','which products actually pay the bills');
  if(pos.length){
    let run=0;const cum=pos.map(p=>{run+=p.ebitdaTot;return run/totPos;});
    const mark=cum.findIndex(v=>v>=0.8);
    pareto(cp,{bars:pos.map(p=>p.ebitdaTot),cum,labels:pos.map(p=>p.code),mark:mark<0?undefined:mark,h:320});
    note(cp,`<b>${mark+1}</b> of ${L.length} products (${PC(div(mark+1,L.length))} of the catalogue) deliver 80% of all positive EBITDA:
      ${pos.slice(0,mark+1).map(p=>esc(p.code)).join(', ')}. Net portfolio EBITDA remains
      <b class="down">${RL(totPos+totNeg)}</b> because losses of ${RL(totNeg)} swamp them.`);
  }
  // Pareto of losses
  const cl=card(s,'Pareto — cumulative share of EBITDA losses','where the money is actually going');
  if(neg.length){
    let run=0;const cum=neg.map(p=>{run+=p.ebitdaTot;return run/totNeg;});
    const mark=cum.findIndex(v=>v>=0.8);
    pareto(cl,{bars:neg.map(p=>p.ebitdaTot),cum,labels:neg.map(p=>p.code),mark:mark<0?undefined:mark,h:320});
    note(cl,`<b>${mark+1}</b> loss-making SKUs account for 80% of the EBITDA loss (${RL(sum(neg.slice(0,mark+1),p=>p.ebitdaTot))}).
      Fixing the CAC and shipping economics on this short list is worth more than any action on the remaining ${neg.length-mark-1}.`);
  }
}

function renderBreakeven(){
  const s=$('#s-be');s.querySelectorAll('.chartgrid,.note,.tbar,.tblwrap,.kpigrid').forEach(e=>e.remove());
  const L=fp();
  const G=kpiGrid(s);
  const cats=['Already profitable','Requires volume','Marketing above break-even','Structurally unprofitable'];
  cats.forEach(k=>{const list=L.filter(p=>p.beClass===k);
    kpi(G,k,N(list.length)+' SKUs',`<span class="flat">${RL(sum(list,p=>p.netRev))} revenue · ${RL(sum(list,p=>p.ebitdaTot))} EBITDA</span>`,
      k==='Already profitable'?'d-g':(k==='Requires volume'?'d-a':'d-r'));});
  const cols=[{h:'Product',k:'code',l:true,f:v=>esc(v)},{h:'Category',k:'cat',l:true,f:v=>esc(v)},
    {h:'Selling price',k:'sp',f:F.r},{h:'Revenue / unit',k:'nru',f:F.r1},
    {h:'Variable cost / unit',v:r=>r.varCost+r.mkt+r.ret,f:F.r1},
    {h:'Contribution / unit (CM2)',k:'cm2',f:F.r1,neg:1},
    {h:'Fixed cost allocation',k:'ohTot',f:F.r},
    {h:'Break-even qty',k:'beQty',f:v=>v===null?'<span class="pill p-r">Never</span>':N(v)},
    {h:'Actual qty',k:'units',f:F.n},
    {h:'Surplus / gap (units)',k:'beGap',f:(v)=>v===null?'—':`<span class="${v<0?'neg':''}">${N(v)}</span>`},
    {h:'Break-even revenue',k:'beRev',f:v=>v===null?'—':R(v)},
    {h:'Break-even orders',k:'beOrders',f:v=>v===null?'—':N(v)},
    {h:'EBITDA total',k:'ebitdaTot',f:F.r,neg:1},
    {h:'Classification',k:'beClass',l:true,f:F.pill({'Already profitable':'p-g','Requires volume':'p-a',
      'Marketing above break-even':'p-r','Structurally unprofitable':'p-r'})}];
  table(s,cols,L,{name:'break_even',sort:9,maxH:'520px'});
  const c=card(s,'Distance to break-even','units required vs units actually sold · SKUs with positive contribution only');
  const be=L.filter(p=>p.beQty!==null).sort((a,b)=>(a.beQty/a.units)-(b.beQty/b.units)).slice(0,20);
  if(be.length)gbarChart(c,{labels:be.map(p=>p.code),
    series:[{name:'Actual units',values:be.map(p=>p.units),color:C.navy2},
            {name:'Break-even units',values:be.map(p=>p.beQty),color:C.amber}],h:280,yFmt:N,padL:56});
  else note(c,'No product in the current filter has positive contribution per unit.');
  note(s,`<b>Method.</b> Fixed cost allocation is the source file's flat overhead of ₹${OH_PU}/unit multiplied by units sold, i.e. the
   product's share of overhead for the quarter. Break-even quantity = that allocation ÷ CM2 per unit, so a product breaks even
   exactly when its CM2 per unit reaches ₹${OH_PU}. Where CM2 per unit is zero or negative no volume can recover the overhead and the
   product is flagged <em>Never</em>. Break-even orders convert units at the portfolio ratio of ${N1(UNITS_PER_ORDER)} units per order.`);
}

/* ============================================================================
   20. RENDER — MAXIMUM PROFITABLE DISCOUNT + SIMULATOR
   ========================================================================== */
function renderDiscount(){
  const s=$('#s-disc');s.querySelectorAll('.chartgrid,.note,.tbar,.tblwrap,.kpigrid,.flex').forEach(e=>e.remove());
  const L=fp();
  const cols=[{h:'Product',k:'code',l:true,f:v=>esc(v)},{h:'MRP',k:'mrp',f:F.r},
    {h:'Current selling price',k:'sp',f:F.r},{h:'Current discount',k:'discPct',f:F.p},
    {h:'Min price for CM1≥0',k:'spMinCM1',f:F.r},
    {h:'Min price for CM2≥0',k:'spMinCM2',f:F.r},
    {h:'Min price for EBITDA≥0',k:'spMinEbitda',f:F.r},
    {h:'Max discount (CM2≥0)',k:'maxDiscCM2',f:v=>v===null?'—':(v<0?'<span class="pill p-r">None possible</span>':PC(v))},
    {h:'Max discount (EBITDA≥0)',k:'maxDiscEb',f:v=>v===null?'—':(v<0?'<span class="pill p-r">None possible</span>':PC(v))},
    {h:'Discount headroom',k:'discHeadroom',f:F.p,neg:1},
    {h:'CM2 at current discount',k:'cm2',f:F.r1,neg:1},
    {h:'CM2 at max discount',v:r=>0,f:()=>'₹0'},
    {h:'Total discount given',k:'totDisc',f:F.r}];
  table(s,cols,L,{name:'max_discount',sort:9,desc:false,maxH:'480px'});
  const none=L.filter(p=>(p.maxDiscCM2??0)<0);
  note(s,`<b>${none.length}</b> of ${L.length} SKUs cannot sustain <em>any</em> discount at their current cost and CAC —
   selling at full MRP would still leave CM2 negative. For these the lever is CAC or cost, not price.
   Max discount solves for the selling price where the stated profit floor is exactly zero, holding COGS, shipping, fees and
   marketing per unit constant, and grossing up by 18% GST.`);

  // simulator
  const bar=document.createElement('div');bar.className='flex';bar.style.margin='14px 0 10px';
  bar.innerHTML=`<div class="fg"><label>Product</label><select id="simSku"></select></div>
    <div class="fg" style="flex:1;min-width:280px"><label>Discount off MRP: <b id="simVal">0%</b></label>
      <input type="range" id="simRange" min="0" max="45" step="1" value="0"></div>
    <div class="fg"><label>Presets</label><div class="seg" id="simPresets">
      ${[0,5,10,15,20,25,30].map(v=>`<button data-v="${v}">${v}%</button>`).join('')}</div></div>`;
  s.appendChild(bar);
  const out=document.createElement('div');s.appendChild(out);
  const sel=$('#simSku',bar);
  sel.innerHTML=L.slice().sort((a,b)=>b.netRev-a.netRev).map(p=>`<option value="${esc(p.code)}">${esc(p.code)} — ${esc(p.name.slice(0,52))}</option>`).join('');
  function sim(){
    const p=L.find(x=>x.code===sel.value)||L[0];if(!p)return;
    const d=+$('#simRange',bar).value/100;$('#simVal',bar).textContent=(d*100).toFixed(0)+'%';
    out.innerHTML='';
    const spN=p.mrp*(1-d), nru=spN/GST-(p.ret||RET_PU_DEFAULT);
    const cm1=nru-p.varCost, cm2=cm1-p.mkt, eb=cm2-OH_PU;
    const beq=cm2>0?(OH_PU*p.units)/cm2:null;
    const g=kpiGrid(out);g.className='simgrid';
    kpi(g,'Selling price',R(spN),`<span class="flat">was ${R(p.sp)}</span>`);
    kpi(g,'Net revenue / unit',R1(nru),'<span class="flat">ex GST, after returns</span>');
    kpi(g,'Revenue at current volume',RL(nru*p.units),`<span class="flat">${N(p.units)} units held constant</span>`);
    kpi(g,'CM1 / unit',R1(cm1),`<span class="flat">${PC(div(cm1,nru))}</span>`,cm1>0?'d-g':'d-r');
    kpi(g,'CM2 / unit',R1(cm2),`<span class="flat">${PC(div(cm2,nru))}</span>`,cm2>0?'d-g':'d-r');
    kpi(g,'EBITDA / unit',R1(eb),`<span class="flat">${PC(div(eb,nru))}</span>`,eb>0?'d-g':'d-r');
    kpi(g,'CM2 total',RL(cm2*p.units),'',cm2>0?'d-g':'d-r');
    kpi(g,'Break-even qty',beq===null?'Never':N(beq),`<span class="flat">actual ${N(p.units)}</span>`,beq===null?'d-r':(beq<=p.units?'d-g':'d-a'));
    const c=card(out,'Profit floor across the discount ladder','CM2 and EBITDA per unit at each discount level — the crossing point is the maximum sustainable discount');
    const steps=[];for(let i=0;i<=45;i+=1)steps.push(i/100);
    const val=f=>steps.map(dd=>{const sp2=p.mrp*(1-dd),nr2=sp2/GST-(p.ret||RET_PU_DEFAULT);return f(nr2);});
    lineChart(c,{labels:steps.map(v=>(v*100).toFixed(0)+'%'),maxLabels:10,dots:false,
      series:[{name:'CM2 / unit',values:val(nr=>nr-p.varCost-p.mkt),color:C.navy2,fill:true},
              {name:'EBITDA / unit',values:val(nr=>nr-p.varCost-p.mkt-OH_PU),color:C.red}],h:250,yFmt:R});
    note(c,`Maximum discount keeping CM2 ≥ 0: <b>${(p.maxDiscCM2??-1)<0?'none possible':PC(p.maxDiscCM2)}</b>.
      Keeping EBITDA ≥ 0: <b>${(p.maxDiscEb??-1)<0?'none possible':PC(p.maxDiscEb)}</b>.
      Current discount is <b>${PC(p.discPct)}</b>. Volume is held constant — a real discount change would move units,
      which the source data cannot estimate.`);
  }
  sel.addEventListener('change',sim);
  $('#simRange',bar).addEventListener('input',sim);
  $$('#simPresets button',bar).forEach(b=>b.addEventListener('click',()=>{
    $$('#simPresets button',bar).forEach(x=>x.classList.remove('on'));b.classList.add('on');
    $('#simRange',bar).value=b.dataset.v;sim();}));
  const cur=L.find(x=>x.code===sel.value);
  if(cur){$('#simRange',bar).value=Math.round(cur.discPct*100);}
  sim();
}

function renderWaterfall(){
  const s=$('#s-wf');s.querySelectorAll('.chartgrid,.note,.flex,div.card').forEach(e=>e.remove());
  const L=fp();
  const bar=document.createElement('div');bar.className='flex';bar.style.margin='0 0 12px';
  bar.innerHTML=`<div class="fg"><label>Product</label><select id="wfSku"></select></div>
    <div class="fg"><label>Basis</label><div class="seg" id="wfBasis">
      <button data-b="unit" class="on">Per unit</button><button data-b="100">Per ₹100 of MRP</button>
      <button data-b="tot">Total for the quarter</button></div></div>`;
  s.appendChild(bar);
  const host=document.createElement('div');s.appendChild(host);
  const sel=$('#wfSku',bar);
  sel.innerHTML=L.slice().sort((a,b)=>b.netRev-a.netRev).map(p=>`<option value="${esc(p.code)}">${esc(p.code)} — ${esc(p.name.slice(0,52))}</option>`).join('');
  let basis='unit';
  function draw(){
    const p=L.find(x=>x.code===sel.value)||L[0];if(!p)return;
    host.innerHTML='';
    const k=basis==='tot'?p.units:(basis==='100'?100/p.mrp:1);
    const fmt=basis==='tot'?RL:R1;
    const items=[
      {label:'MRP',value:p.mrp*k,type:'total'},
      {label:'Discount',value:-p.disc*k},
      {label:'GST 18%',value:-(p.sp-p.spEx)*k},
      {label:'Returns provision',value:-(p.ret||RET_PU_DEFAULT)*k},
      {label:'Net revenue',value:p.nru*k,type:'total'},
      {label:'Cost of material',value:-p.cogs*k},
      {label:'Packaging',value:-p.pack*k},
      {label:'Payment gateway',value:-p.razor*k},
      {label:'Shipping to customer',value:-p.ship*k},
      {label:'COD cost',value:-p.cod*k},
      {label:'Platform fees',value:-(p.shopify+p.shopflo)*k},
      {label:'CM1',value:p.cm1*k,type:'total'},
      {label:'Marketing / CAC',value:-p.mkt*k},
      {label:'CM2',value:p.cm2*k,type:'total'},
      {label:'Overhead',value:-OH_PU*k},
      {label:'EBITDA',value:p.ebitda*k,type:'total'}];
    const c=card(host,`${p.code} — ${p.name}`,
      `${esc(p.cat)} · ${esc(p.sub)} · ${N(p.units)} units · ${RL(p.netRev)} net revenue · CM2 ${PC(p.cm2Pct)} · EBITDA ${PC(p.ebitdaPct)}`);
    waterfall(c,{items,yFmt:fmt,h:360,w:900,padB:78});
    const worst=[['Marketing / CAC',p.mkt],['Cost of material',p.cogs],['Shipping',p.ship],['Overhead',OH_PU],['Discount',p.disc]]
      .sort((a,b)=>b[1]-a[1])[0];
    note(c,`Largest single deduction: <b>${worst[0]}</b> at ${R1(worst[1])} per unit, ${PC(div(worst[1],p.nru))} of net revenue.
      ${p.cm2<0?`This SKU needs CAC below <b>${R1(p.maxCacCM2)}</b> to reach CM2 break-even and below <b>${R1(p.maxCacEbitda)}</b> for EBITDA break-even — it currently spends ${R1(p.mkt)}.`
        :`CM2 is positive at ${R1(p.cm2)} per unit; it has ${R1(p.cacHeadroom)} of CAC headroom before EBITDA break-even.`}`);
  }
  sel.addEventListener('change',draw);
  $$('#wfBasis button',bar).forEach(b=>b.addEventListener('click',()=>{
    $$('#wfBasis button',bar).forEach(x=>x.classList.remove('on'));b.classList.add('on');basis=b.dataset.b;draw();}));
  draw();
}

  hbarChart(c,{rows:rows.map(r=>({l:r.k+' ('+r.n+')',v:r.imp,

  note(c,`Impact is the modelled rupee value of closing the gap: for CAC it is spend above the EBITDA-break-even ceiling;
   for shipping, cost above the portfolio average; for conversion, revenue foregone against the median CVR; for discount, the
   value given away above a 15% guardrail. Products can carry several issues — only the largest by impact is shown as primary.`);
}

   ========================================================================== */
function renderBridge(){
  const s=$('#s-bridge');s.querySelectorAll('.chartgrid,.note').forEach(e=>e.remove());
  const gr=grid(s,'g2');
  function bridge(from,to,fl,tl){
    const c=card(gr,`${fl} → ${tl} CM2 bridge`,'modelled — blended per-unit cost rates applied to actual daily revenue and spend');
    const cm1Rate=div(BL.netRevPU-BL.cogsPU-BL.shipPU-BL.packPU-BL.razorPU-BL.codPU-BL.shopifyPU-BL.shopfloPU,BL.netRevPU);
    const dRev=to.netRev-from.netRev;
    const items=[
      {label:fl+' CM2',value:from.cm2,type:'total'},
      {label:'Revenue / volume',value:dRev*cm1Rate},
      {label:'Marketing spend',value:-(to.mkt-from.mkt)},
      {label:tl+' CM2',value:to.cm2,type:'total'}];
    waterfall(c,{items,yFmt:RL,h:290,w:640,padB:60});
    const resid=to.cm2-(from.cm2+dRev*cm1Rate-(to.mkt-from.mkt));
    note(c,`Net revenue moved ${PCS(div(to.netRev,from.netRev)-1)} (${RL(dRev)}), contributing ${RL(dRev*cm1Rate)} at the blended
      ${PC(cm1Rate)} CM1 rate. Marketing spend moved ${PCS(div(to.mkt,from.mkt)-1)} (${RL(to.mkt-from.mkt)}), a
      ${to.mkt>from.mkt?'drag':'benefit'} of ${RL(Math.abs(to.mkt-from.mkt))}. Residual ${RL(resid)}.
      ${to.mkt-from.mkt>Math.abs(dRev*cm1Rate)?`<b>Spend grew faster than the contribution it bought.</b>`:''}`);
  }
  bridge(MONTH_AGG.apr,MONTH_AGG.may,'April','May');
  bridge(MONTH_AGG.may,MONTH_AGG.jun,'May','June');
  naBox(s,'Price, discount, COGS and shipping cannot be isolated as separate bridge drivers.',
    'The Website P&L sheet holds a single Apr–Jun cost stack per SKU with no monthly split, so per-unit COGS, shipping and fee rates are constant by construction across the three months. Only revenue/volume and marketing spend vary with actual monthly data. Daily promo % is embedded inside actual net revenue and therefore inside the revenue effect.');
  const gr2=grid(s,'g2');
  const c=card(gr2,'Monthly P&L stack','net revenue against the modelled cost stack');
  const M=[MONTH_AGG.apr,MONTH_AGG.may,MONTH_AGG.jun];
  gbarChart(c,{labels:['April','May','June'],series:[
    {name:'Net revenue',values:M.map(m=>m.netRev),color:C.navy},
    {name:'COGS + shipping + fees',values:M.map(m=>m.cogs+m.ship+m.other),color:C.slate},
    {name:'Marketing',values:M.map(m=>m.mkt),color:C.red},
    {name:'Overhead',values:M.map(m=>m.oh),color:C.amber}],h:280});
  const c2=card(gr2,'Margin waterfall by month','CM1, CM2 and EBITDA as % of net revenue');
  lineChart(c2,{labels:['April','May','June'],series:[
    {name:'CM1 %',values:M.map(m=>m.cm1Pct),color:C.green},
    {name:'CM2 %',values:M.map(m=>m.cm2Pct),color:C.navy2},
    {name:'EBITDA %',values:M.map(m=>m.ebitdaPct),color:C.red}],h:280,yFmt:v=>PC(v,0)});
}

function renderAlerts(){
  const s=$('#s-alerts');s.querySelectorAll('.alerts,.note').forEach(e=>e.remove());
  const box=document.createElement('div');box.className='alerts';s.appendChild(box);
  const L=fp(), a=aggProducts(L), A=MONTH_AGG.apr,M=MONTH_AGG.may,J=MONTH_AGG.jun;
  const push=(lvl,t)=>{const d=document.createElement('div');d.className='alert '+lvl;
    d.innerHTML=`<span class="ic">${lvl==='r'?'🔴':lvl==='a'?'🟠':'🟢'}</span><span>${t}</span>`;box.appendChild(d);};
  if(a.cm2<0)push('r',`<b>Portfolio CM2 is negative</b> at ${RL(a.cm2)} (${PC(a.cm2Pct)} of net revenue). Contribution does not cover marketing, let alone overhead.`);
  if(a.ebitda<0)push('r',`<b>Portfolio EBITDA is negative</b> at ${RL(a.ebitda)} (${PC(a.ebitdaPct)}). Overhead of ${RL(a.oh)} sits on top of an already negative CM2.`);
  const revUp=J.netRev>A.netRev, cm2Dn=J.cm2<A.cm2;
  if(cm2Dn)push('r',`<b>CM2 declining ${revUp?'while revenue grows':'alongside revenue'}</b>: net revenue ${PCS(div(J.netRev,A.netRev)-1)} April→June while modelled CM2 moved ${RL(J.cm2-A.cm2)}.`);
  const mktUp=div(J.mkt,A.mkt)-1;
  if(mktUp>0.15)push('r',`<b>Marketing spend up ${PCS(mktUp)}</b> April→June (${RL(A.mkt)} → ${RL(J.mkt)}) against ${PCS(div(J.netRev,A.netRev)-1)} net revenue growth. Marketing intensity rose from ${PC(A.mktPct)} to ${PC(J.mktPct)}.`);
  if(A.cvr&&M.cvr){const cd=div(M.cvr,A.cvr)-1;
    if(cd<-0.05)push('r',`<b>Conversion rate down ${PCS(cd)}</b> April→May (${PC(A.cvr,2)} → ${PC(M.cvr,2)}) on ${PCS(div(M.traffic,A.traffic)-1)} traffic — roughly ${N(Math.abs((A.cvr-M.cvr)*M.traffic))} orders lost to conversion.`);}
  if(a.shipPct>0.15)push('r',`<b>Shipping is ${PC(a.shipPct)} of net revenue</b> (${RL(a.ship)}, ${R(a.shipPU)}/unit) — above the 15% risk threshold and ${PC(div(a.ship,a.netRev-a.cogs))} of gross margin.`);
  const negCm2=L.filter(p=>p.cm2<0);
  if(negCm2.length)push('r',`<b>${negCm2.length} of ${L.length} SKUs have negative CM2</b>, carrying ${RL(sum(negCm2,p=>p.netRev))} of revenue and ${RL(sum(negCm2,p=>p.cm2Tot))} of contribution loss.`);
  const negEb=L.filter(p=>p.ebitdaTot<0);
  if(negEb.length)push('r',`<b>${negEb.length} SKUs have negative EBITDA</b> totalling ${RL(sum(negEb,p=>p.ebitdaTot))}. Only ${L.length-negEb.length} products clear the ₹${OH_PU}/unit overhead.`);
  const overDisc=L.filter(p=>p.discPct>0.15);
  if(overDisc.length)push('a',`<b>${overDisc.length} SKUs discount above 15% of MRP</b> (${RL(sum(overDisc,p=>p.totDisc))} given away): ${overDisc.slice(0,5).map(p=>esc(p.code)).join(', ')}${overDisc.length>5?'…':''}.`);
  const hiTlowC=L.filter(p=>p.hasFunnel&&p.sessions>MED_SESS&&p.cvr<MED_CVR*0.7);
  if(hiTlowC.length)push('a',`<b>High traffic, low conversion on ${hiTlowC.length} SKUs</b> — ${N(sum(hiTlowC,p=>p.sessions))} sessions converting at ${PC(div(sum(hiTlowC,p=>p.purch),sum(hiTlowC,p=>p.sessions)),2)} against a ${PC(MED_CVR,2)} median.`);
  const opp=L.filter(p=>p.cm2>0&&p.hasFunnel&&p.cvr>=MED_CVR);
  if(opp.length)push('g',`<b>${opp.length} SKUs combine positive CM2 with above-median conversion</b> (${RL(sum(opp,p=>p.cm2Tot))} of CM2 today). These are the safe destination for incremental media.`);
  const starved=L.filter(p=>p.cm2>0&&p.hasFunnel&&p.cvr>=MED_CVR&&p.sessions<MED_SESS);
  if(starved.length)push('g',`<b>${starved.length} profitable SKUs are traffic-starved</b> — above-median CVR on below-median sessions: ${starved.slice(0,6).map(p=>esc(p.code)).join(', ')}${starved.length>6?'…':''}.`);
  const dataAlert=MONTH_AGG.jun.trafficDays<25;
  if(dataAlert)push('a',`<b>Data integrity:</b> June records traffic on only ${MONTH_AGG.jun.trafficDays} of 30 days and orders on ${MONTH_AGG.jun.orderDays} of 30. June conversion, AOV and CAC are not comparable to April and May.`);
  note(s,'Alerts recompute against the active filter set. Thresholds: shipping 15% of net revenue, discount 15% of MRP, conversion 70% of the portfolio median, marketing growth 15%.');
}

function renderScorecard(){
  const s=$('#s-score');s.querySelectorAll('.tbar,.tblwrap,.note,details').forEach(e=>e.remove());
  const L=fp();
  table(s,[{h:'Product',k:'code',l:true,f:v=>esc(v)},{h:'Full name',k:'name',l:true,f:v=>esc(v)},
    {h:'Revenue rank',k:'rankRev',f:F.n},
    {h:'Growth rank',v:()=>null,f:()=>'<span class="pill p-n">N/A</span>',raw:()=>'N/A'},
    {h:'CVR rank',k:'rankCvr',f:F.n},{h:'CM2 rank',k:'rankCm2',f:F.n},{h:'EBITDA rank',k:'rankEb',f:F.n},
    {h:'CAC status',k:'cacStatus',l:true,f:F.pill(PILL_CAC)},
    {h:'Shipping status',v:r=>r.shipKills?'Destroys CM2':(r.shipPctRev>0.15?'High':(r.shipPctRev>0.10?'Watch':'OK')),
      l:true,f:F.pill({'Destroys CM2':'p-r','High':'p-a','Watch':'p-a','OK':'p-g'})},
    {h:'Discount status',v:r=>r.discPct>0.15?'Above guardrail':((r.maxDiscCM2??-1)<0?'No headroom':'Within headroom'),
      l:true,f:F.pill({'Above guardrail':'p-r','No headroom':'p-a','Within headroom':'p-g'})},
    {h:'Overall score',k:'score',f:v=>`<b>${N1(v)}</b>`},
    {h:'Recommended action',k:'action',l:true,f:F.pill(PILL_ACT)}],
    L,{name:'scorecard',sort:10,maxH:'620px'});
  const d=document.createElement('details');d.className='meth';
  d.innerHTML=`<summary>Scoring methodology</summary><div class="db" style="padding:12px 14px;font-size:12px;line-height:1.6">
    Each product is percentile-ranked within the filtered set on six components, then combined into a 0–100 score:
    <br>• <b>CM2 %</b> — weight 28% (contribution after marketing, the single best predictor of scalable profit)
    <br>• <b>EBITDA %</b> — weight 20% (contribution after the ₹${OH_PU}/unit overhead allocation)
    <br>• <b>Net revenue</b> — weight 18% (scale, so a profitable rounding error does not outrank a real business)
    <br>• <b>Session→unit conversion</b> — weight 18% (demand quality; products with no traffic data score at the floor)
    <br>• <b>CAC efficiency</b> — weight 10%, measured as CM1 per unit ÷ marketing per unit
    <br>• <b>Shipping efficiency</b> — weight 6%, measured as 1 − shipping ÷ net revenue per unit
    <br><br><b>Growth rank is N/A.</b> The source file provides one Apr–Jun aggregate per SKU with no monthly split,
    so product-level growth cannot be computed. Its intended weight has been redistributed proportionally across the six
    components above; if monthly SKU data becomes available the weights should be restated with growth at roughly 15%.</div>`;
  s.appendChild(d);
}

function renderRecs(){
  const s=$('#s-recs');s.querySelectorAll('.rec,.note').forEach(e=>e.remove());
  const A=aggProducts(PROD), apr=MONTH_AGG.apr, jun=MONTH_AGG.jun;
  const recs=[];
  const overspend=PROD.filter(p=>p.cm1>0&&p.mkt>p.maxCacEbitda).sort((a,b)=>(b.mkt-b.maxCacEbitda)*b.units-(a.mkt-a.maxCacEbitda)*a.units);
  const top5=overspend.slice(0,5), rec5=sum(top5,p=>(p.mkt-p.maxCacEbitda)*p.units);

  recs.push({t:'Cap CAC on the five largest overspenders before anything else',
    p:`Marketing consumed ${PC(A.mktPct)} of net revenue (${RL(A.mkt)} on ${RL(A.netRev)}), converting a healthy ${PC(A.cm1Pct)} CM1 into a ${PC(A.cm2Pct)} CM2.`,
    e:top5.map(p=>`${p.code}: CAC ${R(p.cac)}/unit against an EBITDA-break-even ceiling of ${R(p.maxCacEbitda)}${p.maxCacEbitda<0?' (CM1 is below the ₹229 overhead, so no CAC is affordable)':''} on ${N(p.units)} units`).join('; '),
    i:`${RL(rec5)} of EBITDA — ${PC(div(rec5,Math.abs(A.ebitda)))} of the quarter's total loss`,
    a:`Set hard per-SKU CAC caps at the EBITDA-break-even level and pause any ad set breaching it for two consecutive weeks.`,
    o:`Portfolio EBITDA improves from ${RL(A.ebitda)} to roughly ${RL(A.ebitda+rec5)} at unchanged volume; some volume will be lost, so treat this as the upper bound.`});

  const canvas=PROD.find(p=>p.code==='Canvas Kit')||overspend[0];
  if(canvas)recs.push({t:`Stop paid acquisition on ${canvas.code} until conversion is fixed`,
    p:`${canvas.name} attracted ${N(canvas.sessions)} sessions — ${PC(div(canvas.sessions,DATA.adsTotals.sessions))} of all traffic — but converted at only ${PC(canvas.cvr,2)}.`,
    e:`${RL(canvas.totMkt)} of media bought ${N(canvas.units)} units at ${R(canvas.cac)}/unit against a CM1 of ${R(canvas.cm1)}/unit; shipping is ${R(canvas.ship)}/unit (${PC(canvas.shipPctRev)} of revenue).`,
    i:`${RL(canvas.cm2Tot)} CM2 and ${RL(canvas.ebitdaTot)} EBITDA — the single largest destroyer in the portfolio`,
    a:`Pause the SKU's prospecting budget. Re-test only after PDP conversion clears ${PC(MED_CVR,2)} (the portfolio median) in organic and retargeting traffic.`,
    o:`Recovers ${RL(Math.abs(canvas.cm2Tot))} of contribution immediately; ${RL(canvas.netRev)} of revenue is at risk, which is ${PC(div(canvas.netRev,A.netRev))} of the portfolio.`});

  const shipKill=PROD.filter(p=>p.shipKills).sort((a,b)=>b.shipTot-a.shipTot);
  if(shipKill.length)recs.push({t:'Bundle or reprice the SKUs where shipping alone flips CM2 negative',
    p:`Shipping to customer costs ${R(A.shipPU)}/unit, ${PC(A.shipPct)} of net revenue and ${PC(div(A.ship,A.netRev-A.cogs))} of gross margin.`,
    e:`${shipKill.length} SKUs — ${shipKill.slice(0,6).map(p=>`${p.code} (${R(p.ship)}/unit on ${R(p.sp)} ASP)`).join(', ')}${shipKill.length>6?' and '+(shipKill.length-6)+' more':''} — post positive CM2 before shipping and negative after.`,
    i:`${RL(sum(shipKill,p=>p.cm2Tot))} of CM2 on ${RL(sum(shipKill,p=>p.netRev))} of revenue`,
    a:`Move sub-₹900 SKUs into multi-item kits, introduce a free-shipping threshold above ${R(Math.round((A.shipPU*UNITS_PER_ORDER)/0.12/50)*50)} order value, and reduce packaging dimensions on the worst offenders.`,
    o:`Every ${R(50)}/unit of shipping saved across these SKUs is worth ${RL(sum(shipKill,p=>p.units)*50)} of contribution per quarter.`});

  const leak=(()=>{const AD=DATA.adsTotals;
    return [{n:'session → product view',lost:AD.sessions-AD.views,rate:div(AD.views,AD.sessions)},
      {n:'product view → add to cart',lost:AD.views-AD.atc,rate:div(AD.atc,AD.views)},
      {n:'add to cart → purchase',lost:AD.atc-AD.purch,rate:div(AD.purch,AD.atc)}]
      .filter(x=>x.lost>0).sort((a,b)=>b.lost-a.lost)[0];})();
  recs.push({t:`Fix the ${leak.n} step — it is the largest funnel leak`,
    p:`${N(DATA.adsTotals.sessions)} sessions produced ${N(DATA.adsTotals.purch)} units, a ${PC(div(DATA.adsTotals.purch,DATA.adsTotals.sessions),2)} session-to-purchase rate.`,
    e:`${N(leak.lost)} visits are lost at ${leak.n}, a ${PC(leak.rate)} step conversion. ${PROD.filter(p=>p.hasFunnel&&p.sessions>MED_SESS&&p.cvr<MED_CVR*0.7).length} high-traffic SKUs convert below 70% of the ${PC(MED_CVR,2)} median.`,
    i:`A 1 percentage-point lift at this step is worth roughly ${RL(0.01*(leak.n.startsWith('Sessions')?DATA.adsTotals.sessions:leak.n.startsWith('Product')?DATA.adsTotals.views:DATA.adsTotals.atc)*div(A.netRev,A.units))} of net revenue per quarter`,
    a:`Run PDP experiments on the five highest-traffic low-CVR SKUs: delivery promise above the fold, price-per-use framing, review count, and a single primary add-to-cart action.`,
    o:`Lifting these SKUs to the median CVR adds ${N(sum(PROD.filter(p=>p.hasFunnel&&p.sessions>MED_SESS&&p.cvr<MED_CVR*0.7),p=>(MED_CVR-p.cvr)*p.sessions))} units at no extra media cost.`});

  const noHeadroom=PROD.filter(p=>(p.maxDiscCM2??-1)<0);
  recs.push({t:'Withdraw discounting from SKUs that have no discount headroom at all',
    p:`Blended discount is ${PC(div(A.disc,A.gmv+A.disc))} of MRP value (${RL(A.disc)}) — modest on average but badly targeted.`,
    e:`${noHeadroom.length} SKUs cannot support any discount at their current cost and CAC: even at full MRP their CM2 stays negative. Meanwhile ${PROD.filter(p=>p.discPct>0.15).length} SKUs discount above 15%, worth ${RL(sum(PROD.filter(p=>p.discPct>0.15),p=>p.totDisc))}.`,
    i:`${RL(sum(PROD.filter(p=>p.discPct>0.15&&(p.maxDiscCM2??-1)<0),p=>p.totDisc))} given away on SKUs with zero headroom`,
    a:`Replace blanket site-wide promotions with a per-SKU maximum-discount table (section 16) enforced in the promotion engine.`,
    o:`Discount spend is redirected to the ${PROD.filter(p=>(p.maxDiscCM2??0)>0.15).length} SKUs that can actually absorb it and still clear CM2.`});

  const starved=PROD.filter(p=>p.cm2>0&&p.hasFunnel&&p.cvr>=MED_CVR&&p.sessions<MED_SESS).sort((a,b)=>b.cm2-a.cm2);
  if(starved.length)recs.push({t:'Redirect the freed budget into the profitable, traffic-starved SKUs',
    p:`${starved.length} products already clear CM2 and convert above the ${PC(MED_CVR,2)} median but receive below-median traffic.`,
    e:starved.slice(0,5).map(p=>`${p.code}: CM2 ${R(p.cm2)}/unit at ${PC(p.cvr,2)} CVR on only ${N(p.sessions)} sessions, CAC headroom ${R(p.cacHeadroom)}`).join('; '),
    i:`Taking these SKUs to median traffic (${N(MED_SESS)} sessions) at their current CVR adds ${RL(sum(starved,p=>Math.max(0,(MED_SESS-p.sessions)*p.cvr*p.cm2)))} of CM2`,
    a:`Move the budget capped in recommendation 1 into these SKUs, holding CAC below each product's EBITDA break-even ceiling.`,
    o:`Contribution grows without new products, new pricing or new creative — this is the cleanest ₹1 of incremental media in the portfolio.`});

  const dogs=PROD.filter(p=>p.matrix==='Dog'&&p.ebitdaTot<-20000).sort((a,b)=>a.ebitdaTot-b.ebitdaTot);
  if(dogs.length)recs.push({t:'Retire or bundle the long tail that loses money at every level',
    p:`${PROD.filter(p=>p.matrix==='Dog').length} SKUs sit in the Dog quadrant — below-median revenue and negative CM2.`,
    e:dogs.slice(0,5).map(p=>`${p.code}: ${RL(p.netRev)} revenue, ${RL(p.ebitdaTot)} EBITDA, CAC ${R(p.cac)} vs ${R(Math.max(0,p.maxCacEbitda))} ceiling`).join('; '),
    i:`${RL(sum(PROD.filter(p=>p.matrix==='Dog'),p=>p.ebitdaTot))} of EBITDA loss on ${PC(div(sum(PROD.filter(p=>p.matrix==='Dog'),p=>p.netRev),A.netRev))} of revenue`,
    a:`Stop all paid support, keep them as organic and cross-sell inventory only, and fold the strongest into bundles with Star SKUs to lift AOV and dilute shipping.`,
    o:`Removes ${RL(Math.abs(sum(PROD.filter(p=>p.matrix==='Dog'),p=>p.ebitdaTot)))} of loss while retaining catalogue breadth through bundles.`});

  recs.push({t:'Fix the June data pipeline before the next review',
    p:`June records traffic on ${MONTH_AGG.jun.trafficDays} of 30 days and orders on ${MONTH_AGG.jun.orderDays} of 30, against ${MONTH_AGG.apr.trafficDays}/30 in April.`,
    e:`June GMV (${RL(jun.gmv)}) and marketing spend (${RL(jun.mkt)}) are complete, but conversion, AOV and CAC for the month are computed on partial denominators and are not comparable to April or May.`,
    i:`One third of the quarter cannot be diagnosed on funnel or efficiency metrics`,
    a:`Restore the daily traffic and order feed for 7–30 June, and add a monthly SKU split to the Website P&L sheet so product-level growth, category growth and CM2 bridges can be computed.`,
    o:`Product month-on-month analysis, category growth matrices and true cost-rate bridges become available — all currently marked N/A in this dashboard.`});

  recs.forEach((r,i)=>{
    const d=document.createElement('div');d.className='rec';
    d.innerHTML=`<div class="rh"><span class="rk">${i+1}</span><span>${esc(r.t)}</span></div>
      <div class="rb">
        <div><strong>Problem</strong>${esc(r.p)}</div>
        <div><strong>Evidence</strong>${esc(r.e)}</div>
        <div><strong>Financial impact</strong>${esc(r.i)}</div>
        <div><strong>Action</strong>${esc(r.a)}</div>
        <div><strong>Expected outcome</strong>${esc(r.o)}</div>
      </div>`;
    s.appendChild(d);});
}

  naBox(s,'Product month-on-month analysis (April → May → June) cannot be produced.',

  naBox(s,'Product daily performance cannot be produced.',
    'Daily granularity exists only at portfolio level (Apr, May and June Daily P&L sheets) and product granularity exists only at Apr–Jun level. The two cannot be joined. Portfolio daily performance is in section 05; product economics are in sections 07–19.');

  bar.innerHTML=`<div class="fg"><label>Product</label><select id="gapSku"></select></div>`;

    kpi(g,'Net revenue',RL(p.netRev),`<span class="flat">ASP ${R(p.sp)}</span>`);
    kpi(g,'Discount',PC(p.discPct),`<span class="flat">${R(p.disc)}/unit of ${R(p.mrp)} MRP</span>`);
    kpi(g,'CAC / unit',R(p.cac),`<span class="flat">ceiling ${R(p.maxCacEbitda)}</span>`,p.cac<=p.maxCacEbitda?'d-g':'d-r');
    kpi(g,'Shipping / unit',R(p.ship),`<span class="flat">${PC(p.shipPctRev)} of revenue</span>`,p.shipPctRev>0.15?'d-r':'d-a');
    kpi(g,'CM2',RL(p.cm2Tot),`<span class="flat">${PC(p.cm2Pct)} · ${R1(p.cm2)}/unit</span>`,p.cm2>0?'d-g':'d-r');
    kpi(g,'EBITDA',RL(p.ebitdaTot),`<span class="flat">${PC(p.ebitdaPct)} · ${R1(p.ebitda)}/unit</span>`,p.ebitda>0?'d-g':'d-r');
    kpi(g,'Diagnosis',p.issue.k,`<span class="flat">${esc(p.action)}</span>`);
    note(host,`<b>${esc(p.name)}</b> — ${esc(p.issue.evidence)}. Recommended action: ${esc(p.issue.action)}.`);
  }
  sel.addEventListener('change',draw);draw();
}
