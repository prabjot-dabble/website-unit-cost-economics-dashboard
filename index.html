<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Unit Economics &amp; Full-Funnel P&amp;L — Apr–Aug 2026</title>
<style>
:root{
  --ink:#12181f; --ink2:#3c4854; --ink3:#6b7885; --line:#dfe4e9; --line2:#eef1f4;
  --bg:#ffffff; --bg2:#f7f9fa; --navy:#123a5c; --navy2:#1f5c8b; --teal:#2b7f7f;
  --red:#b32d1f; --redbg:#fbecea; --amber:#b47500; --amberbg:#fdf3e2; --green:#1c7a4a; --greenbg:#eaf5ee;
  --slate:#8a97a3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:132px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Söhne","Inter","Helvetica Neue",Arial,"Segoe UI",sans-serif;
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.01em}
a{color:var(--navy2)}
.wrap{max-width:1560px;margin:0 auto;padding:0 26px}

/* ---------- masthead + controls ---------- */
#top{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.mast{display:flex;align-items:baseline;gap:16px;padding:12px 0 10px;border-bottom:1px solid var(--line2)}
.mast h1{font-size:17px}
.mast .sub{color:var(--ink3);font-size:12px}
.mast .spacer{flex:1}
.mast .stamp{font-size:11px;color:var(--ink3);text-align:right;line-height:1.35}
.ctrls{display:flex;flex-wrap:wrap;gap:14px;padding:9px 0 10px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:10.5px;color:var(--ink3);letter-spacing:.02em}
select,input[type=text],input[type=date]{font:inherit;font-size:12px;padding:5px 7px;border:1px solid var(--line);
  border-radius:2px;background:#fff;color:var(--ink);min-width:118px;max-width:190px}
select:focus,input:focus,button:focus{outline:2px solid var(--navy2);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{font:inherit;font-size:11.5px;padding:5px 10px;border:0;border-right:1px solid var(--line);
  background:#fff;color:var(--ink2);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.btn{font:inherit;font-size:11.5px;padding:6px 11px;border:1px solid var(--line);background:#fff;
  border-radius:2px;cursor:pointer;color:var(--ink2)}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
#navbar{display:flex;gap:0;overflow-x:auto;border-top:1px solid var(--line2);scrollbar-width:thin}
#navbar a{font-size:11px;color:var(--ink3);text-decoration:none;padding:7px 10px;white-space:nowrap;border-bottom:2px solid transparent}
#navbar a:hover{color:var(--navy);background:var(--bg2)}
#navbar a.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}

/* ---------- sections ---------- */
section{padding:30px 0 6px;border-top:1px solid var(--line2)}
section:first-of-type{border-top:0}
.shead{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.shead .n{font-size:11px;color:var(--slate);font-variant-numeric:tabular-nums;min-width:22px}
.shead h2{font-size:16px}
.shead .tag{font-size:10.5px;color:var(--ink3);border:1px solid var(--line);border-radius:2px;padding:1px 6px}
.lede{color:var(--ink2);font-size:12.5px;max-width:104ch;margin:2px 0 16px}

/* ---------- kpi ---------- */
/* background is white, not the grid-line color, so a trailing row with fewer
   cards than columns shows blank white space rather than a filled gray box */
.kpigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));background:#fff;
  border:1px solid var(--line2);border-bottom:0}
.kpi{background:#fff;padding:11px 12px 10px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.kpi .k{font-size:10.5px;color:var(--ink3);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px}
.kpi .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;line-height:1.15}
.kpi .m{font-size:11px;color:var(--ink3);margin-top:3px;font-variant-numeric:tabular-nums;display:flex;gap:8px;flex-wrap:wrap}
.kpigroup{font-size:11px;font-weight:600;color:var(--ink2);margin:18px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--ink3)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.d-g{background:var(--green)}.d-a{background:var(--amber)}.d-r{background:var(--red)}.d-n{background:var(--slate)}

/* ---------- insight cards ---------- */
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.ins{border:1px solid var(--line);border-left:3px solid var(--navy);padding:11px 13px;background:#fff}
.ins.r{border-left-color:var(--red)} .ins.a{border-left-color:var(--amber)} .ins.g{border-left-color:var(--green)}
.ins h4{font-size:11.5px;color:var(--ink3);font-weight:600;margin-bottom:5px}
.ins p{margin:0;font-size:12.5px;color:var(--ink);line-height:1.55}
.ins b{font-variant-numeric:tabular-nums}

/* ---------- tables ---------- */
.tblwrap{border:1px solid var(--line);overflow:auto;max-height:620px;position:relative}
/* scroll affordance: a soft edge fade appears whenever a wide table has more
   columns hidden off that side, and clears once scrolled all the way there */
.tblwrap::before,.tblwrap::after{content:'';position:absolute;top:0;bottom:0;width:22px;
  pointer-events:none;z-index:5;opacity:0;transition:opacity .15s}
.tblwrap::before{left:0;background:linear-gradient(to right,rgba(255,255,255,.95),rgba(255,255,255,0))}
.tblwrap::after{right:0;background:linear-gradient(to left,rgba(255,255,255,.95),rgba(255,255,255,0))}
.tblwrap.cue-l::before{opacity:1}
.tblwrap.cue-r::after{opacity:1}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:#f2f5f7;text-align:right;padding:7px 9px;font-weight:600;font-size:10.5px;
  color:var(--ink2);border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:2}
thead th.l,tbody td.l{text-align:left}
thead th:hover{background:#e8edf1}
thead th .ar{color:var(--slate);font-size:9px;margin-left:2px}
tbody td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody tr:hover{background:#f8fbfc}
tbody tr.grp td{background:#eef1f4;font-weight:600;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:#4a5560;padding:5px 9px}
tbody tr.tot{background:#f2f5f7;font-weight:600}
tbody tr.tot td{border-top:1px solid var(--line)}
td.l{max-width:290px;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:1px 6px;border-radius:2px;font-size:10.5px;font-weight:600;white-space:nowrap}
.p-r{background:var(--redbg);color:var(--red)}.p-a{background:var(--amberbg);color:var(--amber)}
.p-g{background:var(--greenbg);color:var(--green)}.p-n{background:#eef1f4;color:var(--ink3)}
.neg{color:var(--red)}
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tbar .cnt{font-size:11px;color:var(--ink3);margin-left:auto}
.bar-cell{position:relative}
.bar-cell i{position:absolute;left:0;top:2px;bottom:2px;background:#dbe6ee;z-index:0;display:block}
.bar-cell span{position:relative;z-index:1}

/* ---------- charts ---------- */
.chartgrid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{border:1px solid var(--line);padding:12px 13px 9px;background:#fff}
.card h3{font-size:12px;margin-bottom:2px}
.card .cs{font-size:10.5px;color:var(--ink3);margin-bottom:7px}
svg.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:11px;font-size:10.5px;color:var(--ink2);margin-top:6px}
.legend i{width:9px;height:9px;display:inline-block;margin-right:4px;vertical-align:baseline;border-radius:1px}
.simbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.simbar input[type=range]{width:230px;accent-color:var(--navy)}
.simval{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--navy)}
.note{font-size:11px;color:var(--ink3);margin-top:8px;line-height:1.5}
.na{border:1px dashed var(--line);background:var(--bg2);padding:14px 16px;color:var(--ink2);font-size:12.5px}
.na b{color:var(--red)}
.tip{position:fixed;pointer-events:none;background:#12181f;color:#fff;font-size:11px;padding:6px 8px;
  border-radius:2px;z-index:200;opacity:0;transition:opacity .1s;max-width:280px;line-height:1.45}
.tip.on{opacity:1}
.simgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2)}
.simgrid .kpi{padding:9px 11px}
input[type=range]{width:100%;accent-color:var(--navy)}
.flex{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:9px}
.alert{display:flex;gap:10px;border:1px solid var(--line);padding:9px 11px;font-size:12.5px;align-items:flex-start}
.alert.r{background:var(--redbg);border-color:#f0cdc7}
.alert.a{background:var(--amberbg);border-color:#f2ddb6}
.alert.g{background:var(--greenbg);border-color:#c9e4d4}
.alert .ic{font-weight:700;font-size:12px}
.rec{border:1px solid var(--line);margin-bottom:11px}
.rec .rh{background:#f2f5f7;padding:8px 12px;font-weight:600;font-size:12.5px;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line)}
.rec .rh .rk{font-size:10.5px;color:#fff;background:var(--navy);padding:1px 6px;border-radius:2px}
.rec .rb{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0}
.rec .rb div{padding:9px 12px;border-right:1px solid var(--line2);font-size:12px}
.rec .rb div:last-child{border-right:0}
.rec .rb strong{display:block;font-size:10.5px;color:var(--ink3);font-weight:600;margin-bottom:3px}
details.meth{border:1px solid var(--line);margin-top:10px}
details.meth summary{padding:8px 12px;cursor:pointer;font-size:12px;font-weight:600;background:var(--bg2)}
details.meth .db{padding:0}
footer{margin:40px 0 30px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3)}
@media print{
  #top{position:static} #navbar{display:none} .tblwrap{max-height:none;overflow:visible}
  section{break-inside:auto;page-break-inside:auto} .card{break-inside:avoid}
  body{font-size:10px} .btn,.seg,select,input{display:none}
  .ctrls{display:none}
}
@media (max-width:760px){ .wrap{padding:0 12px} .mast .stamp{display:none} }
</style>
</head>

/* ============================================================================
   3. MODEL — multi-period product economics
   ========================================================================== */
const PERIODS = DATA.periods;                       // [{id,label,short,days,start,end}]
const PIDS    = PERIODS.map(p=>p.id);               // ['aj','jul','aug']
const PMETA   = Object.fromEntries(PERIODS.map(p=>[p.id,p]));
const ADS     = DATA.adsTotals;
const UNMAP   = DATA.unmapped;
const GST     = 1.18;

/* ---- month → product-period mapping -------------------------------------- */
const MONTHS      = ['Apr','May','Jun','Jul','Aug'];
const MONTH_PID   = {Apr:'aj',May:'aj',Jun:'aj',Jul:'jul',Aug:'aug'};
const MONTH_DAYS  = {Apr:30,May:31,Jun:30,Jul:31,Aug:31};
/* Apr–Jun product economics are one combined 3-month block: a single month
   inside it cannot be isolated.  PID_MONTHS records that span.              */
const PID_MONTHS  = {aj:['Apr','May','Jun'],jul:['Jul'],aug:['Aug']};
const PID_NMONTH  = {aj:3,jul:1,aug:1};

/* ---- per-SKU per-period derived record ----------------------------------- */
function deriveRec(r,pid,prod){
  const u=r.units||0;
  const a=r.ads||{views:0,atc:0,purch:0,itemRev:0,sess:0,spend:0};
  const varPU = r.cogs+r.pack+r.razor+r.ship+r.cod+r.shopify+r.shopflo;   // excl. returns
  const o = {
    pid, units:u, hasSales:u>0,
    gmv:r.gmv, netRev:(r.nru||0)*u, netRevCol:r.netRevCol,
    mrp:r.mrp, disc:r.disc, sp:r.sp, spEx:r.spEx, ret:r.ret,
    nru:r.nru, cogs:r.cogs, gm:r.gm, gmPct:r.gmPct,
    pack:r.pack, razor:r.razor, ship:r.ship, cod:r.cod, shopify:r.shopify, shopflo:r.shopflo,
    cm1:r.cm1, cm1Pct:r.cm1Pct, mktPU:r.mktPU, cm2:r.cm2, cm2Pct:r.cm2Pct,
    oh:r.oh, ebitda:r.ebitda, ebitdaPct:r.ebitdaPct,
    totalDisc:r.totalDisc, mktTot:r.mktTot, drr:r.drr,
    varPU, payPU:r.razor+r.cod+r.shopify+r.shopflo,
    // totals
    cogsT:r.cogs*u, shipT:r.ship*u, packT:r.pack*u, payT:(r.razor+r.cod+r.shopify+r.shopflo)*u,
    gmT:r.gm*u, cm1T:r.cm1*u, cm2T:r.cm2*u, ohT:r.oh*u, ebitdaT:r.ebitda*u, retT:r.ret*u,
    // ads / funnel (views, ATC and purchases are genuinely per item;
    // sessions are an allocation — see SESS_ALLOC)
    views:a.views, atcN:a.atc, purch:a.purch, itemRev:a.itemRev,
    sessAlloc:a.sess, spend:a.spend, hasAds:(a.views+a.atc+a.purch+a.spend)>0
  };
  o.discPct   = div(r.disc, r.mrp);
  o.shipPctRev= div(r.ship, r.nru);
  o.shipPctAsp= div(r.ship, r.sp);
  o.cogsPctRev= div(r.cogs, r.nru);
  o.cm2BeforeShip = r.cm2 + r.ship;
  o.shipFlips = (o.cm2BeforeShip>0 && r.cm2<=0);
  o.roas      = div(r.nru*u, r.mktTot);
  o.mktPctRev = div(r.mktTot, r.nru*u);
  o.revPerView= div(r.nru*u, a.views);
  o.v2a       = div(a.atc, a.views);
  o.a2p       = div(a.purch, a.atc);
  o.v2p       = div(a.purch, a.views);
  /* ---- CAC ceilings ----
     break-even CAC : the marketing cost per unit at which CM2 = 0  → CM1/unit
     target CAC     : the marketing cost per unit at which EBITDA=0 → CM1 − overhead
     10% CAC        : leaves a 10% EBITDA margin                                */
  o.maxCacBE  = r.cm1;
  o.maxCacTgt = r.cm1 - r.oh;
  o.maxCac10  = r.cm1 - r.oh - 0.10*r.nru;
  o.cac       = r.mktPU;                      // marketing ÷ units (see method)
  o.cacGapBE  = o.maxCacBE  - o.cac;
  o.cacGapTgt = o.maxCacTgt - o.cac;
  o.cacStatus = !u ? 'No sales'
              : o.cac<=0 ? 'No spend'
              : o.cac<=o.maxCacTgt ? 'Efficient'
              : o.cac<=o.maxCacBE  ? 'Watch'
              : 'Destroying profit';
  o.cacExcess = Math.max(0, o.cac - Math.max(o.maxCacTgt,0)) * u;  // ₹ above EBITDA break-even
  /* ---- break-even quantity ----
     fixed cost = this SKU's own overhead charge for the period                */
  o.fixedAlloc = r.oh*u;
  o.beQty  = (r.cm2>0) ? o.fixedAlloc/r.cm2 : null;
  o.beRev  = (o.beQty!=null) ? o.beQty*r.nru : null;
  o.beGap  = (o.beQty!=null) ? u-o.beQty : null;
  o.beClass= !u ? 'No sales'
           : r.ebitda>0 ? 'Already profitable'
           : r.cm2<=0   ? 'Structurally unprofitable'
           : (o.beQty!=null && o.beQty<=u*1.25) ? 'Near break-even' : 'Requires volume';
  /* ---- maximum profitable discount ----
     solve  MRP(1−d)/1.18 − returns − variable costs − marketing = target
     d_cm2   : target 0             (CM2 = 0)
     d_ebitda: target overhead      (EBITDA = 0)                                */
  const mrpEx = r.mrp/GST;
  const floorCM2 = r.ret + varPU + r.mktPU;
  const floorEB  = floorCM2 + r.oh;
  o.maxDiscCm2 = mrpEx>0 ? 1-(floorCM2/mrpEx) : null;
  o.maxDiscEb  = mrpEx>0 ? 1-(floorEB /mrpEx) : null;
  o.discHeadCm2= (o.maxDiscCm2==null)?null:o.maxDiscCm2-(o.discPct||0);
  o.discHeadEb = (o.maxDiscEb ==null)?null:o.maxDiscEb -(o.discPct||0);
  o.discStatus = !u ? 'No sales'
    : (o.maxDiscCm2==null||o.maxDiscCm2<0) ? 'No discount affordable'
    : (o.discPct>o.maxDiscCm2) ? 'Above CM2 break-even'
    : (o.maxDiscEb!=null && o.discPct>o.maxDiscEb) ? 'Above EBITDA break-even'
    : 'Within limit';
  return o;
}

const PROD = DATA.products.map(p=>{
  const o={code:p.code,name:p.name,cat:p.cat||'Uncategorised',sub:p.sub||'—',per:{}};
  PIDS.forEach(pid=>{ if(p.per[pid]) o.per[pid]=deriveRec(p.per[pid],pid,o); });
  o.band = (()=>{const m=(o.per[PIDS[0]]||o.per[PIDS[1]]).mrp;
    return m<500?'Under ₹500':m<1000?'₹500–999':m<1500?'₹1,000–1,499':m<2000?'₹1,500–1,999':'₹2,000+';})();
  return o;
});

/* ---- session allocation flag -------------------------------------------- */
const SESS_ALLOC = Object.fromEntries(PIDS.map(id=>[id,{
  allocated: !!ADS[id].sessAllocated, perSess: ADS[id].spendPerSess,
  total: ADS[id].sess }]));
const ANY_SESS_ALLOC = PIDS.some(id=>SESS_ALLOC[id].allocated);

/* ============================================================================
   Aggregating a SKU across several product periods.
   Volumes and ₹ totals add; per-unit figures become unit-weighted averages.
   ========================================================================== */
function aggRec(recs){
  const R2={units:0,gmv:0,netRev:0,netRevCol:0,totalDisc:0,mktTot:0,
            cogsT:0,shipT:0,packT:0,payT:0,gmT:0,cm1T:0,cm2T:0,ohT:0,ebitdaT:0,retT:0,
            views:0,atcN:0,purch:0,itemRev:0,sessAlloc:0,spend:0,fixedAlloc:0,cacExcess:0};
  let wmrp=0,wdisc=0,wsp=0,wspEx=0;
  recs.forEach(r=>{
    for(const k in R2) if(r[k]!=null&&isFinite(r[k])) R2[k]+=r[k];
    const u=r.units||0; wmrp+=r.mrp*u; wdisc+=r.disc*u; wsp+=r.sp*u; wspEx+=r.spEx*u;
  });
  const u=R2.units, W=(x,fb)=>u?x/u:fb;
  const anyRec = recs.find(r=>r.units>0)||recs[0]||{};
  const o={...R2, hasSales:u>0,
    mrp: u?wmrp/u:anyRec.mrp, disc:u?wdisc/u:anyRec.disc,
    sp: u?wsp/u:anyRec.sp, spEx:u?wspEx/u:anyRec.spEx,
    nru:W(R2.netRev,anyRec.nru), cogs:W(R2.cogsT,anyRec.cogs), ship:W(R2.shipT,anyRec.ship),
    pack:W(R2.packT,anyRec.pack), ret:W(R2.retT,anyRec.ret),
    payPU:W(R2.payT,anyRec.payPU), gm:W(R2.gmT,anyRec.gm),
    cm1:W(R2.cm1T,anyRec.cm1), cm2:W(R2.cm2T,anyRec.cm2),
    oh:W(R2.ohT,anyRec.oh), ebitda:W(R2.ebitdaT,anyRec.ebitda),
    mktPU:W(R2.mktTot,anyRec.mktPU)};
  o.razor=null;o.cod=null;o.shopify=null;o.shopflo=null;
  o.varPU=o.cogs+o.pack+o.payPU+o.ship;
  o.gmPct=div(R2.gmT,R2.netRev); o.cm1Pct=div(R2.cm1T,R2.netRev);
  o.cm2Pct=div(R2.cm2T,R2.netRev); o.ebitdaPct=div(R2.ebitdaT,R2.netRev);
  o.discPct=div(o.disc,o.mrp);
  o.shipPctRev=div(R2.shipT,R2.netRev); o.shipPctAsp=div(o.ship,o.sp);
  o.cogsPctRev=div(R2.cogsT,R2.netRev);
  o.cm2BeforeShip=o.cm2+o.ship; o.shipFlips=(o.cm2BeforeShip>0&&o.cm2<=0);
  o.roas=div(R2.netRev,R2.mktTot); o.mktPctRev=div(R2.mktTot,R2.netRev);
  o.revPerView=div(R2.netRev,R2.views);
  o.v2a=div(R2.atcN,R2.views); o.a2p=div(R2.purch,R2.atcN); o.v2p=div(R2.purch,R2.views);
  o.hasAds=(R2.views+R2.atcN+R2.purch+R2.spend)>0;
  o.maxCacBE=o.cm1; o.maxCacTgt=o.cm1-o.oh; o.maxCac10=o.cm1-o.oh-0.10*o.nru;
  o.cac=o.mktPU; o.cacGapBE=o.maxCacBE-o.cac; o.cacGapTgt=o.maxCacTgt-o.cac;
  o.cacStatus=!u?'No sales':o.cac<=0?'No spend'
    :o.cac<=o.maxCacTgt?'Efficient':o.cac<=o.maxCacBE?'Watch':'Destroying profit';
  o.beQty=(o.cm2>0)?R2.fixedAlloc/o.cm2:null;
  o.beRev=(o.beQty!=null)?o.beQty*o.nru:null;
  o.beGap=(o.beQty!=null)?u-o.beQty:null;
  o.beClass=!u?'No sales':o.ebitda>0?'Already profitable':o.cm2<=0?'Structurally unprofitable'
    :(o.beQty!=null&&o.beQty<=u*1.25)?'Near break-even':'Requires volume';
  const mrpEx=o.mrp/GST, fC=o.ret+o.varPU+o.mktPU, fE=fC+o.oh;
  o.maxDiscCm2=mrpEx>0?1-(fC/mrpEx):null;
  o.maxDiscEb =mrpEx>0?1-(fE/mrpEx):null;
  o.discHeadCm2=(o.maxDiscCm2==null)?null:o.maxDiscCm2-(o.discPct||0);
  o.discHeadEb =(o.maxDiscEb ==null)?null:o.maxDiscEb -(o.discPct||0);
  o.discStatus=!u?'No sales':(o.maxDiscCm2==null||o.maxDiscCm2<0)?'No discount affordable'
    :(o.discPct>o.maxDiscCm2)?'Above CM2 break-even'
    :(o.maxDiscEb!=null&&o.discPct>o.maxDiscEb)?'Above EBITDA break-even':'Within limit';
  return o;
}

/* view of a product over a set of product-periods */
function pv(p,pids){
  const recs=pids.map(id=>p.per[id]).filter(Boolean);
  if(!recs.length) return null;
  return recs.length===1?recs[0]:aggRec(recs);
}

/* ============================================================================
   Daily modelling.  The daily sheets carry no cost lines, so the cost stack is
   modelled: actual GMV → units at that period's blended GMV/unit → blended
   per-unit costs.  Marketing, orders, traffic, ATC are actuals and never modelled.
   ========================================================================== */
function modelDay(d){
  const B=BL[d.per]||BL.aj;
  const gmv=d.gmv||0;
  const units=B.gmvPU?gmv/B.gmvPU:0;
  const netRev=units*B.netRevPU;
  const cogs=units*B.cogsPU, ship=units*B.shipPU, pack=units*B.packPU,
        pay=units*(B.razorPU+B.codPU+B.shopifyPU+B.shopfloPU), ret=units*B.retPU,
        oh=units*B.ohPU;
  const mkt=d.mkt==null?null:d.mkt;
  const cm1=netRev-cogs-ship-pack-pay;
  const cm2=(mkt==null)?null:cm1-mkt;
  const eb =(cm2==null)?null:cm2-oh;
  return {...d, units, netRev, cogs, ship, pack, pay, ret, oh, gm:netRev-cogs,
    cm1, cm2, ebitda:eb,
    cm2Pct:div(cm2,netRev), ebitdaPct:div(eb,netRev), gmPct:div(netRev-cogs,netRev),
    mktPct:div(mkt,netRev),
    cvr:div(d.orders,d.traff), aov:div(gmv,d.orders),
    cacNb:div(mkt,d.nbOrders), cacOrd:div(mkt,d.orders),
    atcRate:div(d.atc,d.traff), atc2ord:div(d.orders,d.atc),
    discAmt:(d.promo==null?null:d.promo*gmv)};
}
const DDAY = DATA.daily.map(modelDay);
const DBYD = Object.fromEntries(DDAY.map(d=>[d.d,d]));

function aggDays(rows){
  const S2={gmv:0,netRev:0,netRevSrc:0,units:0,cogs:0,ship:0,pack:0,pay:0,ret:0,oh:0,
            cm1:0,gm:0,discAmt:0};
  let mkt=0,mktN=0, ord=0,ordN=0, tr=0,trN=0, nb=0,nbN=0, rb=0, atc=0,atcN=0, days=0;
  rows.forEach(d=>{
    days++;
    for(const k in S2) if(d[k]!=null&&isFinite(d[k])) S2[k]+=d[k];
    if(d.mkt!=null){mkt+=d.mkt;mktN++;}
    if(d.orders!=null){ord+=d.orders;ordN++;}
    if(d.traff!=null){tr+=d.traff;trN++;}
    if(d.nbOrders!=null){nb+=d.nbOrders;nbN++;}
    if(d.rbOrders!=null){rb+=d.rbOrders;}
    if(d.atc!=null){atc+=d.atc;atcN++;}
  });
  /* CM2 and EBITDA are computed only over days that actually record marketing
     spend, so a blank spend day cannot masquerade as a zero-cost day */
  const mrows=rows.filter(d=>d.mkt!=null);
  const cm1M=mrows.reduce((a,d)=>a+(d.cm1||0),0),
        ohM =mrows.reduce((a,d)=>a+(d.oh ||0),0),
        nrM =mrows.reduce((a,d)=>a+(d.netRev||0),0);
  const cm2=cm1M-mkt, eb=cm2-ohM;
  /* AOV and CVR use only the days that actually record the denominator */
  const gmvOrdDays=rows.filter(d=>d.orders!=null).reduce((a,d)=>a+(d.gmv||0),0);
  const ordTrDays =rows.filter(d=>d.orders!=null&&d.traff!=null).reduce((a,d)=>a+d.orders,0);
  const trOrdDays =rows.filter(d=>d.orders!=null&&d.traff!=null).reduce((a,d)=>a+d.traff,0);
  const ordAtcDays=rows.filter(d=>d.orders!=null&&d.atc!=null).reduce((a,d)=>a+d.orders,0);
  const atcTrDays =rows.filter(d=>d.atc!=null&&d.traff!=null).reduce((a,d)=>a+d.atc,0);
  const trAtcDays =rows.filter(d=>d.atc!=null&&d.traff!=null).reduce((a,d)=>a+d.traff,0);
  return {...S2, mkt, orders:ord, traff:tr, nbOrders:nb, rbOrders:rb, atc, days,
    mktDays:mktN, ordDays:ordN, trDays:trN, nbDays:nbN, atcDays:atcN,
    cm2, ebitda:eb,
    cm2Pct:div(cm2,nrM), ebitdaPct:div(eb,nrM), netRevMkt:nrM,
    gmPct:div(S2.gm,S2.netRev), mktPct:div(mkt,nrM),
    aov:div(gmvOrdDays,ord), asp:div(S2.netRev,S2.units),
    cvr:div(ordTrDays,trOrdDays), atcRate:div(atcTrDays,trAtcDays), atc2ord:div(ordAtcDays,atc),
    trAtcDays, ordAtcDays, trOrdDays, ordTrDays,
    cacNb:div(mkt,nb), cacOrd:div(mkt,ord), cacUnit:div(mkt,S2.units),
    discPct:div(S2.discAmt,S2.gmv),
    contribOrder:div(cm2,ord), contribUnit:div(cm2,S2.units),
    shipOrder:div(S2.ship,ord), shipUnit:div(S2.ship,S2.units),
    rcr:div(rb,ord)};
}

const MONTH_AGG = Object.fromEntries(MONTHS.map(m=>[m,aggDays(DDAY.filter(d=>d.mon===m))]));
const PID_AGG   = Object.fromEntries(PIDS.map(id=>[id,aggDays(DDAY.filter(d=>d.per===id))]));

/* ---- medians used for quadrant/threshold logic (per period set) ---------- */
function medians(pids){
  const rows=PROD.map(p=>pv(p,pids)).filter(r=>r&&r.units>0);
  const f=k=>{const v=rows.map(r=>r[k]).filter(x=>x!=null&&isFinite(x)).sort((a,b)=>a-b);
    return v.length?v[Math.floor(v.length/2)]:0;};
  return {rev:f('netRev'), views:f('views'), v2p:f('v2p'), v2a:f('v2a'), a2p:f('a2p'),
          ship:f('shipPctRev'), cac:f('cac'), n:rows.length};
}

const S={time:'all',from:null,to:null,cat:'',sub:'',sku:'',band:'',prof:'',cm2:'',eb:'',mkt:'',fun:''};

const TIME_MONTH={apr:'Apr',may:'May',jun:'Jun',jul:'Jul',aug:'Aug'};

function timeRows(){
  const t=S.time;
  if(TIME_MONTH[t]) return DDAY.filter(d=>d.mon===TIME_MONTH[t]);
  if(t==='aprjun')  return DDAY.filter(d=>d.per==='aj');
  if(t==='custom'&&S.from&&S.to) return DDAY.filter(d=>d.d>=S.from&&d.d<=S.to);
  return DDAY;
}
function prevRows(){
  const t=S.time, order=['Apr','May','Jun','Jul','Aug'];
  if(TIME_MONTH[t]){
    const i=order.indexOf(TIME_MONTH[t]);
    return i>0?DDAY.filter(d=>d.mon===order[i-1]):null;
  }
  if(t==='aug')    return DDAY.filter(d=>d.mon==='Jul');
  if(t==='jul')    return DDAY.filter(d=>d.per==='aj');   // compared on a run-rate basis
  if(t==='custom'&&S.from&&S.to){
    const a=new Date(S.from),b=new Date(S.to),len=(b-a)/864e5+1;
    const f=new Date(a.getTime()-len*864e5).toISOString().slice(0,10);
    const to=new Date(a.getTime()-864e5).toISOString().slice(0,10);
    const r=DDAY.filter(d=>d.d>=f&&d.d<=to); return r.length?r:null;
  }
  return null;
}
/* when the previous window is a different number of months, KPI growth is
   shown per month so the comparison is fair */
function prevScale(){
  if(S.time==='jul') return 1/3;                 // Apr–Jun block → per month
  return 1;
}
function prevLabel(){
  const t=S.time;
  if(t==='may')return 'April'; if(t==='jun')return 'May';
  if(t==='jul')return 'Apr–Jun monthly average'; if(t==='aug')return 'July';
  if(t==='custom')return 'preceding equal window';
  return 'previous';
}

/* which product-P&L periods the current timeline maps onto */
function timePids(){
  const t=S.time;
  if(t==='jul')return ['jul'];
  if(t==='aug')return ['aug'];
  if(t==='aprjun'||t==='apr'||t==='may'||t==='jun')return ['aj'];
  if(t==='custom'&&S.from&&S.to){
    const ids=PIDS.filter(id=>!(PMETA[id].end<S.from||PMETA[id].start>S.to));
    return ids.length?ids:PIDS;
  }
  return PIDS;
}
/* true when the product periods line up exactly with the daily window */
function pidsExact(){
  const t=S.time;
  if(['all','aprjun','jul','aug','mom','dod'].includes(t))return true;
  return false;
}
function pidsLabel(){
  const ids=timePids();
  return ids.length===PIDS.length?'Apr–Aug 2026':ids.map(i=>PMETA[i].label).join(' + ');
}
function timeLabel(){
  const t=S.time;
  if(t==='apr')return 'April 2026'; if(t==='may')return 'May 2026'; if(t==='jun')return 'June 2026';
  if(t==='jul')return 'July 2026';  if(t==='aug')return 'August 2026';
  if(t==='aprjun')return 'Apr–Jun 2026';
  if(t==='mom')return 'Month-on-month (Apr → Aug)';
  if(t==='dod')return 'Day-on-day (all 153 days)';
  if(t==='custom'&&S.from&&S.to)return S.from+' → '+S.to;
  return 'Apr–Aug 2026';
}

/* ---- per-product status labels, recomputed for the active period set ----- */
function tagProducts(pids){
  const M=medians(pids);
  PROD.forEach(p=>{
    const v=pv(p,pids); p._=v;
    if(!v){p.cm2Status='No sales';p.ebStatus='No sales';p.cacStatus='No sales';
           p.funStatus='No traffic data';p.profStatus='No sales';p.matrix='Dog';p.quad='No traffic data';return;}
    p.cm2Status = v.units<=0?'No sales':v.cm2>0?'Positive CM2':'Negative CM2';
    p.ebStatus  = v.units<=0?'No sales':v.ebitda>0?'Positive EBITDA':'Negative EBITDA';
    p.cacStatus = v.cacStatus;
    p.profStatus= v.units<=0?'No sales':v.ebitda>0?'Profitable (EBITDA+)'
                : v.cm2>0?'Contributing (CM2+ only)':'Loss-making';
    p.matrix    = v.units<=0?'Dog'
                : (v.netRev>=M.rev ? (v.cm2Pct>0?'Star':'Revenue trap')
                                   : (v.cm2Pct>0?'Profit niche':'Dog'));
    if(!v.hasAds||!v.views){p.quad='No traffic data';p.funStatus='No traffic data';}
    else{
      const hiV=v.views>=M.views, hiC=(v.v2p??0)>=M.v2p;
      p.quad = hiV?(hiC?'Scale':'Fix conversion'):(hiC?'Increase traffic':'Review / deprioritise');
      p.funStatus=p.quad;
    }
  });
  return M;
}

function fp(){                                   // filtered products
  return PROD.filter(p=>
    (!S.cat||p.cat===S.cat)&&(!S.sub||p.sub===S.sub)&&
    (!S.sku||p.code===S.sku)&&(!S.band||p.band===S.band)&&(!S.prof||p.profStatus===S.prof)&&
    (!S.cm2||p.cm2Status===S.cm2)&&(!S.eb||p.ebStatus===S.eb)&&(!S.mkt||p.cacStatus===S.mkt)&&
    (!S.fun||p.funStatus===S.fun));
}

function fpv(){ return fp().map(p=>({p,v:p._})).filter(x=>x.v); }

function table(host,cols,rows,opt={}){

  wrap.appendChild(bar);

  tb.innerHTML=`<thead><tr>${cols.map((c,i)=>`<th class="${c.l?'l':''}" data-i="${i}"${c.t?' title="'+esc(c.t)+'"':''}>${esc(c.h)}<span class="ar"></span></th>`).join('')}</tr></thead><tbody></tbody>`;
  tw.appendChild(tb);wrap.appendChild(tw);host.appendChild(wrap);
  let sortI=opt.sort!==undefined?opt.sort:null, sortD=opt.desc===false?1:-1, q='';
  function val(r,c){return c.v?c.v(r):r[c.k];}
  function render(){
    let d=rows.slice();
    if(q){const Q=q.toLowerCase();d=d.filter(r=>cols.some(c=>String(c.raw?c.raw(r):val(r,c)??'').toLowerCase().includes(Q)));}
    if(sortI!==null){const c=cols[sortI];
      d.sort((a,b)=>{let x=val(a,c),y=val(b,c);
        if(typeof x==='string'||typeof y==='string')return String(x??'').localeCompare(String(y??''))*sortD;
        x=(x===null||x===undefined||!isFinite(x))?-Infinity:x;y=(y===null||y===undefined||!isFinite(y))?-Infinity:y;
        return (x-y)*sortD;});}
    const body=d.map(r=>`<tr>${cols.map(c=>{
      const raw=val(r,c);const disp=c.f?c.f(raw,r):(typeof raw==='number'?N(raw):esc(raw??'—'));
      return `<td class="${c.l?'l':''} ${c.neg&&typeof raw==='number'&&raw<0?'neg':''}"${c.l?' title="'+esc(String(raw??''))+'"':''}>${disp}</td>`;
    }).join('')}</tr>`).join('');
    tb.querySelector('tbody').innerHTML=body+(opt.total?opt.total(d):'');
    $('#'+id+'n').textContent=d.length+' of '+rows.length+' rows';
    $$('th',tb).forEach((th,i)=>th.querySelector('.ar').textContent=(i===sortI?(sortD<0?'▼':'▲'):''));
    wrap._data=d;
  }
  $$('th',tb).forEach(th=>th.addEventListener('click',()=>{
    const i=+th.dataset.i; if(sortI===i)sortD=-sortD; else{sortI=i;sortD=-1;} render();}));
  if(opt.search!==false)$('#'+id+'s').addEventListener('input',e=>{q=e.target.value;render();});
  $('#'+id+'c').addEventListener('click',()=>{
    const d=wrap._data||rows;
    const csv=[cols.map(c=>'"'+c.h.replace(/"/g,'""')+'"').join(',')]
      .concat(d.map(r=>cols.map(c=>{const v=c.raw?c.raw(r):val(r,c);
        return typeof v==='number'?(isFinite(v)?v:''):'"'+String(v??'').replace(/"/g,'""')+'"';}).join(',')));
    const b=new Blob([csv.join('\n')],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=(opt.name||'export')+'.csv';a.click();URL.revokeObjectURL(a.href);
  });
  render();
  wireScrollCue(tw);
  return wrap;
}
/* shows a left/right edge fade on a horizontally scrollable table so a
   clipped rightmost column is never silently hidden with no visual cue */
function wireScrollCue(tw){
  const upd=()=>{
    const over=tw.scrollWidth>tw.clientWidth+1;
    tw.classList.toggle('cue-r',over&&tw.scrollLeft<tw.scrollWidth-tw.clientWidth-1);
    tw.classList.toggle('cue-l',over&&tw.scrollLeft>1);
  };
  tw.addEventListener('scroll',upd,{passive:true});
  if(typeof ResizeObserver!=='undefined'){
    new ResizeObserver(upd).observe(tw);
  } else {
    setTimeout(upd,0);
  }
  upd();
}

  const rk=(k,v,pv_,fmt,inv)=>{
    const gr=Bp?g(v,pv_):null;
    const good=gr===null?0:(Math.abs(gr)<0.0005?0:(gr>0?(inv?-1:1):(inv?1:-1)));
    kpi(G,k,fmt(v),Bp?`<span class="${good>0?'up':good<0?'down':'flat'}">${arrow(gr)} ${PCS(gr)}</span> <span class="flat">prev ${fmt(pv_)}</span>`:'',
      gr===null?'':(good>0?'d-g':good<0?'d-r':'d-n'));};
  const P_=(f)=>Bp?Bp[f]*sc:null;

  group('Revenue');
  rk('GMV / gross sales',A.gmv,P_('gmv'),RL);
  rk('Net sales (source column)',A.netRevSrc,P_('netRevSrc'),RL);
  rk('Net revenue ex-GST (modelled)',A.netRev,P_('netRev'),RL);
  rk('Orders',A.orders,P_('orders'),N);
  rk('Units (modelled)',A.units,P_('units'),N);
  rk('AOV',A.aov,Bp?Bp.aov:null,R);
  rk('ASP (modelled)',A.asp,Bp?Bp.asp:null,R);
  rk('Discount / promo %',A.discPct,Bp?Bp.discPct:null,v=>PC(v),true);

  group('Funnel');
  rk('Sessions / traffic',A.traff,P_('traff'),N);
  kpi(G,'Product page views',pids.length?N(V.views):'—',
    `items viewed, ${esc(pidsLabel())}`,'d-n');
  kpi(G,'Add to cart',A.atcDays?N(A.atc):'—',
    A.atcDays?`daily ATC recorded on ${A.atcDays} of ${A.days} days`:'not recorded before July','d-n');
  kpi(G,'Checkout initiated','N/A','stage absent from every source sheet','d-n');
  rk('Session → order CVR',A.cvr,Bp?Bp.cvr:null,v=>PC(v,2));
  kpi(G,'Session → ATC %',A.atcRate!=null?PC(A.atcRate,2):'N/A',
    A.atcRate!=null?'daily ATC ÷ daily traffic':'ATC not recorded in this window','d-n');
  kpi(G,'ATC → order %',A.atc2ord!=null?PC(A.atc2ord,1):'N/A',
    A.atc2ord!=null?'daily orders ÷ daily ATC':'ATC not recorded in this window','d-n');
  kpi(G,'View → purchase %',V.v2p!=null?PC(V.v2p,2):'—','item level, whole product period','d-n');

  group('Cost');
  rk('COGS (modelled)',A.cogs,P_('cogs'),RL,true);
  rk('Gross margin (modelled)',A.gm,P_('gm'),RL);
  rk('Gross margin %',A.gmPct,Bp?Bp.gmPct:null,v=>PC(v));
  rk('Shipping (modelled)',A.ship,P_('ship'),RL,true);
  rk('Shipping / order',A.shipOrder,Bp?Bp.shipOrder:null,R,true);
  rk('Shipping / unit',A.shipUnit,Bp?Bp.shipUnit:null,R,true);
  rk('Marketing spend',A.mkt,P_('mkt'),RL,true);
  rk('New-customer CAC',A.cacNb,Bp?Bp.cacNb:null,R,true);
  rk('CAC per unit',A.cacUnit,Bp?Bp.cacUnit:null,R,true);
  rk('Marketing % of net revenue',A.mktPct,Bp?Bp.mktPct:null,v=>PC(v),true);

  group('Profitability');
  rk('CM1 (modelled)',A.cm1,P_('cm1'),RL);
  rk('CM1 %',div(A.cm1,A.netRev),Bp?div(Bp.cm1,Bp.netRev):null,v=>PC(v));
  rk('CM2 (modelled)',A.cm2,P_('cm2'),RL);
  rk('CM2 %',A.cm2Pct,Bp?Bp.cm2Pct:null,v=>PC(v));
  rk('EBITDA (modelled)',A.ebitda,P_('ebitda'),RL);
  rk('EBITDA %',A.ebitdaPct,Bp?Bp.ebitdaPct:null,v=>PC(v));
  rk('Contribution / order',A.contribOrder,Bp?Bp.contribOrder:null,R);
  rk('Contribution / unit',A.contribUnit,Bp?Bp.contribUnit:null,R);

  /* headline trend */
  const gr=grid(s,'g2');
  const c1=card(gr,'Net revenue, CM2 and EBITDA by month','modelled cost stack · actual revenue and spend');
  const ms=MONTHS;
  gbarChart(c1,{labels:ms,w:520,h:250,
    series:[{name:'Net revenue',color:C.navy2,values:ms.map(m=>MONTH_AGG[m].netRev)},
            {name:'CM2',color:C.teal,values:ms.map(m=>MONTH_AGG[m].cm2)},
            {name:'EBITDA',color:C.red,values:ms.map(m=>MONTH_AGG[m].ebitda)}]});
  const c2=card(gr,'Marketing as % of net revenue','the single driver of the loss');
  lineChart(c2,{labels:ms,w:520,h:250,yFmt:v=>PC(v,0),zero:true,
    series:[{name:'Marketing % of net revenue',color:C.red,values:ms.map(m=>MONTH_AGG[m].mktPct)},
            {name:'Gross margin %',color:C.green,values:ms.map(m=>MONTH_AGG[m].gmPct)}]});

  /* where ₹100 of revenue goes */
  const c3=card(s,'Where every ₹100 of net revenue goes',esc(pidsLabel())+' · product P&L, actual');
  const nr=V.netRev||1;
  stackBar(c3,[
    {l:'COGS',v:V.cogs,p:V.cogsT/nr,c:C.navy},
    {l:'Shipping',v:V.ship,p:V.shipT/nr,c:C.red},
    {l:'Packaging',v:V.pack,p:V.packT/nr,c:C.lav},
    {l:'Payment + platform',v:V.payPU,p:V.payT/nr,c:C.slate},
    {l:'Marketing',v:V.mktPU,p:V.mktTot/nr,c:C.amber},
    {l:'Overhead',v:V.oh,p:V.ohT/nr,c:C.navy2},
    {l:(V.ebitda>=0?'EBITDA':'EBITDA loss'),v:Math.abs(V.ebitda),p:Math.abs(V.ebitdaT)/nr,c:V.ebitda>=0?C.green:'#e0b4ad'}
  ],760,58);
  note(c3,`Per unit on ${N(V.units)} units: net revenue ${R1(V.nru)} → CM1 ${R1(V.cm1)} → CM2 ${R1(V.cm2)} → EBITDA ${R1(V.ebitda)}.
    ${V.ebitda<0?`Every unit sold loses ${R1(-V.ebitda)} after a ${R1(V.oh)} overhead charge.`:''}`);
}

/* ============================================================================
   S02. MANAGEMENT "SO WHAT?"
   ========================================================================== */
function renderSoWhat(){
  const s=sec('s-sowhat','02','So what?','Automated, evidence-backed',
    'Every statement below is generated from the numbers in the current view — none of it is written by hand.');
  const cur=timeRows(),prv=prevRows(),A=aggDays(cur),Bp=prv?aggDays(prv):null,sc=prevScale();
  const pids=timePids(), rows=fpv(), V=aggProducts(rows);
  const out=[];
  const g=(a,b)=>(b&&isFinite(a/b))?(a-b)/Math.abs(b):null;
  if(!rows.length){
    naBox(s,'No SKU matches the current filters, so there is nothing to summarise.',
      'Clear a filter or widen the timeline.');
    return;
  }

  /* revenue */
  if(Bp){
    const gr=g(A.netRev,Bp.netRev*sc), go=g(A.orders,Bp.orders*sc), gt=g(A.traff,Bp.traff*sc);
    const top=rows.slice().sort((a,b)=>b.v.netRev-a.v.netRev).slice(0,2);
    out.push(['Revenue',
      `Net revenue ${gr>=0?'grew':'fell'} ${PCS(gr)} versus ${prevLabel()} (${RL(A.netRev)} against ${RL(Bp.netRev*sc)}),
       on orders ${PCS(go)} and traffic ${PCS(gt)}.
       ${topLine(top,V)}`]);
  } else {
    const top=rows.slice().sort((a,b)=>b.v.netRev-a.v.netRev).slice(0,2);
    out.push(['Revenue',
      `${RL(A.netRev)} of net revenue across ${A.days} days and ${N(A.orders)} orders (AOV ${R(A.aov)}).
       ${topLine(top,V)}`]);
  }

  /* profitability — the core mechanism */
  const mkPct=div(V.mktTot,V.netRev), gmPct=div(V.gmT,V.netRev);
  out.push(['Profitability',
    `Gross margin is ${PC(gmPct)} and CM1 ${PC(div(V.cm1T,V.netRev))}, so the product economics before marketing are healthy.
     Marketing then takes ${PC(mkPct)} of net revenue (${RL(V.mktTot)}), which turns that CM1 into a
     CM2 of ${RL(V.cm2T)} (${PC(V.cm2Pct)}) and, after ${RL(V.ohT)} of overhead, an EBITDA of
     ${RL(V.ebitdaT)} (${PC(V.ebitdaPct)}). ${V.cm2T<0?'The loss is an acquisition-cost problem, not a product-cost problem.':''}`]);

  /* month trajectory */
  const mm=MONTHS.filter(m=>MONTH_AGG[m].days>0);
  if(mm.length>1){
    const f=mm[0],l=mm[mm.length-1];
    out.push(['Trajectory',
      `Marketing intensity moved ${mm.map(m=>`${m} ${PC(MONTH_AGG[m].mktPct,0)}`).join(' → ')}.
       Between ${f} and ${l} spend changed ${PCS(g(MONTH_AGG[l].mkt,MONTH_AGG[f].mkt))} while net revenue changed
       ${PCS(g(MONTH_AGG[l].netRev,MONTH_AGG[f].netRev))}, taking modelled CM2 from ${RL(MONTH_AGG[f].cm2)} to ${RL(MONTH_AGG[l].cm2)}.`]);
  }

  /* price action */
  if(pids.length>1||true){
    const aj=PORT.aj, jl=PORT.jul, ag=PORT.aug;
    if(aj&&jl&&ag){
      out.push(['Pricing',
        `List prices were raised from 1 July: weighted MRP moved ${R(aj.mrp)} → ${R(jl.mrp)} → ${R(ag.mrp)}
         (${PCS(g(ag.mrp,aj.mrp))} against the Apr–Jun book) and discounting fell to ${PC(ag.discPct)} of MRP in August
         from ${PC(jl.discPct)} in July. Realised ASP ex-GST rose ${PCS(g(ag.nru,aj.nru))} to ${R(ag.nru)}.
         ${ag.cm2Pct<aj.cm2Pct?`CM2 % still worsened, from ${PC(aj.cm2Pct)} to ${PC(ag.cm2Pct)}, because CAC per unit rose
         ${PCS(g(ag.cac,aj.cac))} to ${R(ag.cac)} and shipping per unit rose ${PCS(g(ag.ship,aj.ship))} to ${R(ag.ship)} —
         together more than the whole price increase.`:''}`]);
    }
  }

  /* funnel */
  if(V.views){
    const lossV=V.views-V.atcN, lossA=V.atcN-V.purch;
    const worst=lossV>lossA?['product view → add to cart',lossV,V.v2a]:['add to cart → purchase',lossA,V.a2p];
    out.push(['Funnel',
      `Across ${N(V.views)} item views the site adds ${N(V.atcN)} to cart (${PC(V.v2a,1)}) and converts
       ${N(V.purch)} of those (${PC(V.a2p,1)}), an item view-to-purchase rate of ${PC(V.v2p,2)}.
       The largest single leak is <b>${worst[0]}</b>, losing ${N(worst[1])} shoppers at a ${PC(worst[2],1)} pass rate.`]);
  }
  if(A.atcDays){
    out.push(['Cart behaviour',
      `On the ${A.atcDays} days that record it, ${N(A.atc)} carts were created from ${N(A.trAtcDays)} sessions
       (${PC(A.atcRate,2)}) and ${N(A.ordAtcDays)} orders followed (${PC(A.atc2ord,1)} of carts).
       ${A.atc2ord>0.3?'Cart-to-order completion is not the constraint; getting shoppers into a cart at all is.':''}`]);
  }

  /* worst product */
  const worstP=rows.slice().sort((a,b)=>a.v.ebitdaT-b.v.ebitdaT)[0];
  if(worstP&&worstP.v.ebitdaT<0){
    const v=worstP.v;
    out.push(['Product',
      `${esc(worstP.p.name)} is the largest single destroyer: ${RL(v.netRev)} of net revenue on ${N(v.units)} units,
       CAC ${R(v.cac)} per unit against a CM1 of ${R(v.cm1)}, producing CM2 ${RL(v.cm2T)} and EBITDA ${RL(v.ebitdaT)}.`]);
  }
  /* best product */
  /* "best" must be material: a two-unit SKU with a tiny positive EBITDA is noise */
  const medRev=med(rows.map(x=>x.v.netRev))||0;
  const material=rows.filter(x=>x.v.netRev>=medRev&&x.v.units>=10);
  const bestP=(material.length?material:rows).slice().sort((a,b)=>b.v.ebitdaT-a.v.ebitdaT)[0];
  if(bestP&&bestP.v.ebitdaT>0){
    const v=bestP.v;
    out.push(['Opportunity',
      `${esc(bestP.p.name)} is the strongest: EBITDA ${RL(v.ebitdaT)} at ${PC(v.ebitdaPct)} of revenue on
       ${N(v.units)} units, with CAC ${R(v.cac)} against an EBITDA-break-even ceiling of ${R(v.maxCacTgt)} —
       ${R(v.cacGapTgt)} of headroom per unit to buy more volume. It is the strongest SKU with at least
       median revenue, so the ranking is not won by a handful of units.`]);
  }

  /* marketing action */
  const over=rows.filter(x=>x.v.units>0&&x.v.cac>x.v.maxCacTgt)
                 .sort((a,b)=>b.v.cacExcess-a.v.cacExcess);
  if(over.length){
    const top5=over.slice(0,5), rec=sum(top5,x=>x.v.cacExcess);
    out.push(['Action',
      `${over.length} SKUs are buying units above their EBITDA break-even CAC. Capping just the five largest
       (${top5.map(x=>esc(x.p.code)).join(', ')}) at that ceiling recovers ${RL(rec)} —
       ${PC(div(rec,Math.abs(V.ebitdaT)))} of the EBITDA loss in this view — before any volume is lost.`]);
  }
  /* shipping */
  const flip=rows.filter(x=>x.v.shipFlips);
  if(flip.length){
    out.push(['Shipping',
      `Shipping is ${R(V.ship)} per unit, ${PC(div(V.shipT,V.netRev))} of net revenue and
       ${PC(div(V.shipT,V.gmT))} of gross margin. On ${flip.length} SKUs it is the sole reason CM2 is negative —
       they are positive before shipping and negative after.`]);
  }

  const c=card(s,'What the numbers are saying','generated from the current view');
  const TONE={Revenue:'',Profitability:'r',Trajectory:'r',Pricing:'a',Funnel:'a',
    'Cart behaviour':'a',Product:'r',Opportunity:'g',Action:'g',Shipping:'a'};
  c.insertAdjacentHTML('beforeend',`<div class="insights">`+out.map(([k,v])=>
    `<div class="ins ${TONE[k]||''}"><h4>${esc(k)}</h4><p>${v}</p></div>`).join('')+`</div>`);
}

function topLine(top,V){
  if(!top.length) return '';
  if(top.length===1)
    return `${esc(top[0].p.code)} alone is ${PC(div(top[0].v.netRev,V.netRev))} of product revenue in this view.`;
  return `${esc(top[0].p.code)} and ${esc(top[1].p.code)} together are ${PC(div(top[0].v.netRev+top[1].v.netRev,V.netRev))} of product revenue in this view.`;
}

    `This is the one comparison built entirely from the three product P&L sheets, with no modelling at all.

    ['COGS',              id=>A[id].cogsT, RL, -1, false],
    ['Shipping to customer',id=>A[id].shipT, RL, -1, false],
    ['Packaging',         id=>A[id].packT, RL, -1, false],
    ['Payment + platform',id=>A[id].payT, RL, -1, false],
    ['Marketing spend',   id=>A[id].mktTot, RL, -1, false],
    ['Overhead charge',   id=>A[id].ohT, RL, -1, false],
    ['CM1',               id=>A[id].cm1T, RL, 1, false],
    ['CM2',               id=>A[id].cm2T, RL, 1, false],
    ['EBITDA',            id=>A[id].ebitdaT, RL, 1, false],
    ['— per unit —',      null, null, 0, false],
    ['MRP (unit-weighted)',id=>A[id].mrp, R, 1, true],
    ['Discount per unit', id=>A[id].disc, R, -1, true],
    ['Net revenue / unit',id=>A[id].nru, R, 1, true],
    ['COGS / unit',       id=>A[id].cogs, R, -1, true],
    ['Shipping / unit',   id=>A[id].ship, R, -1, true],
    ['Marketing / unit (CAC)',id=>A[id].cac, R, -1, true],
    ['Overhead / unit',   id=>A[id].oh, R, -1, true],
    ['CM1 / unit',        id=>A[id].cm1, R, 1, true],
    ['CM2 / unit',        id=>A[id].cm2, R, 1, true],
    ['EBITDA / unit',     id=>A[id].ebitda, R, 1, true],
    ['— ratios —',        null, null, 0, false],
    ['Discount % of MRP', id=>A[id].discPct, v=>PC(v), -1, true, true],
    ['Gross margin %',    id=>A[id].gmPct, v=>PC(v), 1, true, true],
    ['Shipping % of net revenue',id=>A[id].shipPctRev, v=>PC(v), -1, true, true],
    ['Marketing % of net revenue',id=>div(A[id].mktTot,A[id].netRev), v=>PC(v), -1, true, true],
    ['CM1 %',             id=>A[id].cm1Pct, v=>PC(v), 1, true, true],
    ['CM2 %',             id=>A[id].cm2Pct, v=>PC(v), 1, true, true],
    ['EBITDA %',          id=>A[id].ebitdaPct, v=>PC(v), 1, true, true],
    ['SKUs with sales',   id=>PROD.filter(p=>p.per[id]&&p.per[id].units>0).length, N, 1, true],
    ['SKUs with positive CM2',id=>PROD.filter(p=>p.per[id]&&p.per[id].units>0&&p.per[id].cm2>0).length, N, 1, true],
    ['SKUs with positive EBITDA',id=>PROD.filter(p=>p.per[id]&&p.per[id].units>0&&p.per[id].ebitda>0).length, N, 1, true]
  ];

  const c=card(s,'Period P&L','left three columns as reported · right three normalised to a monthly average');
  const cmp=(a,b,dir,pp)=>{
    if(a==null||b==null||!isFinite(a)||!isFinite(b)||b===0)return '—';
    if(pp){const d=a-b, flat=Math.abs(d)<0.0005;
      return `<span class="${flat?'flat':(d>0?dir:-dir)>0?'up':'down'}">${flat?'▬':(d>0?'▲':'▼')} ${flat?'0.0 pp':((d>=0?'+':'')+(d*100).toFixed(1)+' pp')}</span>`;}
    const gr=(a-b)/Math.abs(b), flat=Math.abs(gr)<0.0005;
    return `<span class="${flat?'flat':(gr>0?dir:-dir)>0?'up':'down'}">${flat?'▬':(gr>0?'▲':'▼')} ${flat?'0.0%':PCS(gr)}</span>`;
  };
  const html=`<div class="tblwrap"><table>
    <thead><tr><th class="l">Metric</th>

  note(c,`▲ / ▼ mark <b>better / worse</b>, not up / down — a cost rising shows ▼ even though the number is positive.

    already averages. Overhead per unit is a given allocation and changes by period (${R(A.aj.oh)} → ${R(A.jul.oh)} → ${R(A.aug.oh)}),

  const gr2=grid(s,'g2');

  gbarChart(c1,{labels:ids.map(i=>PMETA[i].short),w:520,h:260,yFmt:R,
    series:[{name:'Net revenue / unit',color:C.navy2,values:ids.map(i=>A[i].nru)},

            {name:'CAC / unit',color:C.amber,values:ids.map(i=>A[i].cac)},
            {name:'EBITDA / unit',color:C.red,values:ids.map(i=>A[i].ebitda)}]});
  const c2=card(gr2,'Margin ladder by period','share of net revenue');
  gbarChart(c2,{labels:ids.map(i=>PMETA[i].short),w:520,h:260,yFmt:v=>PC(v,0),
    series:[{name:'Gross margin %',color:C.green,values:ids.map(i=>A[i].gmPct)},
            {name:'CM1 %',color:C.navy2,values:ids.map(i=>A[i].cm1Pct)},
            {name:'CM2 %',color:C.teal,values:ids.map(i=>A[i].cm2Pct)},
            {name:'EBITDA %',color:C.red,values:ids.map(i=>A[i].ebitdaPct)}]});
}

/* ============================================================================
   S04. MONTHLY COMPARISON — Apr → Aug (daily sheets)
   ========================================================================== */
function renderMonthly(){
  const s=sec('s-month','04','April → August, month by month','Daily sheets · cost stack modelled',
    `Built from the five daily P&L sheets. GMV, the source net-sales column, marketing spend, orders,
     traffic and (from July) add-to-cart are actuals. Units and every cost line are modelled from the
     matching period's blended per-unit rates.`);
  const ms=MONTHS, A=Object.fromEntries(ms.map(m=>[m,MONTH_AGG[m]]));
  const g=(a,b,dir,pp)=>{
    if(a==null||b==null||!isFinite(a)||!isFinite(b)||b===0)return {t:'—',c:'flat',u:0};
    if(pp){const d=a-b,f=Math.abs(d)<0.0005;
      return {t:f?'0.0 pp':((d>=0?'+':'')+(d*100).toFixed(1)+' pp'),c:f?'flat':((d>0?dir:-dir)>0?'up':'down'),u:f?0:(d>0?1:-1)};}
    const r=(a-b)/Math.abs(b),f=Math.abs(r)<0.0005;
    return {t:f?'0.0%':PCS(r),c:f?'flat':((r>0?dir:-dir)>0?'up':'down'),u:f?0:(r>0?1:-1)};
  };
  const defs=[
    ['GMV / gross sales',m=>A[m].gmv,RL,1],
    ['Net sales (source column)',m=>A[m].netRevSrc,RL,1],
    ['Net revenue ex-GST (modelled)',m=>A[m].netRev,RL,1],
    ['Orders',m=>A[m].orders,N,1],

    ['Conversion rate',m=>A[m].cvr,v=>PC(v,2),1,true],
    ['AOV',m=>A[m].aov,R,1],

    ['Discount / promo %',m=>A[m].discPct,v=>PC(v),-1,true],

    ['CM1 (modelled)',m=>A[m].cm1,RL,1],
    ['CM2 (modelled)',m=>A[m].cm2,RL,1],
    ['CM2 %',m=>A[m].cm2Pct,v=>PC(v),1,true],
    ['EBITDA (modelled)',m=>A[m].ebitda,RL,1],
    ['EBITDA %',m=>A[m].ebitdaPct,v=>PC(v),1,true],
    ['Returning-customer share of orders',m=>A[m].rcr,v=>PC(v),0,true]
  ];
  const c=card(s,'Month-on-month','▲ / ▼ mean better / worse, not up / down');
  const head=`<thead><tr><th class="l">Metric</th>${ms.map(m=>`<th>${m}</th>`).join('')}
    <th>Jun→Jul</th><th>Jul→Aug</th><th>Apr→Aug</th></tr></thead>`;
  const body=defs.map(([lbl,fn,fmt,dir,pp])=>{

  note(c,`Add-to-cart is recorded only from July onward, so the two cart ratios read N/A for April–June.

  const gr=grid(s,'g3');

  mk3('Marketing spend','actual',[{name:'Spend',color:C.amber,values:ms.map(m=>A[m].mkt)}]);
  mk3('New-customer CAC','spend ÷ new-buyer orders',[{name:'CAC',color:C.red,values:ms.map(m=>A[m].cacNb)}],R);
  mk3('CM2 and EBITDA','modelled',[{name:'CM2',color:C.teal,values:ms.map(m=>A[m].cm2)},
                                   {name:'EBITDA',color:C.red,values:ms.map(m=>A[m].ebitda)}]);
  mk3('AOV','GMV ÷ orders',[{name:'AOV',color:C.navy2,values:ms.map(m=>A[m].aov)}],R);

    {name:'EBITDA %',color:C.red,values:ms.map(m=>A[m].ebitdaPct)}],v=>PC(v,0));
}

/* ============================================================================
   S05. DAILY P&L
   ========================================================================== */
function renderDaily(){
  const s=sec('s-daily','05','Daily P&L','153 days · Apr 1 – Aug 31',
    'Revenue, spend, orders, traffic and add-to-cart are actuals; the cost stack is modelled per day.');
  const rows=timeRows();
  if(!rows.length){naBox(s,'No days fall inside the selected range.','Widen the custom date range.');return;}
  const A=aggDays(rows);
  const ma=(arr,k,n)=>arr.map((_,i)=>{const w=arr.slice(Math.max(0,i-n+1),i+1).map(x=>x[k]).filter(x=>x!=null&&isFinite(x));
    return w.length?w.reduce((a,b)=>a+b,0)/w.length:null;});

  const gr=grid(s,'g2');
  const labels=rows.map(d=>d.d.slice(5));
  const mkc=(t,sub,ser,fmt)=>{const c=card(gr,t,sub);
    lineChart(c,{labels,w:560,h:230,maxLabels:14,yFmt:fmt||RL,series:ser});return c;};
  mkc('Daily net revenue','modelled, with 7-day average',[
    {name:'Net revenue',color:C.navy2,values:rows.map(d=>d.netRev)},
    {name:'7-day average',color:C.slate,dash:'4 3',values:ma(rows,'netRev',7)}]);
  mkc('Daily orders','actual',[
    {name:'Orders',color:C.navy,values:rows.map(d=>d.orders)},
    {name:'7-day average',color:C.slate,dash:'4 3',values:ma(rows,'orders',7)}],N);
  mkc('Daily sessions','actual',[{name:'Sessions',color:C.lav,values:rows.map(d=>d.traff)},
    {name:'7-day average',color:C.slate,dash:'4 3',values:ma(rows,'traff',7)}],N);
  mkc('Daily conversion rate','orders ÷ sessions',[{name:'CVR',color:C.teal,values:rows.map(d=>d.cvr)}],v=>PC(v,1));
  mkc('Daily marketing spend','actual',[{name:'Spend',color:C.amber,values:rows.map(d=>d.mkt)},
    {name:'7-day average',color:C.slate,dash:'4 3',values:ma(rows,'mkt',7)}]);
  mkc('Daily CM2 and EBITDA','modelled',[{name:'CM2',color:C.teal,values:rows.map(d=>d.cm2)},
    {name:'EBITDA',color:C.red,values:rows.map(d=>d.ebitda)}]);
  mkc('Daily CAC','spend ÷ new-buyer orders',[{name:'New-customer CAC',color:C.red,values:rows.map(d=>d.cacNb)}],R);
  if(rows.some(d=>d.atc!=null))
    mkc('Daily add to cart','actual, July onward',[{name:'ATC',color:C.navy2,values:rows.map(d=>d.atc)}],N);

  /* best and worst days */
  const scored=rows.filter(d=>d.ebitda!=null).slice().sort((a,b)=>b.ebitda-a.ebitda);
  if(scored.length>2){
    const g2=grid(s,'g2');
    const mkList=(host,list,title,sub)=>{
      const c=card(host,title,sub);
      c.insertAdjacentHTML('beforeend',`<div class="tblwrap"><table><thead><tr>
        <th class="l">Date</th><th class="l">Event</th><th>Net revenue</th><th>Orders</th><th>Spend</th>
        <th>Mktg % rev</th><th>EBITDA</th><th class="l">Why</th></tr></thead><tbody>`+
        list.map(d=>{
          const why = d.mktPct==null?'—'
            : d.mktPct<0.45 ? 'spend held at '+PC(d.mktPct,0)+' of revenue'
            : d.mktPct>1 ? 'spend exceeded revenue ('+PC(d.mktPct,0)+')'
            : d.mktPct>0.8 ? 'spend '+PC(d.mktPct,0)+' of revenue'
            : (d.cvr!=null&&d.cvr<0.01?'conversion only '+PC(d.cvr,2):'spend '+PC(d.mktPct,0)+' of revenue');
          return `<tr><td class="l">${d.d}</td><td class="l">${esc(d.event||'—')}</td>
            <td>${RL(d.netRev)}</td><td>${N(d.orders)}</td><td>${RL(d.mkt)}</td>
            <td>${PC(d.mktPct,0)}</td><td class="${d.ebitda<0?'neg':''}">${RL(d.ebitda)}</td>
            <td class="l">${esc(why)}</td></tr>`;}).join('')+`</tbody></table></div>`);
    };
    mkList(g2,scored.slice(0,8),'Best P&L days','ranked by modelled EBITDA');
    mkList(g2,scored.slice(-8).reverse(),'Worst P&L days','ranked by modelled EBITDA');
    /* outliers */
    const vals=rows.map(d=>d.netRev).filter(isFinite);
    const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
    const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
    const out=rows.filter(d=>isFinite(d.netRev)&&Math.abs(d.netRev-mean)>2*sd);
    note(s,`Outlier detection: mean daily net revenue ${RL(mean)}, standard deviation ${RL(sd)}.
      ${out.length?`${out.length} day${out.length===1?'':'s'} sit more than two standard deviations away — ${out.map(d=>d.d+' ('+RL(d.netRev)+')').join(', ')}.`:'No day sits more than two standard deviations from the mean.'}`);
  }

  const cols=[
    {h:'Date',k:'d',l:1},{h:'Day',k:'day',l:1},{h:'Event',k:'event',l:1},
    {h:'GMV',k:'gmv',f:F.rl},{h:'Net sales (src)',k:'netRevSrc',f:F.rl},
    {h:'Net rev (model)',k:'netRev',f:F.rl},
    {h:'Orders',k:'orders',f:F.n},{h:'Units (model)',k:'units',f:F.n},
    {h:'Sessions',k:'traff',f:F.n},{h:'ATC',k:'atc',f:v=>v==null?'—':N(v)},
    {h:'CVR',k:'cvr',f:F.p2},{h:'AOV',k:'aov',f:F.r},
    {h:'Promo %',k:'promo',f:F.p},{h:'COGS',k:'cogs',f:F.rl},{h:'Shipping',k:'ship',f:F.rl},
    {h:'Marketing',k:'mkt',f:F.rl},{h:'Mktg % rev',k:'mktPct',f:F.p},
    {h:'CM1',k:'cm1',f:F.rl,neg:1},{h:'CM2',k:'cm2',f:F.rl,neg:1},
    {h:'EBITDA',k:'ebitda',f:F.rl,neg:1},{h:'CM2 %',k:'cm2Pct',f:F.p,neg:1},
    {h:'EBITDA %',k:'ebitdaPct',f:F.p,neg:1}
  ];
  const c=card(s,'Daily table','sortable · searchable · exports to CSV');
  table(c,cols,rows,{sort:0,desc:false,name:'daily_pnl',maxH:'560px',
    total:d=>{const T=aggDays(d);
      return `<tr class="tot"><td class="l">Total</td><td class="l">${d.length} days</td><td class="l"></td>
       <td>${RL(T.gmv)}</td><td>${RL(T.netRevSrc)}</td><td>${RL(T.netRev)}</td><td>${N(T.orders)}</td>
       <td>${N(T.units)}</td><td>${N(T.traff)}</td><td>${T.atcDays?N(T.atc):'—'}</td><td>${PC(T.cvr,2)}</td>
       <td>${R(T.aov)}</td><td>${PC(T.discPct)}</td><td>${RL(T.cogs)}</td><td>${RL(T.ship)}</td>
       <td>${RL(T.mkt)}</td><td>${PC(T.mktPct)}</td><td class="${T.cm1<0?'neg':''}">${RL(T.cm1)}</td>
       <td class="${T.cm2<0?'neg':''}">${RL(T.cm2)}</td><td class="${T.ebitda<0?'neg':''}">${RL(T.ebitda)}</td>
       <td class="${T.cm2Pct<0?'neg':''}">${PC(T.cm2Pct)}</td><td class="${T.ebitdaPct<0?'neg':''}">${PC(T.ebitdaPct)}</td></tr>`;}});
  if(A.mktDays<A.days)
    note(c,`Marketing spend is blank on ${A.days-A.mktDays} of ${A.days} days in this window; those days are
      excluded from spend totals and their CM2 and EBITDA are left out of the aggregate rather than assumed to be zero.`);
}

/* ============================================================================
   S06. WEBSITE FULL FUNNEL — OVERALL
   ========================================================================== */
function renderFunnel(){
  const s=sec('s-funnel','06','Website full funnel','Overall',
    'Two funnels are shown because the source carries two independent measurements: a session-level funnel from the daily sheets and an item-level funnel from the Ads sheets.');
  const rows=timeRows(), A=aggDays(rows);
  const pids=timePids(), V=aggProducts(fpv());

  const gr=grid(s,'g2');

  /* --- session funnel (daily sheets) --- */
  const c1=card(gr,'Session funnel','daily sheets · actual');
  const st1=[{name:'Sessions',v:A.traff},
             {name:'Add to cart',v:A.atcDays?A.atc:null,na:!A.atcDays},
             {name:'Checkout initiated',v:null,na:true},
             {name:'Orders',v:A.orders},
             {name:'Units (modelled)',v:Math.round(A.units)}];
  funnelChart(c1,st1,520);
  note(c1,`Session → order ${PC(A.cvr,2)}.
    ${A.atcDays?`Session → cart ${PC(A.atcRate,2)} and cart → order ${PC(A.atc2ord,1)}, measured on the ${A.atcDays} days that record add-to-cart.`
      :'Add-to-cart is not recorded in this window — the daily sheets only carry it from July.'}
    A checkout-initiated stage does not exist in any sheet, so that step cannot be measured or estimated.`);

  /* --- item funnel (ads sheets) --- */
  const c2=card(gr,'Item funnel','Ads sheets · '+esc(pidsLabel()));
  const st2=[{name:'Items viewed',v:V.views},{name:'Items added to cart',v:V.atcN},
             {name:'Checkout initiated',v:null,na:true},{name:'Items purchased',v:V.purch}];
  funnelChart(c2,st2,520);
  note(c2,`View → cart ${PC(V.v2a,1)}, cart → purchase ${PC(V.a2p,1)}, view → purchase ${PC(V.v2p,2)}.
    Views count each item a shopper looks at, so they exceed sessions — one visit can view several items.
    That is an expansion between two different units of measurement, not a leak, and it is excluded from the leakage figures below.`);

  /* --- leakage --- */
  const leaks=[];
  if(V.views) leaks.push({l:'Item view → add to cart',lost:V.views-V.atcN,pass:V.v2a});
  if(V.atcN)  leaks.push({l:'Add to cart → purchase',lost:V.atcN-V.purch,pass:V.a2p});
  if(A.atcDays){
    leaks.push({l:'Session → add to cart (daily)',lost:A.traff-A.atc,pass:A.atcRate});
    leaks.push({l:'Add to cart → order (daily)',lost:A.atc-A.orders,pass:A.atc2ord});
  } else if(A.traff) leaks.push({l:'Session → order (daily)',lost:A.traff-A.orders,pass:A.cvr});
  const c3=card(s,'Funnel leakage','shoppers lost at each measurable step');
  hbarChart(c3,{rows:leaks.map(x=>({l:x.l,v:x.lost,tip:'pass rate '+PC(x.pass,2)})),w:760,padL:210,fmt:N});
  const worst=leaks.slice().sort((a,b)=>b.lost-a.lost)[0];
  if(worst) note(c3,`The largest measurable leak is <b>${esc(worst.l)}</b>: ${N(worst.lost)} shoppers lost at a
    ${PC(worst.pass,2)} pass rate. ${worst.l.indexOf('view')===0?'The product page, not the cart, is where the funnel is losing people.':''}`);

  /* --- efficiency --- */
  const G=kpiGrid(s);
  kpi(G,'Revenue per session',A.traff?R(div(A.netRev,A.traff)):'—','modelled net revenue ÷ traffic','d-n');
  kpi(G,'Revenue per item view',V.views?R(div(V.netRev,V.views)):'—','product net revenue ÷ items viewed','d-n');
  kpi(G,'Marketing per session',A.traff?R(div(A.mkt,A.traff)):'—','spend ÷ traffic','d-n');
  kpi(G,'Contribution per session',A.traff?R(div(A.cm2,A.traff)):'—','CM2 ÷ traffic',A.cm2<0?'d-r':'d-g');
  sessNote(s);
}

/* ============================================================================
   S07. PRODUCT-WISE FUNNEL
   ========================================================================== */
function renderProdFunnel(){
  const s=sec('s-pfunnel','07','Product-wise funnel','Item level · views → cart → purchase',
    'Built on items viewed, items added to cart and items purchased — the three item-level measures that genuinely vary by SKU.');
  pidNote(s); sessNote(s);
  const rows=fpv().filter(x=>x.v.hasAds);
  if(!rows.length){naBox(s,'No SKU in the current filter has item-level ads data.','Clear the filters or widen the timeline.');return;}
  const M=medians(timePids());

  const cols=[
    {h:'SKU',k:'code',l:1,v:r=>r.p.code},
    {h:'Product',l:1,v:r=>r.p.name},
    {h:'Category',l:1,v:r=>r.p.cat},
    {h:'Items viewed',v:r=>r.v.views,f:F.n},
    {h:'Added to cart',v:r=>r.v.atcN,f:F.n},
    {h:'Checkout',v:()=>null,f:()=>'<span style="color:var(--ink3)">N/A</span>'},
    {h:'Purchased',v:r=>r.v.purch,f:F.n},
    {h:'Units (P&L)',v:r=>r.v.units,f:F.n},
    {h:'Net revenue',v:r=>r.v.netRev,f:F.rl},
    {h:'View → cart',v:r=>r.v.v2a,f:F.p},
    {h:'Cart → purchase',v:r=>r.v.a2p,f:F.p},
    {h:'View → purchase',v:r=>r.v.v2p,f:F.p2},
    {h:'Revenue / view',v:r=>r.v.revPerView,f:F.r},
    {h:'Ad spend',v:r=>r.v.mktTot,f:F.rl},
    {h:'View rank',v:r=>r._rv,f:F.n},
    {h:'Revenue rank',v:r=>r._rr,f:F.n},
    {h:'Conv. rank',v:r=>r._rc,f:F.n},
    {h:'Quadrant',v:r=>r.p.quad,f:F.pill(PILL_QUAD),l:1}
  ];
  const rk=(arr,f)=>{const o=arr.slice().sort((a,b)=>(f(b)??-1e18)-(f(a)??-1e18));
    o.forEach((r,i)=>r._t=i+1); return new Map(o.map(r=>[r,r._t]));};
  const mV=rk(rows,r=>r.v.views), mR=rk(rows,r=>r.v.netRev), mC=rk(rows,r=>r.v.v2p);
  rows.forEach(r=>{r._rv=mV.get(r);r._rr=mR.get(r);r._rc=mC.get(r);});
  const c=card(s,'Product funnel table','sortable · searchable · exports to CSV');
  table(c,cols,rows,{sort:3,name:'product_funnel',maxH:'560px'});

  const c2=card(s,'Items viewed against view-to-purchase rate','bubble size = units sold · quadrant split at the medians');
  scatter(c2,{w:860,h:440,xFmt:N,yFmt:v=>PC(v,1),xMin:0,yMin:0,
    xLabel:'Items viewed',yLabel:'View → purchase %',
    qx:M.views,qy:M.v2p,
    quadLabels:[{t:'INCREASE TRAFFIC',ax:'l',ay:'t'},{t:'SCALE',ax:'r',ay:'t'},
                {t:'REVIEW / DEPRIORITISE',ax:'l',ay:'b'},{t:'FIX CONVERSION',ax:'r',ay:'b'}],
    points:rows.map(r=>({x:r.v.views,y:r.v.v2p??0,r:Math.max(r.v.units,1),
      c:MATRIX_C[r.p.quad]||C.slate,label:r.p.code,show:r.v.views>=M.views*1.6||r.v.netRev>=M.rev*2,
      tip:`<b>${esc(r.p.name)}</b><br>${N(r.v.views)} views · ${PC(r.v.v2p,2)} view→purchase<br>
        ${N(r.v.units)} units · ${RL(r.v.netRev)} net revenue<br>CAC ${R(r.v.cac)} · CM2 ${PC(r.v.cm2Pct)}<br>
        <b>${esc(r.p.quad)}</b>`}))});
  note(c2,`Quadrants split at the median of ${N(M.views)} items viewed and a ${PC(M.v2p,2)} view-to-purchase rate.
    <b>Scale</b> = high views and high conversion · <b>Fix conversion</b> = high views, low conversion ·
    <b>Increase traffic</b> = low views, high conversion · <b>Review / deprioritise</b> = low on both.`);

  const counts={};
  rows.forEach(r=>counts[r.p.quad]=(counts[r.p.quad]||0)+1);
  const c3=card(s,'Quadrant summary','net revenue and CM2 by quadrant');
  const qs=['Scale','Fix conversion','Increase traffic','Review / deprioritise'];
  table(c3,[
    {h:'Quadrant',k:'q',l:1,f:F.pill(PILL_QUAD)},
    {h:'SKUs',k:'n',f:F.n},{h:'Items viewed',k:'views',f:F.n},{h:'Units',k:'units',f:F.n},
    {h:'Net revenue',k:'rev',f:F.rl},{h:'Ad spend',k:'mkt',f:F.rl},
    {h:'CM2',k:'cm2',f:F.rl,neg:1},{h:'EBITDA',k:'eb',f:F.rl,neg:1},
    {h:'View → purchase',k:'v2p',f:F.p2}],
    qs.map(q=>{const g2=rows.filter(r=>r.p.quad===q),a=aggProducts(g2);
      return {q,n:g2.length,views:a.views,units:a.units,rev:a.netRev,mkt:a.mktTot,
              cm2:a.cm2T,eb:a.ebitdaT,v2p:a.v2p};}).filter(r=>r.n),
    {search:false,sort:4,name:'funnel_quadrants'});

  /* unmapped ads rows */
  const um=[].concat(...timePids().map(id=>(UNMAP[id]||[]).map(r=>({...r,per:PMETA[id].short}))));
  if(um.length){
    const c4=card(s,'Ads rows with no product P&L row',
      'real spend and views that cannot be joined to a SKU — shown rather than dropped');
    table(c4,[{h:'Period',k:'per',l:1},{h:'Item name',k:'name',l:1},{h:'Views',k:'views',f:F.n},
      {h:'Added to cart',k:'atc',f:F.n},{h:'Purchased',k:'purch',f:F.n},
      {h:'Item revenue',k:'itemRev',f:F.rl},{h:'Spend',k:'spend',f:F.rl}],
      um,{sort:6,name:'unmapped_ads'});
    const tot=um.reduce((a,r)=>({s:a.s+r.spend,v:a.v+r.views,p:a.p+r.purch}),{s:0,v:0,p:0});
    note(c4,`${um.length} rows carrying ${RL(tot.s)} of spend and ${N(tot.v)} views sit outside the product P&L —
      gift cards, digital products, pack variants and duplicate escaped-entity names. They are excluded from
      every per-SKU figure in this dashboard and listed here so the gap is visible rather than silently absorbed.`);
  }
}
const MATRIX_C={'Scale':C.green,'Fix conversion':C.amber,'Increase traffic':C.navy2,
  'Review / deprioritise':C.red,'No traffic data':C.slate,
  'Star':C.green,'Profit niche':C.navy2,'Revenue trap':C.amber,'Dog':C.red};

/* ============================================================================
   S08. CATEGORY PERFORMANCE
   ========================================================================== */
function renderCategory(){
  const s=sec('s-cat','08','Category performance','Category and sub-category');
  pidNote(s);
  const rows=fpv();
  const byKey=(keyf,label)=>{
    const m={};
    rows.forEach(r=>{const k=keyf(r)||'—';(m[k]=m[k]||[]).push(r);});
    return Object.entries(m).map(([k,list])=>{
      const a=aggProducts(list);
      return {k,n:list.length,...a,rev:a.netRev,cm2:a.cm2T,eb:a.ebitdaT,mkt:a.mktTot,
              ship:a.shipT,cogs:a.cogsT,disc:a.totalDisc};
    }).sort((a,b)=>b.rev-a.rev);
  };
  const cats=byKey(r=>r.p.cat), subs=byKey(r=>r.p.sub);
  const cols=lab=>[
    {h:lab,k:'k',l:1},{h:'SKUs',k:'n',f:F.n},
    {h:'Items viewed',k:'views',f:F.n},{h:'Added to cart',k:'atcN',f:F.n},
    {h:'Purchased',k:'purch',f:F.n},{h:'Units',k:'units',f:F.n},
    {h:'GMV',k:'gmv',f:F.rl},{h:'Net revenue',k:'rev',f:F.rl},
    {h:'ASP',k:'nru',f:F.r},{h:'View → purchase',k:'v2p',f:F.p2},
    {h:'Discount %',k:'discPct',f:F.p},
    {h:'COGS',k:'cogs',f:F.rl},{h:'Shipping',k:'ship',f:F.rl},
    {h:'Marketing',k:'mkt',f:F.rl},{h:'CAC / unit',k:'cac',f:F.r},
    {h:'CM2',k:'cm2',f:F.rl,neg:1},{h:'CM2 %',k:'cm2Pct',f:F.p,neg:1},
    {h:'EBITDA',k:'eb',f:F.rl,neg:1},{h:'EBITDA %',k:'ebitdaPct',f:F.p,neg:1}];
  const c1=card(s,'By category',''); table(c1,cols('Category'),cats,{sort:7,name:'categories'});
  const c2=card(s,'By sub-category',''); table(c2,cols('Sub-category'),subs,{sort:7,name:'subcategories'});

  const gr=grid(s,'g3');
  const k1=card(gr,'Category net revenue','ranked');
  hbarChart(k1,{rows:cats.slice(0,12).map(r=>({l:r.k,v:r.rev})),w:420,padL:130});
  const k2=card(gr,'Category CM2','ranked');
  hbarChart(k2,{rows:cats.slice().sort((a,b)=>b.cm2-a.cm2).slice(0,12).map(r=>({l:r.k,v:r.cm2})),w:420,padL:130});
  const k3=card(gr,'Category EBITDA','ranked');
  hbarChart(k3,{rows:cats.slice().sort((a,b)=>b.eb-a.eb).slice(0,12).map(r=>({l:r.k,v:r.eb})),w:420,padL:130});

  /* category growth matrix — now possible across Jul vs Aug */
  const c4=card(s,'Category growth matrix','July → August revenue growth against August CM2 %');
  const cats2={};
  PROD.forEach(p=>{const k=p.cat||'—';(cats2[k]=cats2[k]||[]).push(p);});
  const pts=Object.entries(cats2).map(([k,list])=>{
    const j=aggRec(list.map(p=>p.per.jul).filter(Boolean));
    const g2=aggRec(list.map(p=>p.per.aug).filter(Boolean));
    if(!j.netRev&&!g2.netRev)return null;
    const gr2=j.netRev?(g2.netRev-j.netRev)/Math.abs(j.netRev):null;
    if(gr2==null)return null;
    const cls2 = gr2>=0 ? (g2.cm2Pct>0?'Scale':'Fix economics') : (g2.cm2Pct>0?'Defend':'Review');
    return {k,x:gr2,y:g2.cm2Pct,u:g2.units,rev:g2.netRev,cls:cls2};
  }).filter(Boolean);
  const GC={'Scale':C.green,'Fix economics':C.amber,'Defend':C.navy2,'Review':C.red};
  scatter(c4,{w:860,h:420,xFmt:v=>PCS(v,0),yFmt:v=>PC(v,0),qx:0,qy:0,
    xLabel:'Jul → Aug net revenue growth',yLabel:'August CM2 %',
    quadLabels:[{t:'DEFEND',ax:'l',ay:'t'},{t:'SCALE',ax:'r',ay:'t'},
                {t:'REVIEW',ax:'l',ay:'b'},{t:'FIX ECONOMICS',ax:'r',ay:'b'}],
    points:pts.map(p=>({x:clamp(p.x,-1,2),y:p.y,r:Math.max(p.u,1),c:GC[p.cls],label:p.k,show:true,
      tip:`<b>${esc(p.k)}</b><br>growth ${PCS(p.x)} · CM2 ${PC(p.y)}<br>${N(p.u)} units · ${RL(p.rev)}<br><b>${p.cls}</b>`}))});
  note(c4,`Growth + profit = <b>scale</b> · growth + loss = <b>fix economics</b> ·
    declining + profit = <b>defend</b> · declining + loss = <b>review</b>.
    Growth is clipped to the −100% … +200% band for readability; the tooltip carries the true value.
    This matrix uses July and August only, the two periods for which a genuine month-on-month
    product split exists — the Apr–Jun sheet is a single three-month block and cannot be divided.`);
  const c5=card(s,'Category growth classification','July → August');
  table(c5,[{h:'Category',k:'k',l:1},{h:'Jul → Aug growth',k:'x',f:F.ps},
    {h:'Aug CM2 %',k:'y',f:F.p,neg:1},{h:'Aug units',k:'u',f:F.n},
    {h:'Aug net revenue',k:'rev',f:F.rl},{h:'Classification',k:'cls',l:1,
      f:v=>`<span class="pill ${v==='Scale'?'p-g':v==='Defend'?'p-g':v==='Fix economics'?'p-a':'p-r'}">${esc(v)}</span>`}],
    pts,{search:false,sort:4,name:'category_growth'});
}

/* ============================================================================

function renderMatrix(){
  const s=sec('s-matrix','10','CM2 portfolio matrix','Revenue against CM2 %');
  pidNote(s);
  const rows=fpv().filter(r=>r.v.units>0);
  const M=medians(timePids());
  /* cap the revenue axis near the 90th percentile when one SKU sits far enough out
     to squash the rest of the portfolio into a sliver of the chart; the outlier
     still shows (dashed bubble outline) with its true value in the tooltip */
  const revsSorted=rows.map(r=>r.v.netRev).filter(isFinite).sort((a,b)=>a-b);
  const pctl=(arr,p)=>arr.length?arr[clamp(Math.round(p*(arr.length-1)),0,arr.length-1)]:0;
  const p90=pctl(revsSorted,0.90), maxRev=revsSorted[revsSorted.length-1]||0;
  const xCap=(p90>0&&maxRev>p90*1.8)?Math.round(p90*1.25):undefined;
  const c=card(s,'Product portfolio','x = net revenue · y = CM2 % · bubble = units sold');
  scatter(c,{w:900,h:470,xFmt:RL,yFmt:v=>PC(v,0),qx:M.rev,qy:0,xMax:xCap,
    xLabel:'Net revenue (₹)',yLabel:'CM2 %',
    quadLabels:[{t:'PROFIT NICHE',ax:'l',ay:'t'},{t:'STAR',ax:'r',ay:'t'},
                {t:'DOG',ax:'l',ay:'b'},{t:'REVENUE TRAP',ax:'r',ay:'b'}],
    points:rows.map(r=>({x:r.v.netRev,y:clamp(r.v.cm2Pct??0,-2,1),r:Math.max(r.v.units,1),
      c:MATRIX_C[r.p.matrix],label:r.p.code,
      show:r.v.netRev>=M.rev*1.5||Math.abs(r.v.cm2T)>Math.abs(PORT.all.cm2T)*0.04,
      tip:`<b>${esc(r.p.name)}</b><br>${RL(r.v.netRev)} net revenue · ${N(r.v.units)} units<br>
        CM2 ${RL(r.v.cm2T)} (${PC(r.v.cm2Pct)}) · EBITDA ${RL(r.v.ebitdaT)}<br>
        CAC ${R(r.v.cac)} vs break-even ${R(r.v.maxCacBE)}<br><b>${esc(r.p.matrix)}</b>`}))});
  note(c,`Split at the median net revenue of ${RL(M.rev)} and a CM2 of zero.
    CM2 % is clipped to the −200% … +100% band so one extreme SKU cannot flatten the chart; tooltips carry the true value.
    ${xCap?`Net revenue is capped near the 90th percentile (${RL(xCap)}); the SKU(s) beyond it show as dashed bubbles pinned to the edge — hover for the true figure.`:''}
    Labels are shown only for the largest or most consequential SKUs to avoid overlap; every bubble has a tooltip.
    <b>Star</b> = scale · <b>Profit niche</b> = buy more traffic · <b>Revenue trap</b> = fix the economics now ·
    <b>Dog</b> = reprice, bundle or retire.`);

  const quads=['Star','Profit niche','Revenue trap','Dog'];
  const c2=card(s,'Quadrant summary','');
  table(c2,[{h:'Quadrant',k:'q',l:1,f:F.pill(PILL_MATRIX)},{h:'SKUs',k:'n',f:F.n},
    {h:'Units',k:'units',f:F.n},{h:'Net revenue',k:'rev',f:F.rl},

    {h:'CM2',k:'cm2',f:F.rl,neg:1},{h:'CM2 %',k:'cm2Pct',f:F.p,neg:1},
    {h:'EBITDA',k:'eb',f:F.rl,neg:1},{h:'Action',k:'act',l:1}],
    quads.map(q=>{const g2=rows.filter(r=>r.p.matrix===q),a=aggProducts(g2);
      return {q,n:g2.length,units:a.units,rev:a.netRev,sh:div(a.netRev,aggProducts(rows).netRev),
        mkt:a.mktTot,cm2:a.cm2T,cm2Pct:a.cm2Pct,eb:a.ebitdaT,
        act:{'Star':'Scale aggressively','Profit niche':'Increase traffic and visibility',
             'Revenue trap':'Fix economics immediately','Dog':'Review, reprice, bundle or discontinue'}[q]};})
      .filter(r=>r.n),{search:false,sort:3,name:'matrix_quadrants'});

  const c3=card(s,'Products by quadrant','');

/* ============================================================================
   S11. EBITDA CONTRIBUTION AND PARETO
   ========================================================================== */
function renderEbitda(){
  const s=sec('s-ebitda','11','EBITDA product analysis','Contributors, loss makers and the Pareto');
  pidNote(s);
  const rows=fpv().filter(r=>r.v.units>0);
  const A=aggProducts(rows);
  const pos=rows.filter(r=>r.v.ebitdaT>0).sort((a,b)=>b.v.ebitdaT-a.v.ebitdaT);
  const neg=rows.filter(r=>r.v.ebitdaT<0).sort((a,b)=>a.v.ebitdaT-b.v.ebitdaT);
  const totPos=sum(pos,r=>r.v.ebitdaT), totNeg=sum(neg,r=>r.v.ebitdaT);

  const G=kpiGrid(s);
  kpi(G,'Portfolio EBITDA',RL(A.ebitdaT),PC(A.ebitdaPct)+' of net revenue',A.ebitdaT<0?'d-r':'d-g');
  kpi(G,'EBITDA created',RL(totPos),`${pos.length} SKUs`,'d-g');
  kpi(G,'EBITDA destroyed',RL(totNeg),`${neg.length} SKUs`,'d-r');
  kpi(G,'Destroyed ÷ created',totPos?N1(Math.abs(totNeg)/totPos)+'×':'—','loss per rupee of profit','d-r');

  const gr=grid(s,'g2');
  const c1=card(gr,'Top EBITDA contributors','');
  table(c1,[{h:'SKU',v:r=>r.p.code,l:1},{h:'Net revenue',v:r=>r.v.netRev,f:F.rl},
    {h:'EBITDA',v:r=>r.v.ebitdaT,f:F.rl},{h:'EBITDA %',v:r=>r.v.ebitdaPct,f:F.p},
    {h:'Share of EBITDA created',v:r=>div(r.v.ebitdaT,totPos),f:F.p}],
    pos.slice(0,15),{search:false,sort:2,name:'ebitda_top'});
  const c2=card(gr,'EBITDA loss makers','with the dominant reason');
  table(c2,[{h:'SKU',v:r=>r.p.code,l:1},{h:'Net revenue',v:r=>r.v.netRev,f:F.rl},
    {h:'EBITDA loss',v:r=>r.v.ebitdaT,f:F.rl,neg:1},{h:'EBITDA %',v:r=>r.v.ebitdaPct,f:F.p,neg:1},
    {h:'Share of loss',v:r=>div(r.v.ebitdaT,totNeg),f:F.p},
    {h:'Main reason',v:r=>lossReason(r.v),l:1}],
    neg.slice(0,20),{search:false,sort:2,desc:false,name:'ebitda_loss'});

  /* Pareto */
  const sorted=rows.slice().sort((a,b)=>b.v.ebitdaT-a.v.ebitdaT);
  const c3=card(s,'EBITDA Pareto','every SKU ranked, with cumulative EBITDA');
  let run=0; const cum=sorted.map(r=>{run+=r.v.ebitdaT;return div(run,A.ebitdaT);});
  pareto(c3,{bars:sorted.map(r=>r.v.ebitdaT),cum,labels:sorted.map(r=>r.p.code),w:940,h:330,
    tips:sorted.map(r=>`<b>${esc(r.p.name)}</b><br>EBITDA ${RL(r.v.ebitdaT)} · ${PC(r.v.ebitdaPct)}<br>${RL(r.v.netRev)} revenue`)});
  const n80=cum.findIndex(v=>v>=0.8)+1;
  note(c3,`${pos.length} SKUs create ${RL(totPos)} of EBITDA while ${neg.length} destroy ${RL(Math.abs(totNeg))}.
    ${A.ebitdaT<0?`Because the portfolio total is negative, the cumulative line runs the other way: the loss makers
    dominate the curve. The ten worst alone account for ${PC(div(sum(neg.slice(0,10),r=>r.v.ebitdaT),totNeg))} of all EBITDA destroyed.`
    :`The first ${n80} SKUs deliver 80% of EBITDA.`}`);
}
function lossReason(v){
  const c=[];
  if(v.cac>v.maxCacBE) c.push(['CAC above CM1',v.cac-v.maxCacBE]);
  if(v.cm1<=0)         c.push(['negative CM1 before marketing',Math.abs(v.cm1)]);
  if(v.shipFlips)      c.push(['shipping flips CM2 negative',v.ship]);
  if(v.shipPctRev>0.25)c.push(['shipping '+PC(v.shipPctRev,0)+' of revenue',v.ship]);
  if(v.discPct>0.2)    c.push(['discount '+PC(v.discPct,0)+' of MRP',v.disc]);
  if(v.cm2>0&&v.ebitda<0)c.push(['volume too low to cover overhead',v.oh]);
  if(!c.length)        c.push(['overhead charge of '+R(v.oh)+' per unit',v.oh]);
  c.sort((a,b)=>b[1]-a[1]);
  return c[0][0];
}

    .map(r=>({l:r.p.code,v:r.v.shipPctRev,tip:R1(r.v.ship)+' per unit on '+R(r.v.nru)+' ASP'})),
    w:460,padL:130,fmt:v=>PC(v)});
  const c2=card(gr,'Largest shipping spend','total ₹ by SKU');
  hbarChart(c2,{rows:rows.slice().sort((a,b)=>b.v.shipT-a.v.shipT).slice(0,15)
    .map(r=>({l:r.p.code,v:r.v.shipT,tip:N(r.v.units)+' units at '+R1(r.v.ship)})),w:460,padL:130});

  if(flips.length){
    note(s,`On ${flips.length} SKUs shipping is the sole reason CM2 is negative: ${flips.slice(0,6).map(r=>
      `${esc(r.p.code)} (${R1(r.v.ship)} per unit on a ${R(r.v.nru)} ASP)`).join(', ')}${flips.length>6?` and ${flips.length-6} more`:''}.
      Recovering them needs one of: a price rise of at least the shipping gap, a bundle that spreads one delivery across
      more units, a minimum-order threshold, smaller packaging, or a courier-zone renegotiation.`);
  }
  const persp=PIDS.map(id=>({id,a:PORT[id]}));
  const c3=card(s,'Shipping per unit by period','has delivery cost been drifting?');
  gbarChart(c3,{labels:persp.map(p=>PMETA[p.id].short),w:520,h:230,yFmt:R,
    series:[{name:'Shipping / unit',color:C.red,values:persp.map(p=>p.a.ship)},
            {name:'Net revenue / unit',color:C.navy2,values:persp.map(p=>p.a.nru)}]});
  note(c3,`Shipping per unit moved ${persp.map(p=>`${PMETA[p.id].short} ${R(p.a.ship)}`).join(' → ')},
    which is ${persp.map(p=>PC(p.a.shipPctRev,1)).join(' → ')} of net revenue.`);
}

/* --- product CAC across the three periods (the July / August view) -------- */
function renderCacByPeriod(s){
  const c=card(s,'Product CAC by period — Apr–Jun, July, August',
    'actual marketing ÷ actual units, straight from each month\'s P&L sheet');
  const rows=fp().map(p=>{
    const a=p.per.aj,j=p.per.jul,g=p.per.aug;
    return {p,a,j,g,
      dJ:(a&&j&&a.cac)?(j.cac-a.cac)/Math.abs(a.cac):null,
      dA:(j&&g&&j.cac)?(g.cac-j.cac)/Math.abs(j.cac):null};
  }).filter(r=>(r.a&&r.a.units>0)||(r.j&&r.j.units>0)||(r.g&&r.g.units>0));
  const cell=(rec,f)=>rec&&rec.units>0?f(rec):null;
  table(c,[
    {h:'SKU',v:r=>r.p.code,l:1},{h:'Product',v:r=>r.p.name,l:1},
    {h:'Apr–Jun units',v:r=>cell(r.a,x=>x.units),f:F.n},
    {h:'Jul units',v:r=>cell(r.j,x=>x.units),f:F.n},
    {h:'Aug units',v:r=>cell(r.g,x=>x.units),f:F.n},
    {h:'Apr–Jun CAC',v:r=>cell(r.a,x=>x.cac),f:F.r},
    {h:'Jul CAC',v:r=>cell(r.j,x=>x.cac),f:F.r},
    {h:'Aug CAC',v:r=>cell(r.g,x=>x.cac),f:F.r},
    {h:'Jul vs Apr–Jun',v:r=>r.dJ,f:v=>v==null?'—':`<span class="${v>0?'down':'up'}">${v>0?'▼':'▲'} ${PCS(v)}</span>`},
    {h:'Aug vs Jul',v:r=>r.dA,f:v=>v==null?'—':`<span class="${v>0?'down':'up'}">${v>0?'▼':'▲'} ${PCS(v)}</span>`},
    {h:'Jul break-even CAC',v:r=>cell(r.j,x=>x.maxCacBE),f:F.r,neg:1},
    {h:'Jul target CAC',v:r=>cell(r.j,x=>x.maxCacTgt),f:F.r,neg:1},

    {h:'Aug break-even CAC',v:r=>cell(r.g,x=>x.maxCacBE),f:F.r,neg:1},
    {h:'Aug target CAC',v:r=>cell(r.g,x=>x.maxCacTgt),f:F.r,neg:1},

    {h:'Aug excess spend',v:r=>cell(r.g,x=>x.cacExcess),f:F.rl},

  ],rows,{sort:18,name:'product_cac_by_period',maxH:'620px'});
  const aj=PORT.aj,jl=PORT.jul,ag=PORT.aug;
  note(c,`Portfolio CAC per unit moved ${R(aj.cac)} → ${R(jl.cac)} → ${R(ag.cac)}
    while the break-even ceiling moved ${R(aj.maxCacBE)} → ${R(jl.maxCacBE)} → ${R(ag.maxCacBE)}.
    The gap between what a unit costs to acquire and what it can afford widened from ${R(aj.cac-aj.maxCacBE)}
    to ${R(ag.cac-ag.maxCacBE)} per unit. ▼ marks a CAC increase, which is the unfavourable direction.`);

function renderBreakeven(){
  const s=sec('s-be','15','Break-even quantity','Volume needed to cover the overhead charge',
    `Break-even quantity = fixed cost allocation ÷ contribution per unit. The fixed cost is the SKU's own
     overhead charge for the period; contribution is CM2 per unit, which is already net of marketing.

  table(c,[

    {h:'Actual qty',v:r=>r.v.units,f:F.n},
