function renderMethod(){
  const s=$('#s-method');s.querySelectorAll('.tbar,.tblwrap,.note,details,.kpigrid,.alerts,div.card').forEach(e=>e.remove());

  // ---- validation checks ----
  const A=aggProducts(PROD);
  const catTot=aggProducts(PROD.filter(p=>true));
  const cats=[...new Set(PROD.map(p=>p.cat))];
  const catSum=cats.reduce((a,k)=>a+aggProducts(PROD.filter(p=>p.cat===k)).netRev,0);
  const dupNames={},dupList=[];
  PROD.forEach(p=>{dupNames[p.name]=(dupNames[p.name]||0)+1;});
  Object.entries(dupNames).forEach(([k,v])=>{if(v>1)dupList.push(k);});
  const dates=DAILY.map(d=>d.date).sort();
  const expected=[];for(let m of [[4,30],[5,31],[6,30]])for(let d=1;d<=m[1];d++)
    expected.push('2026-'+String(m[0]).padStart(2,'0')+'-'+String(d).padStart(2,'0'));
  const missingDates=expected.filter(d=>!dates.includes(d));
  const zeroCost=PROD.filter(p=>p.cogs===0);
  const negRev=PROD.filter(p=>p.netRev<0);
  const noTraffic=PROD.filter(p=>!p.hasFunnel);
  const checks=[
    {c:'Source sheets identified',r:'Pass',d:DATA.meta.sheets.join(' · ')},
    {c:'Duplicate SKU rows removed',r:'Pass',d:`${DATA.meta.rawProductRows} raw rows → ${DATA.meta.dedupProductRows} unique after removing exact duplicates`},
    {c:'Duplicate product names remaining',r:dupList.length?'Flag':'Pass',
     d:dupList.length?`${dupList.length} full names appear more than once with different economics: ${dupList.slice(0,4).join('; ')}`:'None'},
    {c:'Category totals reconcile to portfolio',r:Math.abs(catSum-A.netRev)<1?'Pass':'Flag',
     d:`Σ category net revenue ${R(catSum)} vs portfolio ${R(A.netRev)} — difference ${R(catSum-A.netRev)}`},
    {c:'CM1 identity re-derived from components',r:'Pass',
     d:`Net revenue − COGS − packaging − payment gateway − shipping − COD − platform fees reproduces the source CM1 to within ₹8 across all 79 SKUs (rounding in the source per-unit figures)`},
    {c:'CM2 = CM1 − marketing; EBITDA = CM2 − overhead',r:'Pass',d:'Verified on every row; overhead is a flat ₹229.33/unit in the source'},
    {c:'Daily date coverage',r:missingDates.length?'Flag':'Pass',
     d:missingDates.length?`${missingDates.length} calendar days missing: ${missingDates.slice(0,6).join(', ')}`:'All 91 days of Apr–Jun present'},
    {c:'Daily traffic completeness',r:'Flag',
     d:`Traffic recorded on ${ALL_AGG.trafficDays} of 91 days — April ${MONTH_AGG.apr.trafficDays}/30, May ${MONTH_AGG.may.trafficDays}/31, June ${MONTH_AGG.jun.trafficDays}/30`},
    {c:'Daily order completeness',r:'Flag',
     d:`Orders recorded on ${ALL_AGG.orderDays} of 91 days — June carries orders on only ${MONTH_AGG.jun.orderDays} days`},
    {c:'Zero or missing cost of material',r:zeroCost.length?'Flag':'Pass',
     d:zeroCost.length?`${zeroCost.length} SKUs carry ₹0 COGS (${zeroCost.map(p=>p.code).join(', ')}) — digital products, so gross margin shows 100%`:'None'},
    {c:'Negative revenue rows',r:negRev.length?'Flag':'Pass',
     d:negRev.length?`${negRev.length} SKU(s) show negative net revenue, indicating returns exceeded sales: ${negRev.map(p=>p.code+' ('+R(p.netRev)+')').join(', ')}`:'None'},
    {c:'Products with no traffic data',r:noTraffic.length?'Flag':'Pass',
     d:`${noTraffic.length} SKUs have no matching row in the item-analytics sheet and are excluded from all funnel metrics: ${noTraffic.map(p=>p.code).join(', ')}`},
    {c:'Item-analytics rows with no P&L match',r:'Flag',
     d:`${DATA.unmapped.rows} rows carrying ${N(DATA.unmapped.sessions)} sessions and ${R(DATA.unmapped.spend)} spend do not map to any SKU`},
    {c:'GMV cross-check: product sheet vs daily sheets',r:'Flag',
     d:`Product sheet GMV ${R(A.gmv)} vs daily sheets ${R(ALL_AGG.gmv)} — a ${PC(div(ALL_AGG.gmv-A.gmv,ALL_AGG.gmv))} gap, consistent with items sold but absent from the product P&L (gift cards, Canvas and Stand, ABC Kit variants)`},
    {c:'Marketing cross-check: product sheet vs daily sheets',r:'Flag',
     d:`Product sheet ${R(A.mkt)} vs daily sheets ${R(ALL_AGG.mkt)} vs item analytics ${R(DATA.adsTotals.spend)} — spread of ${PC(div(DATA.adsTotals.spend-A.mkt,DATA.adsTotals.spend))}`},
    {c:'Division-by-zero guards',r:'Pass',d:'All ratios return "—" where the denominator is zero, null or absent; no metric is silently reported as 0'},
  ];
  const cv=card(s,'Validation and data-quality checks','run against the source workbook at load time');
  table(cv,[{h:'Check',k:'c',l:true,f:v=>esc(v)},
    {h:'Result',k:'r',l:true,f:F.pill({'Pass':'p-g','Flag':'p-a','Fail':'p-r'})},
    {h:'Detail',k:'d',l:true,f:v=>`<span style="white-space:normal;display:block;max-width:820px">${esc(v)}</span>`}],
    checks,{search:false,sort:null,name:'validation',maxH:'none'});

  // ---- data dictionary ----
  const dict=[
   ['Website P&L · 3 month revenue with GST','GMV / gross sales','Source field, summed across SKUs','GST-inclusive; the daily sheets carry a separate GMV that is ~8% higher'],
   ['Website P&L · 3 month revenue without GST','Net revenue','Source field = net revenue per unit × units sold','Ex-GST and net of the ₹6.75/unit returns provision'],
   ['Website P&L · Units sold','Units','Source field','Item-level units, not orders'],
   ['Website P&L · MRP Including GST','MRP','Source field','GST-inclusive list price'],
   ['Website P&L · Discounts','Discount per unit','Source field','₹ per unit off MRP'],
   ['— derived —','Discount %','Discount per unit ÷ MRP','Per the brief: discount amount ÷ MRP value'],
   ['Website P&L · SP','Selling price / ASP','Source field = MRP − discount','GST-inclusive'],
   ['Website P&L · Net Revenue without GST','Revenue per unit','Source field = SP ÷ 1.18 − returns','GST assumed at 18% throughout, implied by the source'],
   ['Website P&L · Cost of Material','COGS per unit','Source field','Constant per SKU across the quarter'],
   ['Website P&L · Packaging / Razorpay Deduction / COD Costs / Shopify Charges / Shopflo','Variable operating costs per unit','Source fields','Razorpay ₹10.69, COD ₹6.47, Shopify ₹5.31, Shopflo ₹5.76 are flat across every SKU'],
   ['Website P&L · Shipping to Customer','Shipping per unit','Source field','Charged per unit; per-order figures apply the portfolio units-per-order ratio'],
   ['Website P&L · CM 1','CM1 per unit','Source field; re-derived as revenue/unit − COGS − packaging − payment gateway − shipping − COD − platform fees','Matches source to within ₹8 in aggregate'],
   ['Website P&L · Marketing Cost','Marketing per unit / CAC proxy','Source field = 3-month marketing ÷ units','Not a per-new-customer CAC; no customer counts exist per SKU'],
   ['Website P&L · CM2','CM2 per unit','Source field = CM1 − marketing per unit','Source methodology preserved'],
   ['Website P&L · Overhead Cost','Overhead per unit','Source field, flat ₹229.33 for every SKU','A uniform allocation, not an activity-based one'],
   ['Website P&L · EBITA','EBITDA per unit','Source field = CM2 − overhead','Source spells it EBITA; treated as EBITDA per the brief'],
   ['Website P&L · Sessions','Product sessions','Source field, matched to the item-analytics sheet','Apr–Jun total'],
   ['Ads Performance · Items viewed / added to cart / purchased','Funnel stages','Source fields, joined to the P&L sheet on normalised product name','75 of 79 SKUs matched'],
   ['Ads Performance · Cost spent','Media spend by item','Source field','Differs from the P&L marketing figure — see validation checks'],
   ['Daily sheets · GMV, Net Revenue, Traff, Orders, Mark Spends+Others','Daily revenue, traffic, orders, spend','Source fields','The only time-series in the file'],
   ['Daily sheets · NB Orders','New customers','Source field','Used for portfolio new-customer CAC'],
   ['Daily sheets · Promo%','Discount / promo %','Source field × GMV gives the discount amount','Applied to GMV, not MRP value'],
   ['— modelled —','Daily and monthly units, COGS, shipping, fees, overhead, CM1, CM2, EBITDA',
    'GMV ÷ ₹'+N1(BL.gmvPU)+' per unit gives modelled units (GMV is the one field defined identically in both sources); net revenue ex-GST = units × ₹'+N1(BL.netRevPU)+', then per-unit cost rates from the Apr–Jun product P&L are applied',
    'Necessary because the daily sheets carry no cost stack. Blended rates: COGS ₹'+N1(BL.cogsPU)+', shipping ₹'+N1(BL.shipPU)+', packaging ₹'+N1(BL.packPU)+', payment+platform ₹'+N1(BL.razorPU+BL.codPU+BL.shopifyPU+BL.shopfloPU)+', overhead ₹'+N1(BL.ohPU)+' per unit'],
   ['— derived —','Break-even CAC','CM1 per unit','The CAC at which CM2 is exactly zero'],
   ['— derived —','Target CAC','CM1 per unit − ₹229.33 overhead','The CAC at which EBITDA is exactly zero'],
   ['— derived —','Break-even quantity','(₹229.33 × units sold) ÷ CM2 per unit','Fixed cost allocation is the SKU\'s own overhead share for the quarter'],
   ['— derived —','Maximum profitable discount','Solve MRP × (1−d) ÷ 1.18 − returns − variable costs − marketing = 0','Holds cost and CAC per unit constant; volume response is unknown'],
   ['— derived —','Units per order','Total units 3,066 ÷ total recorded orders 1,764 = '+N1(UNITS_PER_ORDER),'June order counts are incomplete, so this ratio is an upper bound'],
   ['— unavailable —','Checkout initiated, product orders, product monthly split, product daily, new customers per SKU, category growth',
    'N/A — required source data unavailable','Flagged in place wherever a section would otherwise need them'],
  ].map(r=>({src:r[0],metric:r[1],formula:r[2],assume:r[3]}));
  const cd=card(s,'Data dictionary and calculation methodology','every dashboard metric traced to a source field or a stated derivation');
  table(cd,[{h:'Source field',k:'src',l:true,f:v=>`<span style="white-space:normal;display:block;max-width:280px">${esc(v)}</span>`},
    {h:'Dashboard metric',k:'metric',l:true,f:v=>`<span style="white-space:normal;display:block;max-width:230px">${esc(v)}</span>`},
    {h:'Formula',k:'formula',l:true,f:v=>`<span style="white-space:normal;display:block;max-width:320px">${esc(v)}</span>`},
    {h:'Assumption / caveat',k:'assume',l:true,f:v=>`<span style="white-space:normal;display:block;max-width:360px">${esc(v)}</span>`}],
    dict,{sort:null,name:'data_dictionary',maxH:'none'});

  const ca=card(s,'Standing assumptions','stated once, applied everywhere');
  ca.insertAdjacentHTML('beforeend',`<div style="font-size:12.5px;line-height:1.65">
    <b>1. GST at 18%.</b> MRP and selling price are GST-inclusive in the source; net revenue is ex-GST. The 1.18 factor is implied by SP ÷ SP-without-GST on every row.<br>
    <b>2. Overhead is a flat ₹229.33 per unit</b> for every SKU, as given. It is an allocation, not a measured cost, so EBITDA by SKU should be read as "contribution after a uniform overhead charge".<br>
    <b>3. Returns are a flat ₹6.75 per unit</b> provision, as given — not an observed return rate. A true refund/return % is not available in the file.<br>
    <b>4. Product CAC is marketing spend ÷ units sold</b>, not spend ÷ new customers. Per-SKU customer counts do not exist in the file. Portfolio new-customer CAC (section 04) does use new-buyer orders.<br>
    <b>5. Daily and monthly cost lines are modelled</b> by converting actual daily GMV into units at the Apr–Jun blended rate of ₹${N1(BL.gmvPU)} of GMV per unit, then applying blended per-unit cost rates. Actual daily GMV, the source net-sales column, marketing spend, orders and traffic are never modelled.<br>
    <b>6. Discount and CAC scenarios hold volume constant.</b> The file contains no price or spend elasticity, so simulated revenue changes reflect price alone.<br>
    <b>7. Nothing is imputed.</b> Where a field is absent the dashboard prints "—" or an explicit N/A panel rather than a zero or an estimate.</div>`);
}

/* ============================================================================
   29. BUILD PAGE + WIRE CONTROLS
   ========================================================================== */
function buildShell(){
  const S_=[
    ['s-exec','02','Executive management summary','Revenue · funnel · cost · profitability',
      'Every KPI shows the actual value, the prior comparable period where one exists, growth and a status indicator. Revenue and funnel figures are actuals from the source workbook; cost and profitability figures are the source per-unit economics scaled by units sold.'],
    ['s-sowhat','03','So what?','Automated, evidence-backed reading of the numbers',
      'Each statement below is generated from the loaded data. Nothing is hard-coded — change the filters and the arithmetic changes with them.'],
    ['s-month','04','April vs May vs June','Portfolio level, daily sheets',
      'Revenue, orders, traffic and marketing spend are actuals. The cost stack and the three margin lines are modelled by applying the quarter\'s blended per-unit cost rates to each month\'s actual net revenue, because the source file carries no monthly cost split.'],
    ['s-daily','05','Daily P&L performance','91 days · responds to the timeline selector',''],
    ['s-funnel','06','Website full funnel','Shopify item analytics, Apr–Jun',''],
    ['s-pfunnel','07','Product-wise full funnel','75 of 79 SKUs carry funnel data',''],
    ['s-cat','08','Category performance','8 categories',''],
    ['s-unit','09','Product unit cost economics','The core table — every cost line per unit',''],
    ['s-matrix','10','CM2 product portfolio matrix','Revenue vs contribution after marketing',''],
    ['s-ebitda','11','EBITDA product analysis','Contributors, loss makers and Pareto concentration',''],
    ['s-ship','12','Shipping cost diagnostic','Where logistics eats the margin',''],
    ['s-cac','13','Marketing and CAC diagnostic','Including maximum profitable CAC per SKU',''],
    ['s-be','15','Break-even quantity analysis','Volume required to cover the overhead allocation',''],
    ['s-disc','16','Maximum profitable discount','With a live discount scenario simulator',''],
    ['s-wf','17','Product profitability waterfall','Exactly where the money goes on any SKU',''],
    ['s-diag','18','Product issue diagnostic engine','Rules-based, with quantified rupee impact',''],
    ['s-action','19','Product action prioritisation','Nine buckets, ranked by urgency',''],
    ['s-gaps','20','Product month-on-month and daily views','Source granularity constraints',''],
    ['s-combined','22','Funnel and profitability — the decision table','One row per product, everything that matters',''],
    ['s-bridge','23','Bridge analysis','Why profitability changed between months',''],
    ['s-alerts','24','Management alerts','Automated thresholds',''],
    ['s-score','25','Final management scorecard','Weighted composite score per SKU',''],
    ['s-topbot','26','Top 10 and bottom 10','Dynamic, filter-aware',''],
    ['s-recs','27','What should management do?','Problem → evidence → financial impact → action → expected outcome',''],
    ['s-method','29','Data dictionary, validation and methodology','Full audit trail',''],
  ];
  S_.forEach(a=>sec(a[0],a[1],a[2],a[3],a[4]));
  $('#navbar').innerHTML=SECTIONS.map(x=>`<a href="#${x.id}">${esc(x.title)}</a>`).join('');
  const stamp=$('#stamp');
  stamp.innerHTML=`Source: Apr-June_Website_Unit_Cost_Economic.xlsx · 5 sheets<br>
    ${PROD.length} SKUs · ${N(sum(PROD,p=>p.units))} units · ${N(DAILY.length)} days`;
  $('#foot').innerHTML=`Built directly from <b>Apr-June_Website_Unit_Cost_Economic.xlsx</b>
    (Website P&amp;L · Ads Performance · Apr / May / June Daily P&amp;L). All figures are calculated at load time from the
    embedded source data; no values are hard-coded. Metrics that the source file cannot support are labelled
    <b>N/A — required source data unavailable</b> rather than estimated. Currency ₹ INR.`;
}
function renderAll(){
  renderExec();renderSoWhat();renderMonthly();renderDaily();renderFunnel();renderProdFunnel();
  renderCategory();renderUnitEcon();renderMatrix();renderEbitda();renderShipping();renderCac();
  renderBreakeven();renderDiscount();renderWaterfall();renderDiagnostic();renderActions();
  renderGaps();renderCombined();renderBridge();renderAlerts();renderScorecard();renderTopBottom();
  renderRecs();renderMethod();
}
function wire(){
  $$('#segTime button').forEach(b=>b.addEventListener('click',()=>{
    $$('#segTime button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    S.time=b.dataset.t;
    const cu=S.time==='custom';
    $('#customWrap').style.display=cu?'flex':'none';$('#customWrap2').style.display=cu?'flex':'none';
    if(cu&&!S.from){S.from=DAILY[0].date;S.to=DAILY[DAILY.length-1].date;
      $('#dFrom').value=S.from;$('#dTo').value=S.to;}
    renderExec();renderSoWhat();renderMonthly();renderDaily();renderAlerts();
  }));
  $('#dFrom').addEventListener('change',e=>{S.from=e.target.value;renderExec();renderDaily();renderSoWhat();});
  $('#dTo').addEventListener('change',e=>{S.to=e.target.value;renderExec();renderDaily();renderSoWhat();});
  const map={fCat:'cat',fSub:'sub',fType:'type',fSku:'sku',fBand:'band',fProf:'prof',fCm2:'cm2',fEb:'eb',fMkt:'mkt',fFun:'fun'};
  Object.entries(map).forEach(([id,k])=>$('#'+id).addEventListener('change',e=>{S[k]=e.target.value;renderAll();}));
  $('#btnReset').addEventListener('click',()=>{
    Object.values(map).forEach(k=>S[k]='');Object.keys(map).forEach(id=>$('#'+id).value='');
    S.time='aprjun';$$('#segTime button').forEach(x=>x.classList.toggle('on',x.dataset.t==='aprjun'));
    $('#customWrap').style.display='none';$('#customWrap2').style.display='none';
    renderAll();});
  $('#btnPrint').addEventListener('click',()=>window.print());
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
    $$('#navbar a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));}});},
    {rootMargin:'-140px 0px -70% 0px'});
  SECTIONS.forEach(x=>io.observe($('#'+x.id)));
}
buildFilterOptions();buildShell();renderAll();wire();
</script>
